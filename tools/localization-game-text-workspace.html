function filename(suffix){return `${(state?.project.name||'Avalon_Localization').replace(/[^\p{L}\p{N}._-]/gu,'_').slice(0,60)}_${suffix}`;}
function saveProject(){if(!state){notify('Start or open a project first.');return;}try{const serialized=C.serializeSnapshot(state);download(filename('project.json'),serialized);unsavedExport=false;notify(serialized.startsWith('{\n')?'Your project file is downloading. Keep this newest copy safe.':'Your project file is downloading. It was packed small to fit the size limit. Nothing was lost.');}catch(e){showError('Could not save the project file',[e.message]);}}
function openDialog(title,subtitle,body,footerHTML='',kind='generic'){lastFocus=document.activeElement;const d=$('#modal');if(d.open)d.close();d.innerHTML=`<div class="dialog-head"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div>${btn('Close','close-modal','ghost small','aria-label="Close dialog"')}</div><div class="dialog-body" id="dialog-body">${body}</div>${footerHTML?`<div class="dialog-footer">${footerHTML}</div>`:''}`;modalKind=kind;modalDirty=false;d.showModal();d.scrollTop=0;setTimeout(()=>{d.querySelector('input:not([type=checkbox]),textarea,select')?.focus();},30);}
function closeDialog(force=false){if(!force&&modalDirty&&!window.confirm('Throw away the changes you made in this window?'))return false;$('#modal').close();modalDirty=false;modalKind='';lastFocus?.focus?.();return true;}
function showError(title,errors){openDialog(esc(title),'Nothing changed. Your work is still here.',`<div class="notice error"><ul>${(Array.isArray(errors)?errors:[errors]).map(s=>`<li>${esc(typeof s==='string'?s:JSON.stringify(s))}</li>`).join('')}</ul></div>`,btn('Back to the tool','close-modal','primary'));}
function dialogError(errors){let el=$('#dialog-error');if(!el){el=document.createElement('div');el.id='dialog-error';el.className='modal-error';$('#dialog-body').prepend(el);}el.innerHTML=(Array.isArray(errors)?errors:[errors]).map(s=>`<div>${esc(typeof s==='string'?s:JSON.stringify(s))}</div>`).join('');el.scrollIntoView({block:'nearest'});}
function replacementGuard(action,title){const current=state||cached;const body=`<p>${esc(title)}</p>${current?`<div class="notice warning"><strong>${esc(current.project.name||'Untitled game')}</strong> ${state?'is open':'is saved in this browser'}. This will replace it. Save a project file first to keep its ${(current.tools.localization?.payload.entries||[]).length} lines of text and any data from other Avalon tools.</div><p class="small">Save your current project file before you go on. Two projects with the same name are still different projects.</p>`:'<p class="muted small">This makes a brand new project with its own ID.</p>'}`;openDialog('Start a different project','Your open project in this browser will be replaced.',body,`<div>${current?btn('Save current project file',state?'export-project':'export-cached'):''}</div><div class="right">${btn('Cancel','close-modal')}${btn('Continue',action,'primary')}</div>`,'replace');}

function render(){const nav=$('#nav');nav.innerHTML=navItems.map(([id,title,ic])=>`<button type="button" data-view="${id}" ${view===id?'aria-current="page"':''}>${icon(ic)}${title}</button>`).join('');$('#project-title').textContent=state?state.project.name||'Untitled game':'Your words, in every language.';$('#save-project').disabled=!state;const renderer=state?({overview:renderOverview,entries:renderEntries,guide:renderGuide,lab:renderLab,readiness:renderReadiness,files:renderFiles,help:renderHelp}[view]||renderOverview):renderStart;$('#content').innerHTML=renderer()+footer();if(view==='lab'&&state)updateLab();}
function navigate(v){if(profileDirty&&!window.confirm('Throw away the changes on this page that are not saved yet?'))return;profileDirty=false;view=v;if(!state&&v==='help'){$('#content').innerHTML=renderHelp()+footer();$('#nav').querySelectorAll('button').forEach(x=>x.toggleAttribute('aria-current',x.dataset.view==='help'));return;}render();window.scrollTo({top:0});}
function renderStart(){return `<section class="hero"><div><div class="kicker">Free tool for game makers</div><h1>Get your game ready<br>for every language.</h1><p>Localization means getting your game’s text ready for players who speak other languages. Keep all your game text in one place. Add notes so translators know what each line means. Then catch mistakes before players see them.</p><div class="inline-links" style="color:#d4e5d7"><span>Works offline</span><span>No sign-up</span><span>Free</span><span>Roblox or any game engine</span></div></div><div class="hero-art" aria-label="Example text, and a fake longer version for testing"><div class="hero-string"><small>shop.welcome / your text</small><span class="tag">en-US</span><strong>Welcome, {playerName}.</strong></div><div class="hero-string"><small>Fit test / fake longer text</small><span class="tag">+35%</span><strong>[ Ŵëľçømë, {playerName}. ~~~ ]</strong></div></div></section>
${cached?`<div class="notice section-gap"><strong>Saved work found in this browser: ${esc(cached.project.name||'Untitled game')}</strong><p>${esc(cached.project.gameVersion||'Version not set')} · Last changed ${dateTime(cached.tools.localization?.updatedAt||now())}. Browser saves can get erased. Save a project file to keep a copy.</p>${btn('Keep working on it','resume','primary small')}</div>`:''}
<div class="grid3 start-options"><article class="card start-option"><div class="index">01 / START</div><h3>Start from scratch</h3><p>Pick the language you write in and the languages you want. Then add your first line of text.</p>${btn('Start from scratch '+icon('plus'),'new-project','primary')}</article><article class="card start-option"><div class="index">02 / EXPLORE</div><h3>Try an example</h3><p>See a sample Roblox game with a shop, a quest, and a settings menu. Some parts are left unfinished on purpose, so you can see the checks work.</p>${btn('Try an example '+icon('arrow'),'example')}</article><article class="card start-option"><div class="index">03 / CONTINUE</div><h3>Open your saved project</h3><p>A project file is the .json file this tool saves for you. It can come from this tool or another Avalon tool.</p>${btn('Open project file','import-project')}</article></div>

function statsHTML(r){return `<div class="stats"><div class="stat"><span class="label">LINES OF TEXT</span><strong>${r.entryCount}</strong><small>${payload().targetLocales.length} language${payload().targetLocales.length===1?'':'s'} to translate into</small></div><div class="stat"><span class="label">APPROVED TRANSLATIONS</span><strong>${r.approvedCurrent}<span style="font-size:16px;color:#657269"> / ${r.translationSlots}</span></strong><small>Each line in each language. Skips Do not translate lines.</small></div><div class="stat ${r.stale?'alert':''}"><span class="label">NEED A NEW CHECK</span><strong>${r.stale}</strong><small>Your text changed after it was translated</small></div><div class="stat ${r.errors?'alert':''}"><span class="label">MUST FIX</span><strong>${r.errors}</strong><small>${r.warnings} more things to check</small></div></div>`;}
function renderOverview(){const p=payload(),r=C.report(state);const readyByLocale=p.targetLocales.map(code=>{const eligible=p.entries.filter(e=>!e.doNotTranslate);const n=eligible.filter(e=>{const t=e.translations[code];return t?.status==='approved'&&t.sourceRevision===e.revision&&t.text.trim()&&!r.issues.some(i=>i.entryId===e.id&&i.severity==='error'&&(!i.locale||i.locale===code||i.locale===p.sourceLocale));}).length;return `<div class="locale-row"><span class="mono">${esc(code)}</span><div class="progress"><span style="width:${eligible.length?n/eligible.length*100:0}%"></span></div><span class="small">${n}/${eligible.length}</span></div>`;}).join('');const recent=p.entries.flatMap(e=>e.history.map(h=>({...h,key:e.key,id:e.id}))).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,4);return pageHead('Your project at a glance.','See what is done and what to do next.',btn(icon('plus')+' Add text','add-entry','primary')+btn('Edit project','profile'))+statsHTML(r)+`<div class="grid2"><section class="card"><div class="card-title"><h2>What to do next</h2><span class="badge">Next steps</span></div><ol class="mini-list"><li><strong>${p.targetLocales.length?'Check your languages':'Pick the languages you want'}</strong><small class="muted">Your language: ${esc(p.sourceLocale)}. Only add languages you can get checked.</small></li><li><strong>Lines that need a note for the translator: ${r.issues.filter(i=>i.code==='missing-context').length}</strong><small class="muted">Say where players see each line and what it means.</small></li><li><strong>${r.missing} translations are still missing</strong><small class="muted">Send the translator brief. Then add the translations you get back.</small></li><li><strong>${r.stale} translations need a new check</strong><small class="muted">You changed your text after it was translated. The old translation is kept, but someone should check it again.</small></li></ol><div class="form-actions">${btn('Open ready check','go-readiness')}</div></section><section class="card"><div class="card-title"><h2>Progress by language</h2><span class="badge">Counted for you</span></div>${readyByLocale||'<div class="empty"><h3>No languages picked yet</h3><p>Click Language setup to pick the languages you want.</p></div>'}<p class="small muted">A line counts as done when it has a translation, someone checked it, it matches your newest text, and it has no must-fix problems. This shows progress, not how good the translation is.</p><div class="form-actions">${btn('Language setup','profile')}</div></section></div>
<section class="card section-gap"><div class="card-title"><h2>${esc(state.project.name||'Untitled game')}</h2>${btn('Edit project','profile','small')}</div><div class="profile-summary">${[['Platform',state.project.platform],['Engine',state.project.engine],['Game version',state.project.gameVersion],['Players',state.project.targetAudience],['Stage',state.project.stage],['Devices',state.project.targetDevices.join(', ')]].map(([a,b])=>`<div><small>${a}</small><strong>${esc(b||'Not set')}</strong></div>`).join('')}</div></section>

function effectiveStatus(e,code){const t=e.translations[code];if(e.doNotTranslate)return 'do-not-translate';if(!t||!t.text.trim())return 'missing';if(t.sourceRevision!==e.revision)return 'needs-review';return t.status;}

function renderEntries(){const p=payload();if(!localeFilter||!p.targetLocales.includes(localeFilter))localeFilter=p.targetLocales[0]||'';const groups=[...new Set(p.entries.map(e=>e.group).filter(Boolean))].sort();const filters=`<div class="toolbar no-print"><label class="search">Search text<input id="entry-search" value="${attr(search)}" placeholder="Text ID, words, or notes"></label><label>Group<select id="group-filter">${option('','All groups',groupFilter)}${groups.map(g=>option(g,g,groupFilter)).join('')}</select></label><label>Language<select id="locale-filter">${p.targetLocales.length?p.targetLocales.map(l=>option(l,l,localeFilter)).join(''):option('','No languages yet','')}</select></label><label>Status<select id="status-filter">${[['','All statuses'],...Object.entries(statusNames),['needs-review','Needs review'],['do-not-translate','Do not translate']].map(([a,b])=>option(a,b,statusFilter)).join('')}</select></label><label>Group rows by<select id="group-by">${[['group','Group'],['status','Status'],['none','No grouping']].map(([a,b])=>option(a,b,groupBy)).join('')}</select></label></div>`;return pageHead('Game text','Every line of text in your game lives here. Each line has a Text ID: a short name your game code uses to find it. Click a line to edit it and its translations.',btn('Import a spreadsheet (CSV)','import-records')+btn(icon('plus')+' Add text','add-entry','primary'))+filters+`<div id="register-body">${renderEntryRows()}</div><p class="small muted section-gap">Character limits count every letter, space, symbol, and line break. They do not measure how wide the text looks on screen. This tool never cuts your text short.</p>`;}
function renderEntryRows(){const p=payload(),r=C.report(state);let list=filteredEntries();const keyGroup=e=>groupBy==='status'?effectiveStatus(e,localeFilter):e.group||'Ungrouped';if(groupBy!=='none')list=[...list].sort((a,b)=>keyGroup(a).localeCompare(keyGroup(b))||a.key.localeCompare(b.key));const pages=Math.max(1,Math.ceil(list.length/40));page=Math.min(page,pages);const shown=list.slice((page-1)*40,page*40);let last='';const rows=shown.map(e=>{const gr=keyGroup(e),groupRow=groupBy!=='none'&&gr!==last?`<tr class="group-row"><td colspan="6">${esc(groupBy==='status'?(statusNames[gr]||gr):gr)}</td></tr>`:'';last=gr;const issues=r.issues.filter(i=>i.entryId===e.id&&(!i.locale||i.locale===localeFilter||i.locale===p.sourceLocale)),t=e.translations[localeFilter],stale=t?.text&&t.sourceRevision!==e.revision;return groupRow+`<tr><td class="select-cell"><input type="checkbox" data-select="${attr(e.id)}" ${selected.has(e.id)?'checked':''} aria-label="Select ${attr(e.key||'untitled entry')}"></td><td class="text-cell"><button class="key-btn" data-action="edit-entry" data-id="${attr(e.id)}">${esc(e.key||'(no Text ID)')}</button><div class="source" dir="auto">${esc(e.source||'(no text yet)')}</div></td><td><span class="small">${esc(e.group||'Ungrouped')}</span><div class="muted small">Version ${e.revision}${e.variant.kind!=='none'?' · '+esc(e.variant.kind):''}</div></td><td>${e.doNotTranslate?badge('Do not translate'):badge(t?.status||'missing',stale)}${t?.provenance?`<div class="muted small">${esc(t.provenance.slice(0,50))}</div>`:''}</td><td>${issues.length?`<span class="badge ${issues.some(i=>i.severity==='error')?'error':'warning'}">${issues.length} problem${issues.length===1?'':'s'}</span>`:'<span class="muted small">No problems</span>'}</td><td>${btn('Open','edit-entry','small',`data-id="${attr(e.id)}"`)}</td></tr>`;}).join('');return `${selected.size?`<div class="register-selected no-print"><strong>${selected.size} selected</strong>${btn('Change all selected','bulk','small')}${btn('Delete selected','bulk-delete','danger small')}${btn('Clear selection','clear-selection','ghost small')}</div>`:''}<section class="card flush"><div class="table-top no-print"><label class="check checkbox-all" style="margin:0"><input type="checkbox" id="select-all" ${shown.length&&shown.every(e=>selected.has(e.id))?'checked':''}> Select this page (${shown.length})</label></div>${shown.length?`<div class="table-wrap"><table><thead><tr><th></th><th>Text ID / your text</th><th>Group</th><th>${esc(localeFilter||'Translation')}</th><th>Problems</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty"><h3>${p.entries.length?'Nothing matches':'No game text yet'}</h3><p>${p.entries.length?'Try a different search or filter.':'Click Add text to add your first line. Type the exact words players will see.'}</p>${btn('Add text','add-entry','primary')}</div>`}<div class="table-bottom"><span>Showing ${list.length} of ${p.entries.length} lines</span><div class="pagination no-print">${btn('Previous','previous-page','small',page===1?'disabled':'')}<span>Page ${page} of ${pages}</span>${btn('Next','next-page','small',page>=pages?'disabled':'')}</div></div></section>`;}

function profileDialog(){const p=payload(),s=state.project;openDialog('Project and language setup','Change your project details and pick your languages.',`<form id="profile-form"><div class="form-grid">${field('Project name','p-name',s.name,'The name of your game.')}${field('Game version','p-version',s.gameVersion,'For example 0.4.2.')}${field('Platform','p-platform',s.platform)}${field('Game engine','p-engine',s.engine,'For example Roblox Studio, Unity, or Godot.')}${field('Genre','p-genre',s.genre)}${field('Stage','p-stage',s.stage,'How far along is it? For example idea, prototype, or launched.')}${field('Who are your players?','p-audience',s.targetAudience,'For example kids 10 to 14, or groups of friends.')}${field('One play session (minutes)','p-session',s.sessionLengthMinutes??'','How long people usually play at once. Leave blank if you are not sure.',{type:'number',attrs:'min="0" step="any"'})}${field('Devices','p-devices',s.targetDevices.join(', '),'Put commas between them, like Phone, Tablet.')}${field('Big ideas for your game (design pillars)','p-pillars',s.designPillars.join('\n'),'One idea per line.',{area:true})}${field('Your language (code)','p-source',p.sourceLocale,'The language you write your game in. Use a code like en-US (English, United States). If you change it, every translation will need a new check.',{attrs:'list="locale-presets"'})}${field('Languages to translate into (codes)','p-locales',p.targetLocales.join(', '),'Put commas between codes. Examples: es-ES (Spanish), ja-JP (Japanese), ar-001 (Arabic), pt-BR (Portuguese, Brazil). Leave blank if you have not decided.')}</div><datalist id="locale-presets">${R.robloxLocales.map(l=>`<option value="${attr(l.code)}">${esc(l.name)}</option>`).join('')}</datalist><div class="notice warning">If you remove a language, its translations are kept but marked as not on your list. Changing your language does not translate anything for you. Check your choices before you save.</div><div class="mono-id">Project function saveProfile(){const val=id=>$('#'+id).value;const source=C.canonicalLocale(val('p-source').trim());const raw=val('p-locales').split(',').map(x=>x.trim()).filter(Boolean),targets=raw.map(C.canonicalLocale);const errors=[];if(!source)errors.push('Type a real language code for your language, like en-US.');if(targets.some(x=>!x))errors.push('These language codes do not work: '+raw.filter((x,i)=>!targets[i]).join(', '));if(new Set(targets).size!==targets.length)errors.push('Each language can only be listed once.');const minutes=val('p-session')===''?null:Number(val('p-session'));if(minutes!==null&&(!Number.isFinite(minutes)||minutes<0))errors.push('Play session length must be blank or a number of minutes (0 or more).');if(errors.length)return dialogError(errors);const next=C.clone(state),p=next.tools.localization.payload,oldSource=p.sourceLocale;Object.assign(next.project,{name:val('p-name'),gameVersion:val('p-version'),platform:val('p-platform'),engine:val('p-engine'),genre:val('p-genre'),stage:val('p-stage'),targetAudience:val('p-audience'),sessionLengthMinutes:minutes,targetDevices:val('p-devices').split(',').map(x=>x.trim()).filter(Boolean),designPillars:val('p-pillars').split('\n').map(x=>x.trim()).filter(Boolean)});if(oldSource!==source){for(const e of p.entries){e.history.push({at:now(),kind:'source-language-change',locale:'',revision:e.revision,detail:`Source locale changed from ${oldSource} to ${source}. Review existing text and translations.`,before:{sourceLocale:oldSource,source:e.source,sourceForms:C.clone(e.sourceForms),translations:C.clone(e.translations)}});e.revision++;}}p.sourceLocale=source;p.targetLocales=targets;if(markChange(next)){profileDirty=false;closeDialog(true);notify('Project and languages saved.');}}
function entryDialog(id=null){editOriginal=id?C.clone(getEntry(id)):null;editDraft=editOriginal?C.clone(editOriginal):C.newEntry({group:groupFilter});drawEntryDialog();}
function formCats(entry,locale,stored){const rule=C.expectedForms(entry,locale);return {rule,categories:[...new Set([...rule.categories,...Object.keys(stored||{})])].filter(c=>!['__proto__','prototype','constructor'].includes(c)&&(c!=='other'||Object.prototype.hasOwnProperty.call(stored||{},'other')))};}
function drawEntryDialog(){const e=editDraft,p=payload(),sourceCats=formCats(e,p.sourceLocale,e.sourceForms),locales=[...new Set([...p.targetLocales,...Object.keys(e.translations)])];const tokenInfo=C.placeholders(e.source,e.syntax);const body=`<form id="entry-form"><div class="editor-grid"><section class="editor-panel"><h3>01 / Your text and notes</h3>${field('Text ID (key)','e-key',e.key,'A short name your game code uses to find this text, like shop.welcome. Capital letters matter. Do not change it once your game uses it.')}${field(e.variant.kind==='none'?`Your text · ${esc(p.sourceLocale)}`:`Your text · ${esc(p.sourceLocale)} · main (other) form`,'e-source',e.source,'Type the exact words players will see, with the same punctuation and line breaks. Keep fill-in spots like {playerName} as they are. The game swaps in the real value.',{area:true,rows:4})}<div id="token-display" class="tokens">${tokenInfo.tokens.length?tokenInfo.tokens.map(x=>`<code>${esc(x)}</code>`).join(''):'<span class="small muted">No fill-in spots like {playerName} found.</span>'}</div><p id="source-count" class="count-note">${count(e.source)} characters · text version ${e.revision}</p>${field('Note for the translator','e-context',e.context,'Who sees this? What does it mean? What happens next?',{area:true})}${field('Where it shows up','e-reference',e.reference,'For example Shop / buy button. Links are saved as text only. This tool does not open them.',{area:true,rows:2})}<div class="form-grid">${field('Group','e-group',e.group,'Lines in the same group stay together, like Shop or Settings.')}${field('Character limit','e-max',e.maxChars??'','The most characters that fit. Leave blank if you do not know. 0 means none.',{type:'number',attrs:'min="0" max="1000000" step="1"'})}${field('Speaker','e-speaker',e.speaker)}${field('Tone','e-tone',e.tone,'How it should sound, like friendly or scary.')}</div><details class="details"><summary>Fill-in spots and game code settings</summary><div class="details-body">${selectField('Fill-in spot style','e-syntax',e.syntax,[['braces','Named braces: {playerName}'],['roblox','Roblox: {coins:int} or {1}'],['none','No fill-in spots'],['unresolved','Some other style (not checked)']],'Other styles, like ICU or printf, are not checked here. Ask your developer how your game handles them.')}${field('What each fill-in spot means','e-placeholder-notes',e.placeholderNotes,'Give example values. Remind testers to try a very long player name.',{area:true})}${field('Roblox object path (Context)','e-roblox-context',e.robloxContext,'Where the text lives in Roblox Studio, like Workspace.Shop.Greeting. Your translator note goes in the Example column.')}</div></details><details class="details" ${e.variant.kind!=='none'?'open':''}><summary>Different versions (like 1 coin and 2 coins)</summary><div class="details-body">${selectField('Does this text change?','e-kind',e.variant.kind,[['none','No, just one version'],['plural','Yes, by number (1 coin, 2 coins)'],['gender','Yes, by a choice you set (like a character type)']])}${field('Name of the deciding value','e-selector',e.variant.selector,'The value your game uses to pick a version, like count or characterForm.')}${field('Choices','e-options',e.variant.options.join(', '),'Only for the choice type. Put commas between them and always include other. You pick these for your game.')}<p class="small muted">${e.variant.kind==='plural'?`Number forms your browser knows for ${esc(p.sourceLocale)}: ${sourceCats.rule.supported?esc(sourceCats.rule.categories.join(', ')):'unknown'}. Browser language: ${esc(sourceCats.rule.resolvedLocale||'unknown')}.`:e.variant.kind==='gender'?'Check every version with a translator. Text that changes by both a number and a choice is not supported yet.':'Pick a type above if this text changes based on a number or a choice.'}</p>${sourceCats.categories.map(cat=>`<label>Your text, ${esc(cat)} form<textarea data-source-form="${attr(cat)}" maxlength="20000" dir="auto">${esc(e.sourceForms[cat]||'')}</textarea>${cat==='other'||!sourceCats.rule.categories.includes(cat)?btn('Remove this extra form','remove-source-form','danger small',`data-form="${attr(cat)}"`):''}</label>`).join('')}${e.variant.kind!=='none'?'<p class="small muted">The main text box above is the other form. Your game code still needs to pick the right form.</p>':''}</div></details><details class="details"><summary>Notes and screenshots</summary><div class="details-body">${field('Your notes','e-notes',e.notes,'Questions or reminders about this line.',{area:true})}<label class="check"><input type="checkbox" id="e-dnt" ${e.doNotTranslate?'checked':''}> Do not translate this line. Keep it the same in every language (good for names).</label><p class="small muted">Add up to 2 pictures (PNG, JPEG, or WebP, up to 200 KB each). They help the translator see where the text goes. They are saved in your project file and the translator brief.</p><div class="screenshot-list">${(e.screenshots||[]).map((s,i)=>`<div class="screenshot"><img src="${attr(s.data)}" alt="${attr(s.name)}"><span>${esc(s.name)}</span>${btn('Remove','remove-screenshot','danger small',`data-index="${i}"`)}</div>`).join('')}</div>${btn('Add a screenshot','add-screenshot','small',(e.screenshots||[]).length>=2?'disabled':'')}</div></details></section>
<section class="editor-panel"><h3>02 / Translations</h3><div class="notice">This tool does not translate for you. Paste in a translation, say where it came from, then say who checked it.</div>${locales.length?locales.map((code,i)=>{const t=e.translations[code]||C.newTranslation(e.revision),cats=formCats(e,code,t.forms),stale=t.sourceRevision!==e.revision;return `<details class="details" ${i===0||code===localeFilter?'open':''}><summary>${esc(code)} · ${esc(localeName(code))} ${badge(t.status,stale)}</summary><div class="details-body"><p class="small muted">${p.targetLocales.includes(code)?'On your language list':'This language is not on your list. It is kept until you add it back or move it.'}${e.variant.kind==='plural'?` · Number forms: ${cats.rule.supported?esc(cats.rule.categories.join(', ')):'unknown'} (${esc(cats.rule.resolvedLocale||'browser language unknown')})`:''}</p><label>${e.variant.kind==='none'?'Translation':'Translation: main (other) form'}<textarea data-t-field="text" data-locale="${attr(code)}" maxlength="20000" rows="3" dir="auto" lang="${attr(code)}">${esc(t.text)}</textarea></label>${cats.categories.map(cat=>`<label>Translation, ${esc(cat)} form<textarea data-t-form="${attr(cat)}" data-locale="${attr(code)}" maxlength="20000" dir="auto" lang="${attr(code)}">${esc(t.forms[cat]||'')}</textarea>${cat==='other'||!cats.rule.categories.includes(cat)?btn('Remove this extra form','remove-target-form','danger small',`data-form="${attr(cat)}" data-locale="${attr(code)}"`):''}</label>`).join('')}<div class="form-grid"><label>Status<select data-t-field="status" data-locale="${attr(code)}">${Object.entries(statusNames).map(([value,label])=>option(value,label,t.status)).join('')}</select></label><label>Checked by<input data-t-field="reviewer" data-locale="${attr(code)}" value="${attr(t.reviewer)}" maxlength="20000" placeholder="Name or username"></label></div><label>Where it came from<input data-t-field="provenance" data-locale="${attr(code)}" value="${attr(t.provenance)}" maxlength="20000" placeholder="Who or what made it, and when. For example: Ana, May 3"></label><label class="check"><input type="checkbox" data-confirm-locale="${attr(code)}"> I compared this translation to my text above. Tick this to mark it Checked by a person or Approved, or to renew an old check.</label><p class="small muted">Translated from text version ${t.sourceRevision===null?'(unknown)':t.sourceRevision}. Your text is now version ${e.revision}. Changing your text makes a new version when you save.</p></div></details>`;}).join(''):'<div class="empty"><h3>No languages picked yet</h3><p>Save this line. Then pick languages in Language setup.</p></div>'}<details class="details section-gap"><summary>History (${e.history.length} changes)</summary><div class="details-body">${e.history.length?e.history.slice().reverse().map(h=>`<div class="history-item"><strong>${esc(h.kind)}</strong> · ${esc(h.locale||'source')} · r${h.revision}<br><span class="muted">${esc(dateTime(h.at))}</span><p>${esc(h.detail)}</p><details><summary>Show old values</summary><pre>${esc(JSON.stringify(h.before,null,2))}</pre></details></div>`).join(''):'<p class="small muted">Changes show up here after you save.</p>'}</div></details></section></div><div id="draft-findings" class="section-gap"></div></form>`;
openDialog(editOriginal?'Edit a line of text':'Add a line of text',`Your text, its translations, and its history stay together. ${editOriginal?'You are editing a saved line.':'This makes a new line.'}`,body,`<div>${editOriginal?btn('Delete this line','delete-entry','danger small',`data-id="${attr(e.id)}"`):''}</div><div class="right">${btn('Check for problems','check-entry')}${btn('Cancel','close-modal')}${btn('Save line','save-entry','primary')}</div>`,'entry');}
function collectEntry(){if(!$('#entry-form'))return;const previous={'e-key':editDraft.key,'e-source':editDraft.source,'e-context':editDraft.context,'e-reference':editDraft.reference,'e-group':editDraft.group,'e-speaker':editDraft.speaker,'e-tone':editDraft.tone,'e-syntax':editDraft.syntax,'e-roblox-context':editDraft.robloxContext,'e-placeholder-notes':editDraft.placeholderNotes,'e-notes':editDraft.notes,'e-kind':editDraft.variant.kind,'e-selector':editDraft.variant.selector,'e-options':editDraft.variant.options.join(', ')};const val=id=>exactInput($('#'+id),previous[id])??'';Object.assign(editDraft,{key:val('e-key'),source:val('e-source'),context:val('e-context'),reference:val('e-reference'),group:val('e-group'),speaker:val('e-speaker'),tone:val('e-tone'),syntax:val('e-syntax'),robloxContext:val('e-roblox-context'),placeholderNotes:val('e-placeholder-notes'),notes:val('e-notes'),doNotTranslate:$('#e-dnt').checked,maxChars:val('e-max')===''?null:Number(val('e-max'))});editDraft.variant={kind:val('e-kind'),selector:val('e-selector'),options:val('e-options').split(',').map(x=>x.trim()).filter(Boolean)};$$('[data-source-form]').forEach(el=>{const cat=el.dataset.sourceForm;if(Object.prototype.hasOwnProperty.call(editDraft.sourceForms,cat)||el.value!=='')editDraft.sourceForms[cat]=exactInput(el,editDraft.sourceForms[cat]);});$$('[data-t-field]').forEach(el=>{const code=el.dataset.locale;if(!editDraft.translations[code])editDraft.translations[code]=C.newTranslation(editDraft.revision);editDraft.translations[code][el.dataset.tField]=exactInput(el,editDraft.translations[code][el.dataset.tField]);});$$('[data-t-form]').forEach(el=>{const code=el.dataset.locale;if(!editDraft.translations[code])editDraft.translations[code]=C.newTranslation(editDraft.revision);const cat=el.dataset.tForm;if(Object.prototype.hasOwnProperty.call(editDraft.translations[code].forms,cat)||el.value!=='')editDraft.translations[code].forms[cat]=exactInput(el,editDraft.translations[code].forms[cat]);});}
function editedCandidate(){collectEntry();const e=editOriginal?C.clone(editOriginal):C.newEntry({id:editDraft.id});const patch=C.clone(editDraft);delete patch.translations;delete patch.history;delete patch.revision;C.changeSource(e,patch);if(!editOriginal){e.revision=1;e.history=[];}const changedLocales=[];for(const [code,t] of Object.entries(editDraft.translations)){const old=editOriginal?.translations[code]||C.newTranslation(1),confirm=$$('[data-confirm-locale]').find(el=>el.dataset.confirmLocale===code)?.checked;const same=['text','forms','status','provenance','reviewer'].every(k=>JSON.stringify(old[k])===JSON.stringify(t[k]));if(same&&!confirm)continue;const v=C.clone(t);if(['human-reviewed','approved'].includes(v.status)&&!confirm)throw new Error(`${code}: tick the box that says you compared this translation to your text, or set the status to Draft.`);if(confirm||!editOriginal?.translations[code])v.sourceRevision=e.revision;else v.sourceRevision=editOriginal.translations[code].sourceRevision;C.updateTranslation(e,code,v);changedLocales.push(code);}return {entry:e,changedLocales};}
function checkEntryDraft(){try{const {entry:e}=editedCandidate(),issues=C.entryIssues(e,payload(),[...payload().entries.filter(x=>x.id!==e.id),e]);$('#draft-findings').innerHTML=`<h3>Problem check · ${issues.length} found</h3>${issues.length?issues.slice(0,60).map(i=>`<div class="notice ${i.severity==='error'?'error':i.severity==='warning'?'warning':''}"><strong>${esc(i.locale||'Your text')} · ${esc(i.message)}</strong><p>${esc(i.suggestion)}</p></div>`).join(''):'<div class="notice">No problems found. Someone who speaks the language should still read it, and you should still test it in your game.</div>'}`;$('#draft-findings').scrollIntoView({block:'start'});}catch(e){dialogError(e.message);}}
function saveEntry(){try{const {entry:e,changedLocales}=editedCandidate();const duplicate=payload().entries.find(x=>x.id!==e.id&&x.key===e.key&&e.key.trim());if(duplicate)return dialogError(`The Text ID ${e.key} is already used. Pick a different one, or open the line that has it. Nothing was overwritten.`);const issues=C.entryIssues(e,payload(),[...payload().entries.filter(x=>x.id!==e.id),e]);const badApprovals=issues.filter(i=>i.severity==='error'&&changedLocales.some(code=>e.translations[code]?.status==='approved'&&(!i.locale||i.locale===code||i.locale===payload().sourceLocale)));if(badApprovals.length)return dialogError(['This approved translation has must-fix problems. Fix them, or set its status to Draft.',...badApprovals.map(i=>i.message)]);if(transaction(p=>{const ix=p.entries.findIndex(x=>x.id===e.id);if(ix>=0)p.entries[ix]=e;else p.entries.push(e);})){closeDialog(true);notify('Line saved'+(e.revision>(editOriginal?.revision||1)?'. Its translations now need a new check.':'.'));}}catch(e){dialogError(e.message);}}
function drawGuideList(){const q=($('#glossary-search')?.value||'').toLocaleLowerCase();const items=payload().glossary.filter(g=>[g.term,g.definition,g.notes].some(x=>x.toLocaleLowerCase().includes(q)));return items.length?`<div class="table-wrap"><table><thead><tr><th>Word</th><th>Meaning</th><th>In other languages</th><th></th></tr></thead><tbody>${items.map(g=>`<tr><td><strong>${esc(g.term||'(no word)')}</strong><br>${g.doNotTranslate?badge('Do not translate'):badge('Use this word')}</td><td class="text-cell pre">${esc(g.definition)}${g.notes?`<div class="muted small">${esc(g.notes)}</div>`:''}</td><td>${Object.entries(g.translations).map(([code,text])=>`<div><span class="mono small">${esc(code)}</span> <span dir="auto">${esc(text)}</span></div>`).join('')||'<span class="muted">None yet</span>'}</td><td>${btn('Edit','edit-term','small',`data-id="${attr(g.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>No words here yet</h3><p>Click Add a word to add names and words that mean something special in your game.</p></div>';}
function renderGuide(){const p=payload();return pageHead('Word guide','Help translators use the same words and the same voice in every language. A word list (glossary) explains special words in your game.',btn('Add a word','add-term','primary'))+`<div class="grid2"><section class="card"><h2>How your game should sound</h2><p class="small muted">Tell translators how your game talks. Is it silly or serious? Friendly or formal? Add any rules for certain languages.</p>${field('Style notes','style-notes',p.styleNotes,'If a rule is only for one language, write that language name first.',{area:true,rows:8})}${btn('Save notes and questions','save-guide','primary small')}</section><section class="card"><h2>Questions for translators</h2><p class="small muted">Write down anything that could be confusing. These questions go in the translator brief.</p>${field('Questions','translation-questions',p.questions,'Write one question per line.',{area:true,rows:8})}</section></div><section class="card flush section-gap"><div class="table-top"><div class="card-title"><h2>Word list (glossary)</h2><span class="badge">${p.glossary.length} words</span></div><label class="no-print" style="margin-bottom:0">Search words<input id="glossary-search" placeholder="Word, meaning, or notes"></label></div><div id="glossary-list">${drawGuideList()}</div></section><div class="notice section-gap">The word check looks for the exact spelling, and capital letters matter. It can spot a missing name. It cannot tell if the grammar or meaning is right.</div>`;}
function termDialog(id){if(profileDirty&&$('#style-notes')){const next=C.clone(state);next.tools.localization.payload.styleNotes=exactInput($('#style-notes'),next.tools.localization.payload.styleNotes);next.tools.localization.payload.questions=exactInput($('#translation-questions'),next.tools.localization.payload.questions);if(!markChange(next,{render:false}))return;profileDirty=false;}const term=id?C.clone(payload().glossary.find(g=>g.id===id)):{id:C.uuid(),term:'',definition:'',doNotTranslate:false,translations:{},notes:''};editDraft=term;openDialog(id?'Edit a word':'Add a word','Your word list goes in the translator brief.',`${field('Word','g-term',term.term)}${field('What it means','g-definition',term.definition,'Explain what it means in your game, not just in a dictionary.',{area:true})}<label class="check"><input type="checkbox" id="g-dnt" ${term.doNotTranslate?'checked':''}> Do not translate this word. Keep it exactly the same.</label><div class="form-grid">${[...new Set([...payload().targetLocales,...Object.keys(term.translations)])].map((code,i)=>`<label>Word to use in ${esc(code)}<input data-term-locale="${attr(code)}" value="${attr(term.translations[code]||'')}" maxlength="20000" dir="auto"></label>`).join('')}</div>${field('Notes','g-notes',term.notes,'Capital letters, words not to use, or where it shows up.',{area:true})}`,`<div>${id?btn('Delete word','delete-term','danger small',`data-id="${attr(id)}"`):''}</div><div class="right">${btn('Cancel','close-modal')}${btn('Save word','save-term','primary')}</div>`,'term');}
function saveTerm(){const g=C.clone(editDraft);g.term=exactInput($('#g-term'),g.term);g.definition=exactInput($('#g-definition'),g.definition);g.notes=exactInput($('#g-notes'),g.notes);g.doNotTranslate=$('#g-dnt').checked;$$('[data-term-locale]').forEach(el=>g.translations[el.dataset.termLocale]=exactInput(el,g.translations[el.dataset.termLocale]));if(!g.term.trim())return dialogError('Type the word first.');if(payload().glossary.some(t=>t.id!==g.id&&t.term===g.term))return dialogError('That word is already in your list. Edit that one instead.');if(transaction(p=>{const ix=p.glossary.findIndex(x=>x.id===g.id);if(ix<0)p.glossary.push(g);else p.glossary[ix]=g;})){closeDialog(true);notify('Word saved.');}}
function renderLab(){const p=payload();if(!p.entries.some(e=>e.id===lab.id))lab.id=p.entries[0]?.id||'';return pageHead('Text fit test','Some languages need more space than English. Make your text longer on purpose and see if it still fits in a button.')+`<div class="lab-grid"><section class="card lab-controls"><h3>Test settings</h3><label>Line of text<select id="lab-entry">${p.entries.map(e=>option(e.id,e.key||'(no Text ID)',lab.id)).join('')}</select></label><label>Show text in<select id="lab-locale">${option('source','My language',lab.locale)}${p.targetLocales.map(l=>option(l,l,lab.locale)).join('')}</select></label><label>Test type<select id="lab-mode">${[['pseudo','Fake accents and longer'],['expand','Just longer'],['original','Real text, no changes']].map(([v,t])=>option(v,t,lab.mode)).join('')}</select></label><label>Make text longer by: <span id="expansion-value">${lab.expansion}</span>%<input type="range" id="lab-expansion" min="0" max="120" step="5" value="${lab.expansion}"><span class="hint">This is a test amount, not a guess about real translations. Fill-in spots like {playerName} stay the same.</span></label><label>Button width: <span id="width-value">${lab.width}</span> pixels<input type="range" id="lab-width" min="160" max="560" step="10" value="${lab.width}"></label><label>Reading direction<select id="lab-direction">${[['ltr','Left to right (like English)'],['rtl','Right to left (like Arabic)'],['auto','Auto (follow the text)']].map(([v,t])=>option(v,t,lab.direction)).join('')}</select></label>${field('Test number (for 1 coin vs 2 coins)','lab-number',lab.number,'Shows which number form gets used. Fill-in spots are not filled in here.',{type:'number',attrs:'step="any"'})}<div class="notice">This is only a quick test in your browser. Always test in your real game too.</div></section><section><div class="lab-stage"><div class="game-mock" id="game-mock"><div class="mock-icon" aria-hidden="true">A</div><div class="mock-heading">Game panel · test</div><p class="mock-body" id="mock-body"></p><div class="mock-button" id="mock-button"></div></div></div><p class="mock-caption" id="mock-caption"></p><div class="lab-counts"><div>Real text characters<strong id="lab-original-count">0</strong></div><div>Test text characters<strong id="lab-preview-count">0</strong></div><div>Your limit<strong id="lab-limit">Not set</strong></div></div><div class="notice section-gap" id="lab-result"></div><div class="card section-gap"><h3>Checklist for right-to-left languages (like Arabic)</h3><ul class="small muted"><li>Use a real translation that a fluent speaker checked. Look at names, numbers, punctuation, and fill-in spots.</li><li>In your game, check how text lines up and wraps. Check menus and any arrows or icons that point left or right.</li><li>Make sure the font shows every letter and nothing gets cut off on each device size.</li><li>Ask a fluent speaker which parts of the screen should flip. Just moving English text to the right is not a real test.</li></ul></div></section></div>`;}
function updateLab(){
  const e=payload().entries.find(x=>x.id===lab.id);
  if(!e){$('#mock-body').textContent='Add a line of text to start.';$('#mock-button').textContent='No text yet';return;}
  const code=lab.locale==='source'?payload().sourceLocale:lab.locale,t=e.translations[code];
  const hasProbe=lab.number!==null&&Number.isFinite(lab.number);
  let form='other',text=lab.locale==='source'?e.source:t?.text??'',rule=C.expectedForms(e,code);
  if(e.variant.kind==='plural'&&rule.supported&&hasProbe){
    try{form=new Intl.PluralRules(code,{type:'cardinal'}).select(lab.number);text=lab.locale==='source'?(form==='other'?e.source:e.sourceForms[form]??''):(form==='other'?t?.text??'':t?.forms?.[form]??'');}catch{}
  }
  const preview=!text?'':lab.mode==='pseudo'?C.pseudolocalize(text,lab.expansion):lab.mode==='expand'?'⟦'+text+' ~'.repeat(Math.ceil(count(text)*lab.expansion/200))+'⟧':text;
  $('#game-mock').style.width=lab.width+'px';$('#game-mock').setAttribute('dir',lab.direction);$('#game-mock').setAttribute('lang',code);$('#mock-body').textContent=preview||'No translation for this form yet.';$('#mock-button').textContent=preview||'No translation yet';$('#expansion-value').textContent=lab.expansion;$('#width-value').textContent=lab.width;$('#lab-original-count').textContent=count(text);$('#lab-preview-count').textContent=count(preview);$('#lab-limit').textContent=e.maxChars??'Not set';$('#mock-caption').textContent=lab.mode==='original'?'Your real saved text. Nothing was translated.':'FAKE TEST TEXT ONLY. This is never saved as a translation.';
  let formNote='';
  if(e.variant.kind==='plural'){
    formNote=!rule.supported?`Your browser does not know the number forms for ${esc(code)}, so the main form is shown.`:!hasProbe?'No test number given, so the main form is shown.':`For ${esc(code)}, the number ${lab.number} uses the ${esc(form)} form.`;
    if(rule.supported)formNote+=` Browser language: ${esc(rule.resolvedLocale)}.`;
  }else if(e.variant.kind==='gender')formNote='Showing the main (other) form.';
  const b=$('#mock-button'),clips=b.scrollWidth>b.clientWidth;$('#lab-result').className='notice section-gap'+(clips?' warning':'');
  $('#lab-result').innerHTML=`<strong>What we saw:</strong> ${clips?'the text is too long and gets cut off in the button.':'the text fits in the button.'}<br><strong>Test settings:</strong> ${lab.width} pixels wide; ${lab.mode==='original'?'real text':'made '+lab.expansion+'% longer, plus brackets at each end'}. ${formNote}<br><strong>Next step:</strong> ${!text?'Add the missing translation and get it checked.':'Look at both the panel and the button. Then test it in your real game.'}`;
}

function renderFiles(){const p=payload();return pageHead('Save and share','Save your project, make a brief for your translator, or make files for your game.')+`<div class="notice"><strong>Use one project file across Avalon tools.</strong> Save it here, then open it in another tool. Tools do not sync on their own. If you end up with two different copies, you pick which one to keep.</div><div class="grid3"><section class="card export-card"><div class="kicker">01 / Everything</div><h2>Project file</h2><p>Saves everything: all your text, translations, screenshots, and history. Data from other Avalon tools is kept too. This is your backup.</p>${btn('Save project file','export-project','primary')}${btn('Open project file','import-project','small')}</section><section class="card export-card"><div class="kicker">02 / Spreadsheets</div><h2>Game text list</h2><p>One row per line of text, for Google Sheets or Excel. Screenshots and history are only in the project file.</p>${btn('Download spreadsheet (CSV)','export-csv')}${btn('Download text list (JSON)','export-register-json','small')}${btn('Import a spreadsheet','import-records','small')}</section><section class="card export-card"><div class="kicker">03 / For your translator</div><h2>Translator brief (handoff)</h2><p>A page you can print or send to the person translating. It has your text, notes, screenshots, word list, style notes, and questions.</p>${btn('Download translator brief','export-handoff','primary')}${btn('Download AI prompt (optional)','export-prompt','small')}</section><section class="card export-card"><div class="kicker">04 / For your game code</div><h2>Game-ready file (any engine)</h2><p>A JSON file with your approved translations. It also lists what was left out and why. Whoever codes your game needs to hook it up.</p>${btn('Preview game-ready file','generic-preview')}</section><section class="card export-card"><div class="kicker">05 / Roblox</div><h2>Roblox file (CSV)</h2><p>A file you can upload to Roblox, one language at a time. Only approved, simple lines go in. Check what was left out before you download.</p>${btn('Preview Roblox file','native-preview')}</section><section class="card export-card"><div class="kicker">06 / Progress report</div><h2>Ready check report</h2><p>A report you can print. It lists lines missing notes or translations, text that changed, and other problems.</p>${btn('Download ready check report','export-report')}${btn('Print ready check','print-report','small')}</section></div><div class="grid2 section-gap"><section class="card"><h2>Saving in this browser</h2><p class="small ${storageOK?'muted':'warning-text'}">${esc(storageMessage)}</p><p class="small muted">Your work saves in this browser, but it can get erased. Click Save project file to keep a copy on your computer. Saving this web page does not save your project.</p><div class="strip">${btn('Try saving in the browser again','retry-save','small')}${storageConflict?btn('Fix a save conflict','storage-conflict','small'):''}</div><p class="small muted">If you try to close the page with changes you have not saved to a file, the tool warns you. It cannot tell where your downloaded file went.</p></section><section class="card"><h2>Project ID and copies</h2><p class="mono-id">${esc(state.project.id)}</p><p class="small muted">Every project gets its own ID, and it never changes. Two projects with the same name are still different. A copy gets a new ID.</p><div class="strip">${btn('Make a copy','duplicate','small')}${btn('Start from scratch','new-project','small')}${btn('Try an example','example','small')}</div></section></div><section class="card section-gap"><h3>Tools in this project file</h3><div class="table-wrap"><table><thead><tr><th>Tool</th><th>Version</th><th>What happens</th></tr></thead><tbody>${Object.entries(state.tools).map(([key,m])=>`<tr><td class="mono">${esc(key)}</td><td>${esc(m.moduleVersion)}</td><td>${key==='localization'?'You can edit it here':'Kept safe. This tool does not change it.'}</td></tr>`).join('')}</tbody></table></div></section><details class="details section-gap"><summary>Recent spreadsheet imports (${p.importLog.length})</summary><div class="details-body">${p.importLog.length?p.importLog.slice().reverse().map(l=>`<div class="history-item"><pre>${esc(JSON.stringify(l,null,2))}</pre></div>`).join(''):'<p class="small muted">No imports yet.</p>'}</div></details>`;}
function renderHelp(){return pageHead('Help & sources','How to use this tool, what the words mean, and where the rules come from.')+`<div class="grid2"><section class="card"><h2>Quick start</h2><ol class="small"><li>Click Start from scratch or Try an example. Pick your language and the languages you want.</li><li>Add each line of game text. Give it a Text ID, the exact words, and a note about where it shows up.</li><li>Add special words to the word list. Add number forms (1 coin, 2 coins) where needed.</li><li>Send the translator brief. Paste in the translations you get back, or import a spreadsheet.</li><li>Say where each translation came from and who checked it. Then open the Ready check.</li><li>Save your project file. Then make a file for your game.</li></ol><p class="small muted">This whole tool is one web page. It works offline. No sign-up, no paid services, and nothing is sent over the internet.</p><h3>What do these words mean?</h3><ul class="small"><li><strong>Localization:</strong> getting your game’s text ready for players who speak other languages.</li><li><strong>Text ID (key):</strong> a short name, like shop.welcome, that your game code uses to find a line of text.</li><li><strong>Language code (locale):</strong> a short code for a language, like es-ES for Spanish (Spain).</li><li><strong>Fill-in spot (placeholder):</strong> a spot like {playerName} that the game fills in while you play.</li><li><strong>Word list (glossary):</strong> a list that explains special words in your game.</li><li><strong>Translator brief (handoff):</strong> a page you send to your translator with everything they need.</li></ul></section><section class="card"><h2>What each status means</h2><ul class="small"><li><strong>Missing:</strong> no translation yet.</li><li><strong>Draft:</strong> a translation that nobody has checked yet.</li><li><strong>AI draft:</strong> made by an AI or a translation app. Write down which one in Where it came from.</li><li><strong>Checked by a person:</strong> someone who knows the language read it. It still needs approval.</li><li><strong>Approved:</strong> the person in charge says it is good. To go into your game, it must also match your newest text and have all its forms.</li><li><strong>Needs review:</strong> you changed your text after this was translated. The old translation and status are kept until someone checks it again.</li></ul></section></div><section class="card section-gap"><h2>Tips, and what the checks can do</h2><div class="grid2">${R.guide.map(g=>`<div><h3>${esc(g.title)}</h3><p class="small muted">${esc(g.body)}</p></div>`).join('')}</div><p class="small muted">This tool does not translate for you, grade translations, read screenshots, open links, track you, or connect to your game. The example text is made up. The fit test uses fake text and never saves it as a translation.</p></section>
<details class="details section-gap" open><summary>For Roblox: how fields match the Roblox file</summary><div class="details-body"><div class="table-wrap"><table><thead><tr><th>In this tool</th><th>Roblox CSV column</th><th>Meaning</th></tr></thead><tbody><tr><td>key</td><td>Key</td><td>The Text ID. Capital letters matter. Must be unique.</td></tr><tr><td>robloxContext</td><td>Context</td><td>Where the text lives in your game. Not a note for translators.</td></tr><tr><td>context + reference + speaker + tone + notes</td><td>Example</td><td>Your notes for the translator.</td></tr><tr><td>source</td><td>Source</td><td>Your exact text. Cannot be blank.</td></tr><tr><td>Approved translation</td><td>Language code, in lowercase</td><td>For example es-es. One language per file.</td></tr></tbody></table></div><p class="small section-gap">Two lines cannot have the same Key. They also cannot have the same Source and Context together. Cells that start like a spreadsheet formula (for example with =) are blocked. Text with number or choice versions is left out for now. We followed the Roblox docs, but this tool was not tested inside Roblox Studio.</p><p class="small">Each Roblox file has at most 1,000 rows and stays under 2 MB (2,000,000 bytes). Roblox allows up to 10,000 entries in total. This tool cannot see what is already on Roblox, so download your Roblox table and compare before you upload. A blank translation can delete one that is already on Roblox, so blanks are never included.</p><p class="small">The game-ready file is a starting point for Roblox, Unity, Unreal, Godot, or your own engine. Those engines cannot load it directly. Whoever codes your game needs to connect it.</p></div></details>
<details class="details section-gap"><summary>Number forms, choices, fill-in spots, and character limits</summary><div class="details-body"><p class="small">Number forms (like 1 coin and 2 coins) come from your web browser’s language rules (Intl.PluralRules, based on Unicode CLDR). The tool shows which browser language it used. If the browser does not know a language, that rule stays unknown. Order words (1st, 2nd), ICU messages, text that changes by number and choice together, printf, and other formats are not supported yet.</p><p class="small">The main text and translation boxes are the <code>other</code> form. Extra forms are saved in <code>sourceForms</code> and <code>translations[locale].forms</code>. Do not add <code>other</code> there too. Choice versions are options you pick for your game. They always need an <code>other</code> option as a backup. They are not rules for every language.</p><p class="small">Fill-in spots like <code>{playerName}</code> and Roblox spots are checked exactly, including how many times each one shows up. Roblox type labels: ${R.robloxFormatSpecifiers.map(x=>`<code>${esc(x)}</code>`).join(', ')}. Every fill-in spot in your text must also be in every translation. This tool never fills them in.</p><p class="small">Character limits count every character (Unicode code point), including fill-in spots, punctuation, and line breaks. Some accent marks count as their own character. Character count is not the same as how wide text looks. The fit test only checks the sample button in your browser.</p></div></details>
<details class="details section-gap"><summary>For coders: what is inside the project file</summary><div class="details-body"><p class="small">Format <code>avalon.creator-project</code>, root <code>schemaVersion: 1</code>. The project fields are <code>id, name, platform, engine, genre, targetAudience, targetDevices, stage, gameVersion, designPillars, sessionLengthMinutes</code>. Blank numbers stay <code>null</code>. The project ID is a UUID.</p><pre class="code-panel">${esc(JSON.stringify({format:'avalon.creator-project',schemaVersion:1,project:{id:'GENERATE_ONCE_AS_A_UUID',name:'',platform:'',engine:'',genre:'',targetAudience:'',targetDevices:[],stage:'',gameVersion:'',designPillars:[],sessionLengthMinutes:null},tools:{localization:{moduleVersion:1,updatedAt:'ACTUAL_ISO_8601_TIMESTAMP',payload:{sourceLocale:'en-US',targetLocales:[],styleNotes:'',questions:'',entries:[],glossary:[],importLog:[]}}}},null,2))}</pre><p class="small section-gap"><strong>Entry:</strong> id, key, source, context, reference, screenshots, robloxContext, speaker, tone, group, maxChars (integer or null), syntax, placeholderNotes, notes, doNotTranslate, variant {kind, selector, options}, sourceForms, revision, translations, history. Translation values contain text, forms, status, sourceRevision (positive integer or null when unknown), provenance, reviewer, updatedAt. History stores the previous values with a timestamp, type, locale and revision. Glossary items contain id, term, definition, doNotTranslate, translations, notes.</p><p class="small">This tool only changes its own part of the file and the project details you edit. Data from other tools keeps its JSON and version. Files with an unknown version are refused. Before you open a file, you see the project ID, game version, and what will change or be lost. Dates never decide which copy wins.</p><p class="small">Limits: 8 MiB per JSON or CSV file, 3,000 lines of text, 80 languages, 20,000 UTF-16 code units per text box, 32 JSON nesting levels, 150,000 JSON values, 1,000 history changes per line, and 500 import log items. Screenshots: 2 per line, 200 KiB each, PNG, JPEG, or WebP only. If you go over a limit, you get a message and nothing is replaced.</p></div></details>
<details class="details section-gap"><summary>Importing spreadsheets</summary><div class="details-body"><p class="small">CSV files must use commas, UTF-8, and a header row. Put quotes around cells that have quotes or line breaks. JSON files can be a list of flat objects or the <code>avalon.localization-records</code> v1 format. Match your columns to fields before you review. Some fields hold JSON text: <code>variant_json, source_forms_json, translations_json</code>. Blank cells stay blank, and a blank max_chars stays null.</p><p class="small">Add mode makes new lines. If a Text ID already exists, you must skip it or rename it. Update mode adds translations to lines with the exact same Text ID, and you choose Apply for each one. If the file has your original text, it must match exactly. If two rows update the same line and language, you must skip one. The tool never picks the newest row for you.</p><p class="small">The safe spreadsheet file puts quotes around every cell. It adds an apostrophe in front of any cell that could act like a formula, to keep you safe from spreadsheet tricks. If a cell already started with an apostrophe, it gets a second one. The <code>csv_protection=avalon-apostrophe-v1</code> column marks this. When you import that file back and tick the restore box, exactly one extra apostrophe is removed, only where one was added. Files without the marker are not changed. Project files and JSON text lists keep your text exactly.</p><p class="small">Match language codes on purpose. If a row uses a real language that is not on your list, you can add it or skip the row. Unknown fill-in styles are kept and marked not checked. The status and Where it came from in a file are only what the file says. The tool cannot prove who wrote a translation.</p></div></details>
<section class="card section-gap"><h2>Sources and dates checked</h2><p class="small muted">We read these official pages when we built this tool. The explanations above are in our own words. Platforms change, so check the links again before you upload to your game.</p><ol class="source-list">${R.sources.map(s=>`<li><a href="${attr(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><p class="muted">${esc(s.summary)}</p><small>Checked ${esc(s.reviewedOn)} · <span class="mono">${esc(s.url)}</span></small></li>`).join('')}</ol></section><section class="card section-gap"><h3>Sharing and use</h3><p class="small muted">Made by Avalon Partner with Captain Amado. Free to use and share. The tool code and example text are copyright (c) 2026 Joshua Amado. Free and source available under the AmadOpenSource License 1.0. Use it for anything, including paid work; what you make with it is yours. The tool itself may not be sold or turned into a paid product. Other names belong to their owners. Linking to a source does not mean that company supports or works with us. This tool loads no code, fonts, or pictures from the internet.</p></section>`;}
