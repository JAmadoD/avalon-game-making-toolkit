  const glossary = [
    { term: 'Core loop', meaning: 'The actions a player does again and again, and what they get each time. Describe it as what players do, not as a list of systems.', where: 'My game, and watching a playtest.', sourceIds: ['prototype'] },
    { term: 'Acceptance condition ("done when")', meaning: 'Something you can see happen that shows a task works. Say which player, device, and situation.', where: 'The task form. Example: progress comes back after leaving and rejoining.', sourceIds: [] },
    { term: 'DAU', meaning: 'Daily active users: how many different players played on one day. Adding up DAU for many days does not give you the number of different people.', where: 'Creator Hub > your game > Analytics > Engagement. Keep the chart’s dates and how it adds things up.', sourceIds: ['engagement'] },
    { term: 'Sessions and plays', meaning: 'Counts of times people played. They are not always different people. One person can have many sessions or plays. Use the exact meaning from the chart.', where: 'Engagement, Acquisition, or Ads Manager. Write down which report the number came from.', sourceIds: ['engagement', 'ads'] },
    { term: 'Impressions', meaning: 'How many times your game page or ad was shown in one place. Do not mix impressions from one place with plays from another place.', where: 'Creator Hub > Acquisition, or Ads Manager for an ad.', sourceIds: ['discovery', 'ads'] },
    { term: 'Play-through rate', meaning: 'Plays divided by impressions, as a percent. In other words, how often people who saw the game played it. Keep the chart’s exact name, because similar charts can count a bit differently.', where: 'Creator Hub > Acquisition. Use the same source, dates, and filters.', sourceIds: ['discovery'] },
    { term: 'Early bounce', meaning: 'Players who leave very early in their first play. Keep the report’s time cutoff. A different cutoff means a different thing.', where: 'Acquisition > Home Recommendations, if it is there. Write the cutoff in your notes.', sourceIds: ['discovery'] },
    { term: 'Average session time', meaning: 'How long one play session lasts, on average. It can change when different kinds of players show up. It does not show what every player felt.', where: 'Creator Hub > Analytics > Engagement. Enter minutes. Change seconds into minutes if needed.', sourceIds: ['engagement'] },
    { term: 'Cohort', meaning: 'A group of players you follow over time, like all the players who first played on the same day.', where: 'Retention reports. Write down the newest first-play date in the groups.', sourceIds: ['retention'] },
    { term: 'D1 / D7 / D30 retention', meaning: 'The percent of a first-play group who came back exactly 1, 7, or 30 days later. Keep the chart’s meaning and filters. Do not swap in a general "returning players" count.', where: 'Creator Hub > Analytics > Retention. Copy the return-day name and group counts if you have them.', sourceIds: ['retention'] },
    { term: 'Mature retention data', meaning: 'Enough days have passed for a group to reach the return day. Day 7 results for people who joined yesterday are not ready yet.', where: 'Compare the newest first-play date with the date you looked at the report.', sourceIds: ['retention'] },
    { term: 'Percentage points', meaning: 'The plain difference between two percents. Going from 20% to 25% is up 5 percentage points. Compared to where it started, that is also a 25% rise.', where: 'When you compare two sets of numbers in this tool.', sourceIds: [] },
    { term: 'Benchmark', meaning: 'A number to compare to, with its group, date, and meaning. A goal you picked yourself is not the same as a Roblox comparison group.', where: 'Creator Analytics comparison views, if they are there. Write the exact benchmark type.', sourceIds: ['dashboard'] },
    { term: 'Funnel', meaning: 'A set of steps in order, like "start tutorial, finish tutorial, start first round". It shows where players stop. You need to add tracking to your game to get it.', where: 'Creator Hub > Analytics > Funnels, after your published game sends the events.', sourceIds: ['funnels'] },
    { term: 'Onboarding completion', meaning: 'Onboarding means the tutorial or first few minutes. This is the players who reach your last tutorial step, divided by the players who started it. "Finished" must mean the same thing every time.', where: 'Your tutorial funnel. Keep starts and finishes from the same steps and dates.', sourceIds: ['funnels'] },
    { term: 'Second-round continuation', meaning: 'Players who start another round, divided by the players who finished their first. It is your own measure. It is not the same as day 1 retention.', where: 'Your round events, or a carefully counted playtest.', sourceIds: [] },
    { term: 'Daily payer conversion', meaning: 'Daily paying players divided by DAU. In other words, the share of daily players who bought something. For a long date range, copy the percent from the report. Do not mix totals and averages.', where: 'Creator Hub > Analytics > Monetization.', sourceIds: ['monetization'] },
    { term: 'ARPPU', meaning: 'Average revenue per paying user: Robux earned per player who paid. Keep the money type, the payer group, and the dates the same.', where: 'Creator Hub > Analytics > Monetization. Keep the meaning shown there.', sourceIds: ['monetization'] },
    { term: 'ARPDAU', meaning: 'Average revenue per daily active user: Robux earned per daily player. It is not how much a player will spend in all their time, and it does not promise future money.', where: 'Creator Hub > Analytics > Monetization.', sourceIds: ['monetization'] },
    { term: 'Currency earned and spent (sources and sinks)', meaning: 'How much in-game currency players get (sources), and how much gets spent or removed (sinks). Compare the same currency and the same dates.', where: 'Your own game tracking. Name the in-game currency in your notes.', sourceIds: [] },
    { term: 'Cost per play', meaning: 'What you spent on an ad, divided by the plays it brought. Write the money type and how many days you counted results.', where: 'Ads Manager reports, or the Ads & promotion page here.', sourceIds: ['ads'] },
    { term: 'Attributed return', meaning: 'Money linked to an ad, divided by what you spent on it. This does not prove the ad caused all that money.', where: 'Ad reports. Use the same money type, and wait until the counting days are over.', sourceIds: ['ads'] },
    { term: 'Share Link', meaning: 'A special tracking link Roblox makes for your game. Using a different link for each place you post helps you see which one worked.', where: 'Creator Dashboard > Share Links. A normal game link you copy is not a tracking Share Link.', sourceIds: ['share'] },
    { term: 'Earned Robux and cash', meaning: 'Some earned Robux can be traded for real money through DevEx, after a review. Your total Robux, a cash guess, and real cash you got are all different amounts.', where: 'Creator Hub finances and the current DevEx pages. Check the current rates and who qualifies.', sourceIds: ['devex'] },
    { term: 'Paid and owed costs', meaning: 'Paid is money already spent. Owed (committed) is money you promised but have not paid yet. A planned budget is a limit or a guess. It is not an extra payment.', where: 'The costs list. Enter each cost once, in its real money type.', sourceIds: [] },

  function localDay(offset = 0) {
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + offset);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

    return prefix + '-' + token;
  }

function renderField(f,data,prefix=''){
 const value=get(data,f.key)??'',id='f-'+(prefix+f.key).replace(/[^a-zA-Z0-9_-]/g,'-');let opts=f.opts||[];
 if(f.type==='tasks')opts=[['','None'],...project().tasks.filter(t=>t.id!==data.id&&t.scope!=='removed').map(t=>[t.id,t.title])];
 if(f.type==='snapshots')opts=[['','Not selected'],...project().snapshots.map(s=>[s.id,s.label+' ('+s.from+')'])];
 if(f.type==='stages')opts=stageOpts();
 if(['select','tasks','snapshots','stages'].includes(f.type)&&value!==''&&!opts.some(o=>(typeof o==='string'?o:o[0])===value))opts=[[value,String(value)+' (recorded value)'],...opts];
 const attr=`id="${id}" name="${esc(f.key)}" ${f.required?'required':''} ${f.help?`aria-describedby="${id}-help"`:''}`;
 let control;
 if(f.type==='multiselect')control=`<select ${attr} multiple size="${Math.min(6,Math.max(3,opts.length))}">${opts.map(o=>{const [v,l]=typeof o==='string'?[o,o]:o;return `<option value="${esc(v)}" ${(Array.isArray(value)?value:[]).includes(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
 else if(f.type==='lines')control=`<textarea ${attr} data-value-lines maxlength="12000">${esc((Array.isArray(value)?value:[]).join('\n'))}</textarea>`;
 else if(f.type==='checkbox')control=`<label class="check-label" for="${id}"><input type="checkbox" ${attr} ${value?'checked':''}>${esc(f.label)}</label>`;
 else if(['select','tasks','snapshots','stages'].includes(f.type))control=`<select ${attr}>${opts.map(o=>{const [v,l]=typeof o==='string'?[o,o]:o;return `<option value="${esc(v)}" ${value===v?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
 else if(f.type==='textarea')control=`<textarea ${attr} maxlength="12000" placeholder="${esc(f.placeholder||'')}">${esc(value)}</textarea>`;
 else control=`<input type="${f.type||'text'}" ${attr} ${f.type==='number'?'min="0" step="any" inputmode="decimal"':''} ${f.type==='number'&&f.max!==undefined?`max="${f.max}"`:''} ${f.type==='text'?'maxlength="2000"':''} value="${esc(value)}" placeholder="${esc(f.placeholder||'')}">`;
 return `<div class="field ${f.full?'full':''}">${f.type!=='checkbox'?`<label for="${id}">${esc(f.label)}${f.required?' <span aria-label="required">*</span>':''}</label>`:''}${control}${f.help?`<div id="${id}-help" class="hint">${esc(f.help)}</div>`:''}</div>`;
}
function readForm(form){const o={};for(const el of form.elements){if(!el.name||el.disabled)continue;if(el.dataset.valueLines!==undefined)set(o,el.name,el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean));else if(el.multiple)set(o,el.name,Array.from(el.selectedOptions).map(x=>x.value));else if(el.type==='checkbox')set(o,el.name,el.checked);else if(el.type==='number')set(o,el.name,el.value===''?'':Number(el.value));else set(o,el.name,el.value);}return o;}

e, or add your game numbers. Then this tool can suggest a next step.',btn('Open My game','go-profile','primary'),true)}</div></section><section><div class="section-label"><h2>Checks for this step</h2></div><div class="card"><div class="card-head"><div><h3>${esc(s.title)}</h3><p>What you have shown so far</p></div>${pill(sum.status,sum.counts.blocked?'red':sum.ready?'green':'amber')}</div>${s.checks.slice(0,4).map(ch=>`<div class="entry"><div class="entry-number">${gateState(ch)==='pass'?icon('check'):'?'}</div><div class="entry-body"><div class="entry-title">${esc(ch.title)}</div><div class="entry-sub">${esc({pass:'Done, with notes',blocked:'Stuck',na:'Does not apply',needs:'Add a note about what you saw',unreviewed:'Not checked yet'}[gateState(ch)]||'Not checked yet')}</div></div></div>`).join('')}<div class="section-gap">${btn('Open this step','current-stage','soft','arrow')}</div></div><div class="card section-gap"><h3>Budget at a glance</h3>${['cash','robux','credits'].map(k=>`<div class="budget-mini"><span>${esc(labelOf(currencyOpts,k))} remaining</span><b class="mono ${b[k].remaining!==null&&b[k].remaining<0?'neg':''}">${money(b[k].remaining,k)}</b></div>`).join('')}<p class="entry-sub" style="margin-top:12px">Cash, Robux, and ad credits each have their own limit. Money you still owe counts as already used.</p>${btn('Open my costs list','go-budget','small ghost','arrow')}</div></section></div><div class="section-label"><h2>Quick actions</h2></div><div class="shortcuts"><button class="shortcut" type="button" data-action="add-record" data-kind="playtests">${icon('test')}<span><b>Add a playtest</b><small>Write down what players did before you add more.</small></span></button><button class="shortcut" type="button" data-action="add-snapshot">${icon('chart')}<span><b>Add game numbers</b><small>Turn your numbers into a next step.</small></span></button><button class="shortcut" type="button" data-action="add-record" data-kind="updates">${icon('launch')}<span><b>Check an update</b><small>Compare what happened with what you hoped.</small></span></button></div>${fresh?sampleCards():''}`;}
function sampleCards(){return `<section id="example-projects"><div class="section-label"><div><h2>Try an example</h2><p>These are made-up projects for learning. Your own project stays safe.</p></div></div><div class="grid three">${C.templates.map((t,i)=>`<div class="card sample-card"><div class="number">EXAMPLE ${String(i+1).padStart(2,'0')}</div><h3>${esc(t.label)}</h3><p>${esc(t.description)}</p>${btn('Try this example','load-example','small soft','arrow',`data-id="${esc(t.id)}"`)}</div>`).join('')}</div></section>`;}
function baseProfileView(){const p=project(),g=C.genres.find(x=>x.id===p.profile.genre)||C.genres[0];const groups=[{title:'Your game and its players',description:'Answer in your own words. Short answers are fine.',fields:[field('name','Game name','text','',[],{required:true,full:true}),field('profile.stage','Current step','stages'),field('profile.genre','Game type','select','',genreOpts()),field('profile.promise','What will players do, and why is it fun?','textarea','Example: Friends race to brew the funniest potion from clues.',[],{full:true}),field('profile.audience','Who is it for?','textarea','What they like, how much they have played, their language, and age range.'),field('profile.loop','What do players do again and again? (the core loop)','textarea','Use action words: explore, collect, combine, compare, repeat.'),field('profile.difference','Why would someone pick your game?','textarea','What makes it different from other games?',[],{full:true}),field('profile.goal','Main goal','select','',[['learn','Learn how to make games'],['finish','Finish a whole game'],['community','Build a group of players'],['income','Earn money']]),field('profile.successMeasure','What would success look like?','text','Pick something you can see happen.') ]},{title:'People, devices, and tools',description:'Make the plan fit the people and tools you really have.',fields:[field('profile.team','Who is on the team, and what does each person do?','textarea','Working alone? Put your own name and jobs here.'),field('profile.resources','Tools, skills, and assets you have','textarea','Include AI tools and work you can reuse.'),field('profile.weeklyHours','Hours you can work each week','number','Count your real hours, including time spent with AI tools.'),field('profile.launchDate','Goal release date, or next check date','date'),field('profile.minPlayers','Fewest players needed for the fun to work','number'),field('profile.emptyServerPlan','What happens when the server is empty?','textarea','How does the first player start having fun?')]},{title:'Spending limits',description:'Each budget is separate. A blank limit means you have not set one yet.',fields:[field('profile.cashCurrency','Cash currency','select','Changing this only changes the label. It does not convert your amounts.',['USD','EUR','GBP','CAD','AUD','BRL','INR','JPY','MXN','PHP','ZAR']),field('profile.budgetCash','Total cash budget','number'),field('profile.budgetRobux','Total Robux budget','number'),field('profile.budgetCredits','Total ad credit budget','number'),field('profile.monetizationPlan','What could players buy, and why?','textarea','Say what players get, and how you will check that the purchase works.',[],{full:true})]},{title:'The next thing to learn',description:'Let the thing you are least sure about pick your next test.',fields:[field('profile.biggestRisk','What guess could be wrong and ruin the game?','textarea','Example: Players may not understand the clues without help.',[],{full:true}),field('measurementPlan','What should we track?','textarea','Question → what the player does → what you track or see → your choice.',[],{full:true})]}];return pageHead('My game','Fill this in once. Every page uses it.','Your players, core loop, goals, and limits shape the plan, the tests, and the tips.')+`<div class="grid wide"><form id="profile-form" class="card">${groups.map((g,i)=>`<section class="form-section"><div class="form-section-title"><h3>${esc(g.title)}</h3><p>${esc(g.description)}</p></div><div class="form-grid">${g.fields.map(f=>renderField(f,p,'profile')).join('')}${i===1?`<fieldset class="field full"><legend>Devices to support</legend><div class="check-options">${deviceOpts.filter(x=>x[0]!=='all').map(([v,l])=>`<label><input type="checkbox" name="device-${v}" data-device="${v}" ${p.profile.devices.includes(v)?'checked':''}>${l}</label>`).join('')}</div></fieldset>`:''}</div></section>`).join('')}<div class="form-footer"><p>Your work saves in this browser, but it can get erased. Click Save project file to keep a copy on your computer.</p><button type="submit" class="btn primary">Update my plan ${icon('arrow')}</button></div></form><aside class="stack"><div class="card soft"><div class="kicker">Ideas for your game type</div><h2>${esc(g.label)}</h2><p class="read-text"><b>Focus on:</b> ${esc(g.focus)}</p><h4>Example loop</h4><p class="read-text">${esc(g.exampleLoop)}</p><h4>Things you could track</h4><ul class="read-text">${(g.suggestedEvents||[]).map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>${btn('Add these to my tracking plan','genre-prompts','soft','plus')}</div><div class="card"><h3>Keep your answers simple</h3><p class="read-text">These answers are your best guess for now. Change them when playtests teach you something new.</p><div class="note">To start a prototype (a quick test build), you only need a clear idea of the fun and one question to test.</div>${sources(['prototype'])}</div><div class="card"><h3>How your answers are used</h3><div class="entry"><div class="entry-number">1</div><div class="entry-sub">Your players and devices shape your tests and your ad plans.</div></div><div class="entry"><div class="entry-number">2</div><div class="entry-sub">Your core loop becomes the plan for tracking the tutorial and gameplay.</div></div><div class="entry"><div class="entry-number">3</div><div class="entry-sub">Your budget limits show what each new cost will take.</div></div></div></aside></div>`;}
function baseRoadmapView(){const s=stageBy(ui.stage),sum=stageSummary(s),p=project();return pageHead('From idea to launch and beyond','Your step-by-step plan.','Go through the 8 steps in order. Each step has questions to answer and checks to do. A finished checklist helps you decide. You still make the call.',btn('Write down a choice','add-record','','plus','data-kind="decisions"'))+`<div class="stage-grid"><nav class="stage-nav" aria-label="Pick a step">${C.stages.map((s,i)=>`<button type="button" data-action="select-stage" data-value="${s.id}" class="${s.id===ui.stage?'active':''}" aria-pressed="${s.id===ui.stage}"><b>${String(i+1).padStart(2,'0')}</b>${esc(s.title)}</button>`).join('')}</nav><div class="stack"><section class="card"><div class="stage-heading"><div class="stage-icon">${String(C.stages.indexOf(s)+1).padStart(2,'0')}</div><div><div class="kicker">${esc(s.kicker||'Checkpoint')}</div><h2>${esc(s.title)}</h2></div></div><p class="read-text">${esc(s.description)}</p><div class="rule-box"><strong>${esc(s.question)}</strong>${s.exercise?`<p style="margin-top:8px">${esc(typeof s.exercise==='string'?s.exercise:JSON.stringify(s.exercise))}</p>`:''}</div><div class="flex spread wrap section-gap">${pill(sum.status,sum.counts.blocked?'red':sum.ready?'green':'amber')}${btn(p.profile.stage===s.id?'You are on this step':'Make this my current step','set-stage',p.profile.stage===s.id?'small soft':'small','check',`data-value="${s.id}" ${p.profile.stage===s.id?'disabled':''}`)}</div>${sources(s.sourceIds)}</section>${stageWorksheet(s)}<section class="card"><div class="card-head"><div><h2>Checks for this step</h2><p>For each check, write what you saw and which build you tested. Then set the status.</p></div></div>${s.checks.map(ch=>{const v=p.gates[ch.id]||{status:'unreviewed',evidence:'',date:'',build:''};return `<div class="gate"><div><h3>${esc(ch.title)}</h3><p>${esc(ch.why)}</p><label class="sr-only" for="gate-${ch.id}">What you saw for: ${esc(ch.title)}</label><textarea id="gate-${ch.id}" data-gate="${ch.id}" data-key="evidence" maxlength="6000" placeholder="${esc(ch.evidence||'What did you see? Describe the result or paste a link.')}" rows="2">${esc(v.evidence)}</textarea>${['pass','na'].includes(v.status)&&!v.evidence?.trim()?'<div class="entry-sub neg">Write what you saw, or why this does not apply.</div>':''}${sources(ch.sourceIds)}</div><div class="gate-control"><div class="field"><label for="gs-${ch.id}">Status</label><select id="gs-${ch.id}" data-gate="${ch.id}" data-key="status">${[['unreviewed','Not checked yet'],['pass','Passed (I saw it work)'],['blocked','Stuck'],['na','Does not apply']].map(([id,l])=>`<option value="${id}" ${v.status===id?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label for="gd-${ch.id}">Date checked</label><input id="gd-${ch.id}" type="date" data-gate="${ch.id}" data-key="date" value="${esc(v.date)}"></div><div class="field"><label for="gb-${ch.id}">Build</label><input id="gb-${ch.id}" data-gate="${ch.id}" data-key="build" value="${esc(v.build)}" placeholder="Version number" title="The build is the version of your game you tested, like 0.9" maxlength="100"></div></div></div>`}).join('')}</section><section class="card"><div class="card-head"><div><h2>Choices and lessons</h2><p>Write down why you chose to keep going, make it simpler, or pause.</p></div>${btn('Add a choice','add-record','small','plus','data-kind="decisions"')}</div>${recordList('decisions',p.decisions.filter(x=>x.stage===s.id))}</section></div></div>`;}
function baseProductionView(){const content=ui.tab==='budget'?budgetView():tasksView();return pageHead('Tasks and money','Every task should help players.','Tie each task to something players need. Keep track of money you paid and money you still owe.',btn(ui.tab==='budget'?'Add a cost':'Add a task','add-record','primary','plus',`data-kind="${ui.tab==='budget'?'expenses':'tasks'}"`))+renderTabs([['tasks','Tasks'],['budget','Budget']],ui.tab)+content;}
function baseTasksView(){const p=project(),scope=ui.productionScope,items=p.tasks.filter(t=>t.scope===scope&&(!filter||[t.title,t.why,t.owner].join(' ').toLowerCase().includes(filter.toLowerCase())));return `<div class="toolbar"><div class="left"><label class="sr-only" for="task-filter">Find a task</label><input type="search" id="task-filter" placeholder="Search tasks or names…" value="${esc(filter)}"><label class="sr-only" for="scope-select">Which tasks to show</label><select id="scope-select">${[['release','This release'],['test','Next test'],['later','Ideas for later'],['removed','Removed']].map(([v,l])=>`<option value="${v}" ${scope===v?'selected':''}>${l} (${p.tasks.filter(t=>t.scope===v).length})</option>`).join('')}</select></div>${btn('Save tasks as a table','export-kind','small','download','data-kind="tasks" title="Saves a CSV file you can open in Google Sheets"')}</div><div class="note" style="margin-bottom:18px">${scope==='release'?'Keep your first release small, but complete. Every feature you add should have a clear reason.':scope==='test'?'A test is worth it if it answers a question. Write what you will track before you start.':scope==='later'?'Save good ideas here, so they do not slow down this release.':'Removed tasks keep a record of why you cut them. Edit a task to bring it back.'}</div>${items.length?`<div class="board">${[['todo','To do'],['doing','Doing'],['blocked','Stuck'],['done','Done']].map(([id,label])=>`<section class="board-column"><div class="board-head"><span>${label}</span><span>${items.filter(t=>t.status===id).length}</span></div>${items.filter(t=>t.status===id).map(taskCard).join('')||'<p class="entry-sub" style="padding:8px">No tasks here.</p>'}</section>`).join('')}</div>`:empty('No tasks here yet','Click Add a task to start. You can also turn a tip from My game numbers into a task.',btn('Add a task','add-record','primary','plus','data-kind="tasks"'))}<div class="card section-gap"><h3>How to tell a task is done</h3><p class="read-text">“Improve the tutorial” is hard to check. “A new player finishes the first action without help, in a phone playtest” is something you can see. Put a check like that in your task.</p></div>`;}
function baseTaskCard(t){const dep=project().tasks.find(x=>x.id===t.dependency),unresolved=dep&&dep.status!=='done';return `<article class="task-card">${pill(t.priority||'medium',t.priority==='high'?'red':t.priority==='low'?'green':'amber')}<div class="task-title">${esc(t.title)}</div>${t.why?`<div class="task-why">${esc(t.why)}</div>`:''}${unresolved?`<div class="entry-sub neg" style="margin-top:8px">Waiting on: ${esc(short(dep.title,65))}</div>`:''}${t.due?`<div class="entry-sub ${t.due<today()&&t.status!=='done'?'neg':''}" style="margin-top:7px">Due ${esc(t.due)}</div>`:''}<div class="task-bottom"><span class="task-owner">${esc(t.owner||'No one yet')}</span>${btn('<span class="sr-only">Edit '+esc(t.title)+'</span>','edit-record','icon small','edit',`data-kind="tasks" data-id="${esc(t.id)}"`)}</div><label class="sr-only" for="ts-${esc(t.id)}">Status of ${esc(t.title)}</label><select id="ts-${esc(t.id)}" data-task-status="${esc(t.id)}" style="font-size:13px;margin-top:9px;min-height:33px;padding:5px 8px">${[['todo','To do'],['doing','Doing'],['blocked','Stuck'],['done','Done']].map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></article>`;}
function baseBudgetView(){const p=project(),b=E.budget(p);return `<div class="grid three">${['cash','robux','credits'].map(k=>{const v=b[k];return `<div class="card"><div class="kicker">${esc(labelOf(currencyOpts,k))} budget</div><div class="value-large mono ${v.remaining!==null&&v.remaining<0?'neg':''}">${money(v.remaining,k)}</div><p class="entry-sub">Left after money paid and money still owed.</p>${[['Limit',v.limit],['Planned costs',v.planned],['Already paid',v.spent],['Still owed',v.committed]].map(([l,x])=>`<div class="budget-mini"><span>${l}</span><b>${money(x,k)}</b></div>`).join('')}${v.remaining!==null&&v.remaining<0?'<div class="note error section-gap">You owe more than this budget. Check your next cost before you spend.</div>':''}${v.limit===null?btn('Set a budget','go-profile','small ghost','arrow'):''}</div>`}).join('')}</div>${b.warnings?.length?`<div class="note warn section-gap"><b>Money notes</b><ul>${b.warnings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="section-label"><div><h2>Costs list</h2><p>Your budget is worked out from this list.</p></div>${btn('Save costs as a table','export-kind','small','download','data-kind="expenses" title="Saves a CSV file you can open in Google Sheets"')}</div>${p.expenses.length?`<div class="card flush table-wrap"><table><thead><tr><th>Item</th><th>Planned</th><th>Paid</th><th>Still owed</th><th></th></tr></thead><tbody>${p.expenses.map(x=>`<tr><td>${esc(x.title)}<p>${esc(x.category)} · ${x.recurring==='monthly'?'Monthly (for the month you wrote down)':'One time'}${x.campaignId?' · linked ad campaign':''}</p></td><td class="money">${money(n(x.planned),x.currency)}</td><td class="money">${money(n(x.spent),x.currency)}</td><td class="money">${money(n(x.committed),x.currency)}</td><td>${editButtons('expenses',x)}</td></tr>`).join('')}</tbody></table></div>`:empty('No costs yet','Click Add a cost to list things you plan to buy or already owe. Type 0 when you know nothing was paid or owed.',btn('Add a cost','add-record','primary','plus','data-kind="expenses"'))}<div class="grid two section-gap"><div class="note"><b>How the math works</b><br>Money left = budget limit, minus money paid, minus money still owed. Planned costs are just for comparing. They are not taken out. Monthly costs count for the month you wrote down. The tool does not repeat them for you.</div><div class="note info"><b>Ad, asset, and update costs</b><br>Costs you type on other pages do not show up here by themselves. Use an ad campaign’s “Add to costs list” button, or add the cost here once. Keep cash, Robux, and ad credits apart.</div></div>${sources(['devex','ads'])}`;}
function editButtons(kind,x){return `<div class="entry-actions">${btn(`<span class="sr-only">Edit ${esc(x.title||x.label)}</span>`,'edit-record','icon small','edit',`data-kind="${kind}" data-id="${esc(x.id)}"`)}${btn(`<span class="sr-only">Delete ${esc(x.title||x.label)}</span>`,'delete-record','icon small ghost','trash',`data-kind="${kind}" data-id="${esc(x.id)}"`)}</div>`;}
function recordList(kind,items){return items.length?items.slice().reverse().map(x=>`<div class="entry"><div class="entry-body"><div class="flex wrap"><div class="entry-title">${esc(x.title)}</div>${x.decision?pill(x.decision):''}</div><div class="entry-sub">${esc(x.date||'No date')}${x.build?' · '+esc(x.build):''}</div>${x.evidence?`<p class="read-text" style="margin:8px 0">${esc(x.evidence)}</p>`:''}${x.nextAction?`<p class="entry-sub" style="margin:5px 0"><b>Next:</b> ${esc(x.nextAction)}</p>`:''}${x.uncertainty?`<p class="entry-sub" style="margin:5px 0"><b>Still not sure:</b> ${esc(x.uncertainty)}</p>`:''}</div>${editButtons(kind,x)}</div>`).join(''):empty('Nothing here yet','Write down what you saw and what you chose, while you still remember.','',true);}
function playtestsView(){const p=project();return pageHead('Test before you add more','Watch what players really do.','A playtest is when people try your game while you watch. Write your question, what players did, and your next test. Keep what players said apart from what you saw.',btn('Add a playtest','add-record','primary','plus','data-kind="playtests"'))+`<div class="grid wide"><section class="stack">${p.playtests.length?p.playtests.slice().reverse().map(t=>`<article class="card"><div class="card-head"><div><div class="kicker">${esc(t.date||'Playtest')} · ${esc(labelOf(deviceOpts,t.device))}</div><h2>${esc(t.title)}</h2><p>${esc(t.build||'No build written')} · ${esc(t.source||'No tester group written')}</p></div>${editButtons('playtests',t)}</div><div class="grid four" style="gap:10px">${[['Testers',t.participants],['Understood',t.understood],['Finished',t.completed],['Kept playing',t.continued]].map(([l,v])=>`<div class="note"><div class="entry-sub">${l}</div><div class="value-large mono">${fmt(n(v))}</div></div>`).join('')}</div><dl class="detail-list section-gap"><dt>Question</dt><dd>${esc(t.assumption||'Not written')}</dd><dt>What you saw</dt><dd>${esc(t.observations||'Not written')}</dd><dt>What players said</dt><dd>${esc(t.feedback||'Not written')}</dd><dt>Next test</dt><dd>${esc(t.nextTest||t.change||'Not written')}</dd></dl><div class="flex spread wrap">${pill(t.decision||'No choice yet','outline')}${btn('Turn next test into a task','playtest-task','small soft','plus',`data-id="${esc(t.id)}"`)}</div></article>`).join(''):empty('Start with a playtest','No playtests yet. Click Add a playtest. You do not need live game numbers to learn if players understand your game.',btn('Add a playtest','add-record','primary','test','data-kind="playtests"'))}</section><aside class="stack"><div class="card soft"><h2>An easy first test</h2><div class="help-step"><h3>Pick one question</h3><p>For example: can a new player start the first activity without help?</p></div><div class="help-step"><h3>Let them try</h3><p>Watch where they stop, go the wrong way, quit, or keep playing.</p></div><div class="help-step"><h3>Ask how it went</h3><p>What did they expect? What confused them? What would they do next?</p></div><div class="help-step"><h3>Pick the next test</h3><p>Change something to fix a problem you saw. Then test it again.</p></div>${sources(['prototype'])}</div><div class="note">These counts are only about the people you tested. They may not match all Roblox players.</div><div class="card"><h3>What to track for your game</h3><p class="read-text">${esc(p.measurementPlan||'Add your core loop and tracking plan in My game. The ideas for your game type can help you start.')}</p>${btn('Open my tracking plan','go-profile','small ghost','arrow')}</div></aside></div>`;}
function baseAnalyticsView(){const p=project(),s=latest(),prev=prior(s);let html=pageHead('My game numbers','What do your numbers say?','Copy numbers from your Roblox Creator Hub stats. Then turn what you find into a test. Blank boxes stay unknown. They never count as zero.',btn('Open a chart file (CSV)','import-csv','','open','title="A CSV is a table file you can download from a Creator Hub chart"')+btn('Add game numbers','add-snapshot','primary','plus'));if(!s)return html+`<div class="grid wide"><div>${empty('Add your first set of numbers','No numbers yet. In Creator Hub, pick a date range that has ended. Copy the dates, where players came from, their devices, and the numbers you have.',btn('Add my numbers','add-snapshot','primary','chart'))}<div class="note section-gap"><b>No live game numbers yet?</b><br>Use playtests. Watch if players understand the game, finish the first activity, and play again. This tool helps even before your game has numbers. ${btn('Open playtests','go-playtests','small ghost','arrow')}</div></div><div class="card soft"><h2>Start with a question</h2><ul class="read-text"><li>Are players finding the game?</li><li>Do they reach the first fun activity?</li><li>Do they come back?</li><li>What changed after our update?</li><li>Is the money we spend getting the result we wanted?</li></ul>${sources(['dashboard','analytics'])}</div></div>${sampleCards()}`;
 const d=E.derive(s),validation=E.validateSnapshot(s),cmp=prev?E.compare(s,prev):null,cards=insights(s,prev);html+=`<div class="card" style="margin-bottom:20px"><div class="form-grid"><div class="field"><label for="snapshot-select">Numbers to look at</label><select id="snapshot-select">${p.snapshots.slice().sort((a,b)=>(b.to||'').localeCompare(a.to||'')).map(x=>`<option value="${esc(x.id)}" ${x.id===s.id?'selected':''}>${esc(x.label||x.from)} · ${esc(x.from)} to ${esc(x.to)}</option>`).join('')}</select></div><div class="field"><label for="compare-select">Compare with</label><select id="compare-select"><option value="" ${!ui.compareId?'selected':''}>Auto: the last matching set of numbers</option><option value="none" ${ui.compareId==='none'?'selected':''}>Do not compare</option>${p.snapshots.filter(x=>x.id!==s.id).map(x=>`<option value="${esc(x.id)}" ${ui.compareId===x.id?'selected':''}>${esc(x.label||x.from)} · ${esc(x.from)}</option>`).join('')}</select></div></div><div class="flex spread wrap" style="margin-top:15px"><div class="flex wrap">${pill(labelOf(sourceOpts,s.source),'green')}${pill(labelOf(deviceOpts,s.device))}${pill(s.complete?'Dates are complete':'Dates may not be complete yet',s.complete?'outline':'amber')}<span class="entry-sub">Build ${esc(s.version||'not written')} · checked ${esc(s.observedOn||'no date')}</span></div><div class="flex">${btn('Edit numbers','edit-record','small','edit',`data-kind="snapshots" data-id="${esc(s.id)}"`)}${btn('<span class="sr-only">Delete these numbers</span>','delete-record','icon small ghost','trash',`data-kind="snapshots" data-id="${esc(s.id)}"`)}</div></div></div>`;
 if(validation.errors.length)html+=`<div class="note error" style="margin-bottom:18px"><b>Fix these numbers before you use the tips.</b><ul>${validation.errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 if(cmp&&!cmp.compatible)html+=`<div class="note warn" style="margin-bottom:18px"><b>These two sets of numbers cannot be compared directly.</b><ul>${cmp.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 const diff=(key)=>{const c=cmp?.compatible?cmp.changes[key]:null;if(!c)return 'Nothing earlier to compare with';return `${c.delta>0?'+':''}${fmt(c.delta,2)} ${c.unit==='percentage_points'?'percentage points':c.unit||''} vs last time`;};
 html+=`<div class="grid four">${stat('Came back the next day (D1)',pct(d.d1),d.retention.d1.status==='immature'?'Too soon: not enough days have passed':d.retention.d1.status==='unknown'?'Add the first-play date first':diff('d1'))}${stat('Average play time',n(s.metrics.avgSessionMinutes)===null?'Not entered':fmt(n(s.metrics.avgSessionMinutes),1)+' min',diff('avgSessionMinutes'),'clock')}${stat('Players who bought something',pct(d.payerConversion),diff('payerConversion'),'money')}${stat('Saw the game and played',pct(d.ptr),'Plays ÷ times the game was shown.','chart')}</div><div class="grid wide section-gap"><section><div class="section-label" style="margin-top:0"><div><h2>Ideas for what to check next</h2><p>What the numbers show, some guesses about why, and what they cannot tell you.</p></div></div><div class="stack">${cards.slice(0,3).map(a=>adviceCard(a)).join('')}${cards.length>3?`<details class="disclosure"><summary>Show ${cards.length-3} more ideas</summary><div class="disclosure-body stack">${cards.slice(3).map(a=>adviceCard(a)).join('')}</div></details>`:''}</div></section><aside class="stack"><div class="card"><h3>Player steps (funnel)</h3>${funnelView(s)}<p class="entry-sub" style="margin:16px 0 0">A funnel shows how many players reach each step. Only steps you entered show up. Make sure each step counts the same players the same way before you act.</p></div>${retentionTrend(s)}<div class="card"><h3>Worked out from these numbers</h3><div class="table-wrap"><table class="chart-table"><tbody>${[['Finished the tutorial',pct(d.onboardingCompletion)],['Finished the first activity',pct(d.roundCompletion)],['Started a second activity',pct(d.replay)],['Came back on day 7',pct(d.d7)],['Came back on day 30',pct(d.d30)],['Robux per paying player',d.arppu===null?'Not available':fmt(d.arppu,2)+' Robux'],['Robux per daily player',d.arpdau===null?'Not available':fmt(d.arpdau,3)+' Robux'],['Coins earned minus coins spent',d.netEconomy===null?'Not available':fmt(d.netEconomy,2)]].map(([l,v])=>`<tr><td>${l}</td><td class="money">${v}</td></tr>`).join('')}</tbody></table></div><p class="entry-sub" style="margin:12px 0 0">Percents use matching daily numbers or a number from a chart. If the total to divide by is unknown, no percent is shown.</p></div>${d.warnings.length?`<details class="disclosure"><summary>Notes about these numbers (${d.warnings.length})</summary><div class="disclosure-body"><ul class="read-text">${d.warnings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details>`:''}<div class="note">Going from 10% to 12% is a rise of 2 percentage points. It is also a 20% rise compared to where it started. Both describe the same change.</div></aside></div><details class="disclosure section-gap"><summary>All your saved numbers (${p.snapshots.length})</summary><div class="disclosure-body"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Dates</th><th>Where from / device</th><th>Numbers entered</th><th></th></tr></thead><tbody>${p.snapshots.map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(x.from)}<br>${esc(x.to)}</td><td>${esc(labelOf(sourceOpts,x.source))}<br>${esc(labelOf(deviceOpts,x.device))}</td><td>${Object.values(x.metrics||{}).filter(v=>n(v)!==null).length}</td><td>${btn('Open','select-snapshot','small','arrow',`data-id="${esc(x.id)}"`)}</td></tr>`).join('')}</tbody></table></div>${btn('Save numbers as a table','export-kind','small','download','data-kind="snapshots"')}</div></details>${sources(['retention','monetization','discovery'])}`;return html;}
function funnelView(s){const m=s.metrics||{},entries=[['Started the tutorial',m.onboardStarted],['Finished the tutorial',m.onboardCompleted],['Started first activity',m.roundStarted],['Finished first activity',m.roundCompleted],['Started another activity',m.secondRoundStarted]].filter(x=>n(x[1])!==null);if(!entries.length)return '<p class="entry-sub">No step counts yet. Plan your player steps in My game, then add the counts here.</p>';const max=Math.max(...entries.map(x=>n(x[1])),1);return `<div class="bars" style="margin-top:18px">${entries.map(([l,v])=>`<div><div class="bar-label"><span>${l}</span><b class="mono">${fmt(n(v))}</b></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,n(v)/max*100)}%"></div></div></div>`).join('')}</div>`;}
function retentionTrend(s){
 const valid=x=>x.complete&&x.observedOn<=today()&&E.derive(x).d1!==null;
 if(!valid(s))return '';
 const candidates=project().snapshots.filter(x=>x.id!==s.id&&valid(x)&&E.compare(s,x).compatible).sort((a,b)=>b.to.localeCompare(a.to));
 const readings=[s];for(const x of candidates){if(E.compare(readings[0],x).compatible)readings.unshift(x);if(readings.length>=8)break;}
 if(readings.length<2)return '';
 const start=Date.parse(readings[0].to),span=Date.parse(s.to)-start;
 const pts=readings.map(x=>[28+(Date.parse(x.to)-start)/span*264,118-E.derive(x).d1]);
 const poly=pts.map(p=>p.join(',')).join(' ');
 return `<div class="card"><h3>Came back the next day (D1), over time</h3><p class="entry-sub">${esc(labelOf(sourceOpts,s.source))} · ${esc(labelOf(deviceOpts,s.device))}. Same-length date ranges that do not overlap, with enough days passed. How many players were in each group still matters.</p><svg class="trend-chart" viewBox="0 0 320 150" role="img" aria-label="D1 retention by report end: ${readings.map(x=>esc(x.to+' '+pct(E.derive(x).d1))).join(', ')}"><path class="gridline" d="M28 18h264 M28 68h264 M28 118h264"/><text x="2" y="22">100</text><text x="8" y="72">50</text><text x="14" y="122">0</text><polyline class="line" points="${poly}"/>${pts.map((p,i)=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4"><title>${esc(readings[i].label)}: ${pct(E.derive(readings[i]).d1)}</title></circle>`).join('')}<text x="28" y="142">${esc(readings[0].to.slice(5))}</text><text x="264" y="142">${esc(s.to.slice(5))}</text></svg></div>`;
}
function marketingView(){const p=project();return pageHead('Ads and promotion','See what each ad really did.','A campaign is one ad or promotion. Track what it promised, who saw it, what it cost, and what players did. Count results over the same number of days each time.',btn('Add a campaign','add-record','primary','plus','data-kind="campaigns"'))+`<div class="note" style="margin-bottom:20px"><b>Know what you want to learn before you spend.</b> A small ad test with a spending limit can answer a question. Before you spend more, make sure the game really gives players what the ad promised. ${ext('https://create.roblox.com/docs/production/promotion/share-links','Learn how to make Roblox Share Links')}</div>${p.campaigns.length?`<div class="grid two">${p.campaigns.map(c=>{const v=E.campaign(c),linked=p.expenses.find(x=>x.campaignId===c.id);return `<article class="card"><div class="card-head"><div><div class="kicker">${esc(c.channel)}</div><h2>${esc(c.title)}</h2><p>${esc(c.start||'No start date')} to ${esc(c.end||'No end date')}</p></div>${editButtons('campaigns',c)}</div><dl class="detail-list"><dt>Who it is for</dt><dd>${esc(c.audience||'Not written')}</dd><dt>What it promised</dt><dd>${esc(c.promise||'Not written')}</dd><dt>Tracking link</dt><dd>${c.url?ext(c.url,'Open ad or share link'):'Not written'}</dd></dl><div class="grid two" style="gap:10px;margin:18px 0"><div class="note"><div class="entry-sub">Spent / limit</div><b class="mono ${v.exceededCap?'neg':''}">${money(n(c.spend),c.currency)} / ${money(n(c.cap),c.currency)}</b></div><div class="note"><div class="entry-sub">Cost per play from this ad</div><b class="mono">${money(v.costPerPlay,c.currency)}</b></div><div class="note"><div class="entry-sub">Cost per new player</div><b class="mono">${money(v.costPerNewUser,c.currency)}</b></div><div class="note"><div class="entry-sub">Cost per player who came back on day 7</div><b class="mono">${money(v.costPerD7Return,c.currency)}</b></div></div>${v.attributedReturn!==null?`<div class="note info"><b>${fmt(v.attributedReturn,2)}× money earned from this ad, divided by money spent</b><br>This is money earned in the dates you set. It is not profit, and it does not prove the ad caused it.</div>`:''}<p class="read-text"><b>When to stop or check:</b> ${esc(c.stopRule||'Set a spending limit and a stop rule before you spend more.')}</p>${c.nextDecision?`<p class="read-text"><b>Next choice:</b> ${esc(c.nextDecision)}</p>`:''}<details class="disclosure"><summary>Notes about these numbers (${v.warnings.length})</summary><div class="disclosure-body"><ul class="read-text">${v.warnings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details>${btn(linked?'See the linked cost':'Add to costs list','campaign-ledger','small soft','money',`data-id="${esc(c.id)}"`)}</article>`}).join('')}</div>`:empty('No campaigns yet','Click Plan a campaign. Pick who it is for, what it promises, a tracking link, and a spending limit before you look at results.',btn('Plan a campaign','add-record','primary','plus','data-kind="campaigns"'))}<div class="grid three section-gap"><div class="card"><h3>Show the real game</h3><p class="read-text">Your ad should show what players will really get. Save the picture or video you used, so you can compare ads later.</p></div><div class="card"><h3>Track every step</h3><p class="read-text">A view, a click, a play, a new player, and a player who comes back each tell you something different. Write what each count means next to it.</p></div><div class="card"><h3>Control spending in Roblox</h3><p class="read-text">This tool only keeps notes. It cannot pause ads or change payments. Check your running ads and any auto-refill setting in Roblox Ads Manager.</p></div></div>${sources(['ads','share','discovery'])}`;}
function assetsView(){const p=project();return pageHead('Assets and credits','Know where every asset came from.','Assets are things like models, sounds, music, and images. List what you use, where it came from, what you are allowed to do with it, and who you must credit.',btn('Add an asset','add-record','primary','plus','data-kind="assets"'))+`<div class="grid three" style="margin-bottom:20px">${stat('Assets listed',fmt(p.assets.length),'List both stand-in and final assets.','asset')}${stat('Need a check',fmt(p.assets.filter(a=>a.status==='review'||a.status==='temporary').length),'Check these before you launch.','shield')}${stat('Approved',fmt(p.assets.filter(a=>a.status==='approved').length),'Marked as approved by you.','check')}</div>${p.assets.length?`<div class="card flush table-wrap"><table><thead><tr><th>Asset</th><th>Status</th><th>Where it came from and permission</th><th>Credit / owner</th><th></th></tr></thead><tbody>${p.assets.map(a=>`<tr><td>${esc(a.title)}<p>${esc(a.type)} · ${money(n(a.cost),a.currency||'cash')}</p></td><td>${pill(labelOf(defs.assets.fields.find(x=>x.key==='status').opts,a.status),a.status==='approved'?'green':a.status==='replace'?'red':'amber')}</td><td>${a.sourceUrl?ext(a.sourceUrl,'Where it came from'):'Source not written'}<p>${esc(a.license||'Permission not written')}</p></td><td>${esc(a.credit||'No credit written')}<p>${esc(a.owner||'No owner yet')}</p></td><td>${editButtons('assets',a)}</td></tr>`).join('')}</tbody></table></div>`:empty('No assets yet','Click Add an asset. Use one row for each asset, pack, or permission. Save where it came from and the rules for how you may use it.',btn('Add an asset','add-record','primary','plus','data-kind="assets"'))}<div class="grid two section-gap"><div class="note"><b>Write down the rules you really checked.</b><br>Being able to download something does not mean you may use it. An "AI-made" label, or marking it approved here, does not give you rights either. Keep the license or written permission with the asset.</div><div class="note info"><b>Works with your other tools.</b><br>Use your public domain research tool with this list. Write your answer here, with the source, any place or use limits, and any credit. Asset costs only count in your budget when you add them to the costs list.</div></div><div class="section-gap">${btn('Save asset list as a table','export-kind','','download','data-kind="assets"')}</div>`;}
function baseReleaseView(){const p=project(),s=stageBy('launch'),sum=stageSummary(s);return pageHead('Launch, improve, and keep it running','Write why you made each update, and what happened.','Plan the update, write down how it went, and decide what to work on next.',btn('Add an update','add-record','primary','plus','data-kind="updates"'))+`<section class="card soft" style="margin-bottom:22px"><div class="card-head"><div><div class="kicker">Before you publish</div><h2>Launch checks</h2><p>Who can play, a full play from start to end, tracking, player help, and a plan to fix problems.</p></div>${pill(sum.status,sum.counts.blocked?'red':sum.ready?'green':'amber')}</div><div class="flex spread wrap"><p class="read-text" style="margin:0">${sum.counts.pass} checks passed · ${sum.counts.blocked} stuck · ${sum.counts.unreviewed+sum.counts.needs} still to check</p>${btn('Open the launch checklist','open-stage','soft','arrow','data-value="launch"')}</div>${sources(['publishing','testing'])}</section><div class="stack">${p.updates.length?p.updates.slice().reverse().map(u=>{const before=p.snapshots.find(x=>x.id===u.beforeSnapshot),after=p.snapshots.find(x=>x.id===u.afterSnapshot),cmp=before&&after?E.compare(after,before):null;return `<article class="card"><div class="card-head"><div><div class="kicker">${esc(u.date||'No date')} · ${esc(u.build||'No build')}</div><h2>${esc(u.title)}</h2><p>${esc(labelOf(defs.updates.fields.find(x=>x.key==='type').opts,u.type))}</p></div>${editButtons('updates',u)}</div><div class="grid two"><dl class="detail-list"><dt>Player need</dt><dd>${esc(u.problem||'Not written')}</dd><dt>Your guess</dt><dd>${esc(u.hypothesis||'Not written')}</dd><dt>Sign of success</dt><dd>${esc(u.successMeasure||'Not written')}</dd></dl><dl class="detail-list"><dt>What happened</dt><dd>${esc(u.outcome||'Not checked yet')}</dd><dt>Choice</dt><dd>${pill(u.decision||'planned','outline')}</dd><dt>Cost (note only)</dt><dd>${money(n(u.cost),u.currency||'cash')}</dd></dl></div>${before||after?`<div class="note ${cmp&&!cmp.compatible?'warn':''}"><b>Linked numbers:</b> ${esc(before?.label||'No "before" picked')} → ${esc(after?.label||'No "after" picked')}${cmp?`<br>${cmp.compatible?'These can be compared. But a change still does not prove the update caused it.':esc(cmp.reasons.join(' '))}`:''}</div>`:''}${after?`<div class="section-gap">${btn('Open the "after" numbers','select-snapshot','small soft','chart',`data-id="${esc(after.id)}"`)}</div>`:''}${u.notes?`<p class="read-text section-gap" style="margin-bottom:0">${esc(u.notes)}</p>`:''}</article>`}).join(''):empty('No updates yet','Click Plan an update. Base it on something players need. A bug fix, an easier menu, new content, and a whole new system are very different in size. Write the result you want before you build.',btn('Plan an update','add-record','primary','plus','data-kind="updates"'))}</div><div class="grid two section-gap"><div class="card"><h3>Check after every update</h3><p class="read-text">Look at player feedback and the numbers after an update. Keep what changed apart from what you think caused it. Keep your next step small enough to check.</p>${sources(['liveops'])}</div><div class="card"><h3>Just keeping it running is OK</h3><p class="read-text">Look at ongoing costs, player help, and what players expect. A plan to just keep the game running, or to stop, can save your lessons and work you can reuse.</p>${btn('Open the look-back step','open-stage','small ghost','arrow','data-value="review"')}</div></div>`;}

function baseStartHelp(){return `<div class="grid wide"><div class="card"><h2>From a new project to your first smart choice</h2><div class="help-step"><h3>1. Fill in My game</h3><p>Write what makes it fun, what players do, who it is for, and your limits. Start with what you know.</p></div><div class="help-step"><h3>2. Open your current step</h3><p>Go to the Step-by-step plan. Look at the checks. Write down the smallest test that could change your next choice.</p></div><div class="help-step"><h3>3. Write down the work and the cost</h3><p>Use tasks to say who does what and how you will know it is done. Use the costs list for money paid and money owed.</p></div><div class="help-step"><h3>4. Watch players, or add your game numbers</h3><p>Before your game has live numbers, run a playtest. When it does, copy the dates, filters, and units from the chart.</p></div><div class="help-step"><h3>5. Turn what you learn into a task</h3><p>Tips show what the numbers say, some guesses why, and a next check. Add the useful ones to your plan.</p></div><div class="help-step"><h3>6. Check how it went, and save</h3><p>Write down what changed. Click Save project file to keep a copy of all your work on your computer.</p></div></div><aside class="stack"><div class="card soft"><h3>How saving works</h3><p class="read-text"><b>Browser save:</b> your work saves in this browser by itself, but it can get erased.</p><p class="read-text"><b>Save project file:</b> downloads this project to your computer as a .json file. Do this often.</p><p class="read-text"><b>Open project file:</b> opens a project file you saved before, as its own project. Your other work stays safe.</p><p class="read-text"><b>More options (the ... button):</b> save all projects, save tables, copy a summary, or save notes for an AI helper.</p>${sources(['storage'])}</div><div class="note warn"><b>Before you share</b><br>To give a friend an empty copy of this tool, share the empty tool download. Your project file, printouts, and AI  tool itself may not be sold or turned into a paid product. Keep this notice when you share or change it.</p><p class="read-text">The tool is given “as is,” with no warranty (no promise that it works perfectly). Linked pages from other sites have their own rules. This is not an official Roblox product, and Roblox does not endorse it.</p>${btn('Download an empty tool to share','blank-tool','soft','download')}</div><div class="card"><h3>Your other Avalon tools</h3><p class="read-text">Use the project summary to start your marketing work. Keep asset research from your public domain guide in the asset list. Tools share info through saved files. They do not update each other by themselves.</p></div></aside></div>`;}

function startHelp(){return `<section class="card soft"><div class="kicker">Creator Guide v2</div><h2>How to use this tool</h2><p>Try an example, or start from scratch. Plan the smallest version of your game that is still fun. Only plan the work it needs. Test it with players before you spend more.</p><div class="flex wrap">${btn('Start from scratch','new-project','primary','plus')}${btn('Plan my features','open-scope','soft','arrow')}${btn('Project files and backups','project-transfer','soft','save')}</div></section>`+baseStartHelp().replace('opens a project file you saved before, as its own project. Your other work stays safe.','checks a project file you saved before. It shows you what will change. Then you pick: add it as a new project, or replace this one.')+guidance(UC.transferHelp,'Move your project file between tools');}
function aboutView(){return baseAboutView()+`<section class="card section-gap"><h2>What this version includes</h2>${UC.changelog.map(c=>`<h3>${esc(c.title)}</h3><p class="read-text">${esc(c.body)}</p>`).join('')}<p class="note">You can still save files in the older version 1 format. But older-format files leave out the new planning data and work from other tools. So also keep a normal project file.</p>${btn('Project file and older formats','project-transfer','soft','link')}</section>`;}
function helpView(){if(ui.helpTab!=='sources')return baseHelpView();return pageHead('Where the facts come from','See the official pages behind the tips.','These are the pages the tips are based on, with the date they were checked. This tool only opens an outside page when you click a link.')+renderTabs([['start','Start here'],['glossary','Word list'],['sources','Where the facts come from'],['about','About and license']],ui.helpTab,'help-tab')+`<div class="note">Pages marked "Checked for this version" were opened on the date shown. Other pages come from the older version of the tool. Nothing updates by itself. The tool’s number rules are rough guides, not official Roblox rules.</div><div class="card section-gap">${C.sources.map(s=>`<div class="source-card">${ext(s.url,s.title)}<p>${esc(s.why)}</p><div class="meta">${s.status==='verified'?'Checked for this version':s.status==='unverified'?'Not checked in this version':'From the older version of the tool'} · ${esc(s.reviewed||'No check date')}</div></div>`).join('')}</div>`;}
function saveSmallForm(event,key){event.preventDefault();if(!event.target.reportValidity())return;const draft=copy(project());draft._guide[key]=readForm(event.target);if(key==='capacity'&&draft._guide.capacity.from&&draft._guide.capacity.to&&draft._guide.capacity.to<draft._guide.capacity.from)return showErrors(['Capacity end must be on or after its start.']);try{commitDraft(draft);}catch(err){return showErrors([err.message]);}closeDialog(true);mount();toast((key==='scope'?'Game size':'Hours')+' saved.');}
async function performAction(el){
 const action=el.dataset.action,id=el.dataset.id,value=el.dataset.value;
 if(['new-project','examples','load-example','duplicate-project','delete-project','blank-tool','project-transfer','shared-profile'].includes(action)&&!await protectEdits())return;
 switch(action){
  case 'guide-tab':guideUI.production=value;guideUI.search='';guideUI.filter='all';return mount();
  case 'roadmap-tab':if(inlinePending&&!await protectEdits())return;guideUI.roadmap=value;guideUI.search='';guideUI.filter='all';return mount();
  case 'release-tab':guideUI.release=value;guideUI.search='';guideUI.filter='all';return mount();
  case 'open-scope':guideUI.production='scope';return navigate('production');
  case 'open-tasks':guideUI.production='tasks';return navigate('production');
  case 'go-budget':guideUI.production='budget';return navigate('production');
  case 'open-stage':case 'current-stage':guideUI.roadmap='guide';break;
  case 'scope-edit':return scopeDialog();
  case 'capacity-edit':return capacityDialog();
  case 'shared-profile':return sharedProfileDialog();
  case 'team-mode':{const draft=copy(project());draft._guide.teamMode=draft._guide.teamMode==='solo'?'team':'solo';commitDraft(draft);return mount();}
  case 'feature-impact':return featureImpact(id,value);
  case 'feature-impact-apply':{const draft=copy(project()),f=draft._guide.features.find(x=>x.id===id);if(!f||!['removed','deferred'].includes(value))return;f.status=value;commitDraft(draft);closeDialog(true);mount();toast('Change made. Check the work that depended on it.');return;}
  case 'scope-reductions':return scopeReductions();
  case 'criterion-add':{const row={id:uid(),title:'',status:'unreviewed',evidence:''};$('#criteria-editor').insertAdjacentHTML('beforeend',criterionRows([row]));modalDirty=true;$$('#criteria-editor input').at(-1)?.focus();return;}
  case 'criterion-remove':{el.closest('[data-criterion]')?.remove();modalDirty=true;return;}
  case 'milestone-template':return openRecord('milestones',null,UC.buildMilestone(id,uid));
  case 'release-preset':{const rows=UC.buildReleaseChecks(id,uid),draft=copy(project()),newRows=rows.filter(r=>!draft._guide.releaseChecks.some(c=>c.title===r.title&&c.appliesTo===r.appliesTo));if(!newRows.length)return toast('You already have those checks. Edit the ones you have.');draft._guide.releaseChecks.push(...newRows);commitDraft(draft);mount();toast(newRows.length+' checks added, not checked yet. Edit them to fit this release.');return;}
  case 'postmortem-task':return postmortemTask(id);
  case 'intake-paste':return intakePasteDialog();
  case 'intake-csv':return intakeCSVDialog();
  case 'intake-task':return intakeTask(id);
  case 'project-transfer':return transferDialog();
  case 'legacy-project':return legacyExport();
  case 'legacy-workspace':return legacyExport(true);
  case 'legacy-cache':{const old=JSON.parse(legacyRecovery);download('Roblox-Original-Browser-Workspace.json',JSON.stringify({format:'avalon-roblox-workspace',schemaVersion:1,exportedAt:new Date().toISOString(),projects:old.projects},null,2),'application/json');return;}
  case 'recovery-copy':download('Creator-Guide-Unreadable-Cache-Recovery.txt',recoveryRaw);return;
  case 'reset-cache':{if(!await confirmAction('Reset browser saving?','This replaces the saved data the tool could not read with the work open right now. Download the rescue copy first. The older tool’s saved data is not deleted.','Reset browser saving'))return;cacheBlocked=false;persist(false);closeDialog(true);mount();return;}
  case 'import-backup':return saveWorkspace();
  case 'apply-import':return applyImport();
  case 'set-stage':{const draft=copy(project());draft.profile.stage=value;commitDraft(GF.syncLegacyField(draft,'profile.stage'));ui.stage=value;mount();toast('Current step updated, in My game too.');return;}
  case 'duplicate-project':{if(!roomForProject())return;let p=GF.duplicate(project());p=GF.setSharedField(p,'name',short(p.name+' (copy)',2000));state.projects.push(p);activateProject(p);toast('Project copied. The copy has its own new project ID, and remembers where it came from.');return;}
  case 'delete-project':{const p=project();if(!await confirmAction('Delete this project from this browser?',`Delete “${p.name}” and everything in it from this browser? Click Save project file first if you might want it later.`,'Delete project'))return;state.projects=state.projects.filter(x=>x.id!==p.id);if(!state.projects.length)state.projects.push(GF.migrateLegacy(C.newProject('My first Roblox game')));activateProject(state.projects[0]);toast('Project deleted from this browser.');return;}
  case 'load-example':{if(!roomForProject())return;const template=C.templates.find(t=>t.id===id);if(!template)return;let p=enhanceExample(GF.migrateLegacy(template.build()));if(state.projects.some(x=>x.id===p.id||sameIdentity(x._shared.profile.id,p._shared.profile.id)))p=GF.duplicate(p);state.projects.push(p);closeDialog(true);activateProject(p);toast('Example opened. Its numbers are made up, just for learning.');return;}
 }
 return basePerformAction(el);
}
document.addEventListener('submit',event=>{const handlers={'shared-profile-form':saveSharedProfile,'scope-form':e=>saveSmallForm(e,'scope'),'capacity-form':e=>saveSmallForm(e,'capacity'),'intake-form':intakePasteSubmit,'intake-map-form':intakeMapSubmit,'intake-review-form':acceptIntake};if(handlers[event.target.id]){event.preventDefault();try{Promise.resolve(handlers[event.target.id](event)).catch(err=>showErrors([err.message]));}catch(err){showErrors([err.message]);}}});
document.addEventListener('input',event=>{if(event.target.closest('#editor form')&&!event.target.readOnly)modalDirty=true;if(event.target.id==='guide-search'){guideUI.search=event.target.value;const at=event.target.selectionStart;$('#page-content').innerHTML=({production:productionView,roadmap:roadmapView,release:releaseView,connections:connectionsView}[ui.page]||connectionsView)();const input=$('#guide-search');input?.focus({preventScroll:true});try{input?.setSelectionRange(at,at);}catch{}}});
document.addEventListener('change',event=>{const el=event.target;if(el.closest('#editor form')&&!el.readOnly)modalDirty=true;if(el.id==='guide-filter'){guideUI.filter=el.value;mount();}if(el.id==='import-mode'&&importReview){importReview.mode=el.value;renderImportReview();}if(el.dataset.taskStatus){event.stopImmediatePropagation();const draft=copy(project()),task=draft.tasks.find(t=>t.id===el.dataset.taskStatus);if(task){task.status=el.value;try{commitDraft(draft);mount();}catch(err){showMessage('Task status could not be saved',err.message);}}}},true);
window.addEventListener('beforeunload',event=>{if(modalDirty||inlinePending||!persistence){event.preventDefault();event.returnValue='';}});

document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');
 if(el&&!el.disabled){event.preventDefault();if(el.closest('#project-menu')){ui.menu=false;$('#project-menu')?.remove();$('[data-action="menu"]')?.setAttribute('aria-expanded','false');}Promise.resolve(performAction(el)).catch(err=>{console.error(err);showMessage('The action could not finish',err.message||'Your current project is still available. Save a backup before retrying.');});return;}
 if(ui.menu&&!event.target.closest('#project-menu')){ui.menu=false;$('#project-menu')?.remove();const b=$('[data-action="menu"]');b?.setAttribute('aria-expanded','false');}
});
document.addEventListener('submit',event=>{
 const handlers={'record-form':saveRecord,'new-project-form':createProject,'profile-form':saveProfile,'csv-form':importCSVRows,'campaign-link-form':linkCampaign};
 if(handlers[event.target.id]){try{Promise.resolve(handlers[event.target.id](event)).catch(err=>showErrors([err.message]));}catch(err){event.preventDefault();console.error(err);showErrors([err.message]);}}
 else if(event.target.id==='stage-profile-form')event.preventDefault();
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.closest('#profile-form,#stage-profile-form')){if(el.name!=='profile.cashCurrency'&&el.type!=='checkbox'&&el.tagName!=='SELECT')profileInput(el);}
 if(el.dataset.gate&&el.dataset.key!=='status')gateInput(el);
 if(el.closest('#record-form')){el.setCustomValidity('');if(modalContext?.kind==='snapshots')updateSnapshotPreview();if(modalContext?.kind==='campaigns')updateCampaignPreview();}
 if(el.id==='task-filter'){filter=el.value;refreshTaskSearch();}
 if(el.id==='glossary-filter'){filter=el.value;$('#glossary-list').innerHTML=glossaryItems();}
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='project-switch'){const p=state.projects.find(x=>x.id===el.value);if(p)activateProject(p);return;}
 if(el.id==='snapshot-select'){ui.snapshotId=el.value;ui.compareId='';mount();return;}
 if(el.id==='compare-select'){ui.compareId=el.value;mount();return;}
 if(el.id==='scope-select'){ui.productionScope=el.value;mount();return;}
 if(el.dataset.taskStatus){const t=project().tasks.find(x=>x.id===el.dataset.taskStatus);if(t){t.status=el.value;persist();mount();}return;}
 if(el.dataset.gate&&el.dataset.key==='status'){gateInput(el);return;}
 if(el.closest('#profile-form,#stage-profile-form')){if(el.name==='profile.cashCurrency')changeCashCurrency(el).catch(err=>showMessage('Currency change could not finish',err.message));else profileInput(el);}
 if(el.closest('#record-form')){if(modalContext?.kind==='snapshots')updateSnapshotPreview();if(modalContext?.kind==='campaigns')updateCampaignPreview();}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#editor').open&&!$('#confirm-dialog').open&&(ui.menu||ui.mobile)){ui.menu=false;ui.mobile=false;mount();}});
$('#editor').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
$('#confirm-dialog').addEventListener('cancel',event=>{event.preventDefault();finishConfirm(false);});
window.addEventListener('beforeprint',preparePrint);
matchMedia('(max-width:720px)').addEventListener('change',()=>{if(innerWidth>720&&ui.mobile){ui.mobile=false;mount();}else syncSidebarAccessibility();});
initialize();if(persistence)persist(false);mount();
})();

</script>
</body>
</html>
