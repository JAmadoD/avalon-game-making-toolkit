    out.push('## Files to deliver', rowsMD(handoffRows(a)), '### Files received', 'These are file names or links the creator typed in. A name or link does not prove the file is good, works in the engine, or runs fast.');
    if (!a.deliveries.length) out.push('No files received yet. The file names above are only what is needed.');
    a.deliveries.forEach((d,i)=>out.push(`#### File ${i+1}`, rowsMD([['File type',d.kind],['File name',d.name],['Link or location',d.url],['Version',d.version],['Notes',d.notes]])));
    if (mode !== 'checklist') {
      out.push('## Budget and payment steps', 'All amounts use the currency entered. These are plans, not a contract.', rowsMD(budgetRows(a)));
      if (!a.budget.milestones.length) out.push('No payment steps added.');
      a.budget.milestones.forEach((m,i)=>out.push(`### Step ${i+1}: ${md(m.name)}`, rowsMD([['Amount',money(m.amount,a.budget.currency)],['Due date',m.dueDate],['What finishes this step',m.deliverable],['Status',titlecase(m.status)]])));
    }
    out.push('## Linked changes to check', 'A warning shows up when an asset this one needs has changed. Marking it checked does not approve the finished asset.');
    if (!a.reviewFlags.length) out.push('No linked changes to check.');
    a.reviewFlags.forEach(fl=>out.push(rowsMD([['Changed asset',assetName(snapshot,fl.sourceId)],['Reason',fl.reason],['Status',fl.status],['Warning date',fl.createdAt],['Checked by',fl.reviewer],['What they found',fl.note],['Checked on',fl.resolvedAt]])));
    out.push('### Change requests');
    if (!a.revisions.length) out.push('No change requests added.');
    a.revisions.forEach(r=>out.push(rowsMD([['Requested by',r.by],['Date',r.requestedAt],['Request',r.note],['Status',r.status],['What was changed',r.resolution]])));
    out.push('## What this tool checked', 'These checks only look at what was typed. They do not test the asset.');
    const checks=checkRows(snapshot,a); if (!checks.length) out.push('No problems found in what was typed. This does not mean the asset passed.'); else checks.forEach(([level,title,why])=>out.push(`- **${md(level)}: ${md(title)}.** ${md(why)}`));
    out.push(readingMD(a.type));
    out.push('## Brief history', `Created: ${md(a.createdAt)}\n\nLast edited: ${md(a.updatedAt)}`);
    if (!a.history.length) out.push('No history yet.');
    a.history.forEach(h=>out.push(`- ${md(h.at)} | ${md(h.by)} | ${md(h.summary)}`));
    return out.join('\n\n')+'\n';
  }

  function reportHTML(snapshot, a, mode = 'human') {
    const C = core(), kind = mode === 'ai' ? 'Brief for an AI helper' : mode === 'checklist' ? 'Done checklist' : 'Asset brief';
    const section = (heading, body) => `<section class="report-section"><h2>${esc(heading)}</h2>${body}</section>`;
    let html=`<article class="report"><header class="report-meta"><p class="label">AVALON PARTNER / CAPTAIN AMADO</p><h1>${esc(a.name || 'Untitled asset')}</h1><p>${esc(kind)}</p><p>${esc(snapshot.project.name || 'Untitled project')} · Game ${esc(value(snapshot.project.gameVersion))} · Asset ${esc(value(a.code))} · ${esc(value(a.version))} · Brief update #${a.revision}</p><p>Made ${esc(C.now())}</p></header>`;
    html+=section('How to read this brief',generalNotes(snapshot).map(n=>`<p class="report-note">${esc(n)}</p>`).join(''));
    if(mode==='ai') html+=section('Instructions for the AI helper','<p>Use the creator-entered specification below as the source of constraints. Preserve names, dimensions, rig identity, variations, formats, and handoff requirements. List blocking unanswered questions before working. Request a decision if a constraint cannot be met. Do not invent licenses, assume missing values, or certify checks you did not perform.</p><p>On delivery, identify actual files, the implemented brief version, deviations, and observed checks with evidence. Leave external tests unverified until an actual check or a recorded reviewer decision supports the result.</p>');
    html+=section('About the project',rowsHTML(projectRows(snapshot)));
    html+=section('What to make',rowsHTML(overviewRows(snapshot,a)));
    html+=section('Details','<p class="report-note">The creator typed these details and limits. Blank ones still need a decision. Check the platform rules for this asset and how it will be uploaded.</p>'+rowsHTML(technicalRows(a)));
    html+=section('Linked assets', a.dependencies.length? a.dependencies.map(d=>`<div><h3>${esc(titlecase(d.kind))}: ${esc(assetName(snapshot,d.assetId))}</h3><p>${multiline(d.note)}</p><p>Linked asset ID: ${esc(d.assetId)}</p></div>`).join('')+(a.relatedAssets.length?`<p>Related assets: ${esc(a.relatedAssets.map(id=>assetName(snapshot,id)).join('; '))}</p>`:''):'<p>No links added. Make sure none are needed.</p>'+(a.relatedAssets.length?`<p>Related assets: ${esc(a.relatedAssets.map(id=>assetName(snapshot,id)).join('; '))}</p>`:''));
    html+=section('Examples and where they came from','<p class="report-note">Approved means “follow this style” only. It does not mean you are allowed to use it. This tool does not check credits or licenses.</p>'+(a.references.length?a.references.map((r,i)=>`<div><h3>${i+1}. ${esc(r.label||'Untitled example')}</h3>${rowsHTML([['Approved as style',r.approved?'Yes':'No'],['Credit',r.attribution],['License (not checked)',r.license],['Notes',r.notes],['Example ID',r.id]])}<p><strong>Link:</strong> ${linkHTML(r.url)}</p><p><strong>Original source:</strong> ${linkHTML(r.sourceRecord)}</p></div>`).join(''):'<p>No examples or licenses added.</p>'));
    html+=section('Done checks','<p class="report-note">Each check says what must be true. The result is what a person recorded. This tool does not look at, listen to, or test the asset.</p>'+(a.criteria.length?a.criteria.map((c,i)=>`<div class="report-criterion"><h3>${i+1}. ${esc(c.requirement||'Not written yet')}</h3><p><strong>Current result: ${esc(C.criteriaState(a,c))}</strong></p>${rowsHTML(criterionRows(a,c).filter(([k])=>k!=='Requirement'))}<p>Check ID: ${esc(c.id)}</p></div>`).join(''):'<p>Not answered yet: no done checks have been written.</p>'));
    html+=section('Files to deliver',rowsHTML(handoffRows(a))+'<h3>Files received</h3><p class="report-note">These are file names or links the creator typed in. They do not prove the file is good.</p>'+(a.deliveries.length?a.deliveries.map(d=>`<div><h4>${esc(d.name||'Unnamed file')}</h4>${rowsHTML([['File type',d.kind],['Version',d.version],['Notes',d.notes]])}<p>${linkHTML(d.url)}</p></div>`).join(''):'<p>No files received yet. The file names above are only what is needed.</p>'));
    if(mode!=='checklist') html+=section('Budget and payment steps','<p class="report-note">A plan in the currency entered. This is not a contract.</p>'+rowsHTML(budgetRows(a))+(a.budget.milestones.length?tableHTML(['Step','Amount','Due','What finishes this step','Status'],a.budget.milestones.map(m=>[m.name,money(m.amount,a.budget.currency),m.dueDate,m.deliverable,titlecase(m.status)])):'<p>No payment steps added.</p>'));
    html+=section('Linked changes to check','<p class="report-note">Marking a linked change as checked does not approve the finished asset.</p>'+(a.reviewFlags.length?a.reviewFlags.map(fl=>rowsHTML([['Changed asset',assetName(snapshot,fl.sourceId)],['Reason',fl.reason],['Status',fl.status],['Warning date',fl.createdAt],['Checked by',fl.reviewer],['What they found',fl.note],['Checked on',fl.resolvedAt]])).join(''):'<p>No linked changes to check.</p>'));
    html+=section('Change requests',a.revisions.length?a.revisions.map(r=>rowsHTML([['Requested by',r.by],['Date',r.requestedAt],['Request',r.note],['Status',r.status],['What was changed',r.resolution]])).join(''):'<p>No change requests added.</p>');
    const checks=checkRows(snapshot,a); html+=section('What this tool checked','<p class="report-note">These only look at what was typed. No model, image, sound, or game engine was tested.</p>'+(checks.length?tableHTML(['Type','Problem','Why'],checks):'<p>No problems found in what was typed. This does not mean the asset passed.</p>'));
    html+=section('Roblox pages to read',readingHTML(a.type));
    html+=section('Brief history',rowsHTML([['Asset ID',a.id],['Created',a.createdAt],['Last edited',a.updatedAt]])+(a.history.length?tableHTML(['Date','Who','Change'],a.history.map(h=>[h.at,h.by,h.summary])):'<p>No history yet.</p>'));
    return html+'</article>';
  }
  global.BriefContent={types,specs,exampleProject,markdown,reportHTML,esc,safeURL};
})(globalThis);

</script>
<script>
(() => {
'use strict';
const C=globalThis.BriefCore, T=globalThis.BriefContent;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=T.esc, safeURL=T.safeURL, clone=C.clone;
const STORE='avalon.asset_briefs.workspace.v1', RECOVERY=STORE+'.rejected';
let workspace=null,draft=null,profileDraft=null,view='start',step='purpose',selectedOutput='',outputMode='human',dirty=false,storageMessage='Start a project to begin',storageFailed=false,lastExport='',saveTimer=null,toastTimer=null,pendingImport=null,dialogActions=[],rawRecovery=null;
const filters={query:'',type:'',status:'',attention:''};
const steps=[['purpose','1. Goal'],['specs','2. Details'],['references','3. Examples'],['links','4. Links'],['checks','5. Done checks'],['delivery','6. Files'],['budget','7. Budget']];
const statuses=[['draft','Draft'],['ready','Ready to make'],['in_progress','Being made'],['submitted','Sent for checking'],['revision','Needs changes'],['accepted','Approved by owner']];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dateText=(s)=>s?new Date(s.length===10?s+'T12:00:00Z':s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not set';
const list=()=>workspace?C.getAssets(workspace):[];
const title=(a)=>a.name||'Untitled asset';
const statusName=(s)=>statuses.find(x=>x[0]===s)?.[1]||s;
const read=(obj,path)=>path.split('.').reduce((o,k)=>o?.[k],obj);
function put(obj,path,value){const keys=path.split('.');if(keys.some(x=>['__proto__','constructor','prototype'].includes(x)))throw new Error('Unsafe field');let dst=obj;for(const k of keys.slice(0,-1)){if(dst[k]===undefined)dst[k]={};dst=dst[k];}dst[keys.at(-1)]=value;}
function field(path,label,hint='',opts={}){const obj=opts.profile?profileDraft:draft;let val=read(obj||{},path);if(opts.lines&&Array.isArray(val))val=val.join('\n');val=val??'';const id='f-'+(opts.profile?'p-':'')+path.replace(/[^a-zA-Z0-9_-]/g,'-');let control;const numericText=opts.type==='number'&&!opts.number;if(numericText)opts={...opts,type:'text'};const attrs=`${numericText?'inputmode="decimal"':''} id="${id}" data-bind="${esc(path)}" ${opts.profile?'data-profile="true"':''} ${opts.number?'data-number="true"':''} ${opts.lines?'data-lines="true"':''} aria-describedby="${id}-hint"`;
if(opts.type==='select'){let options=opts.options||[];options=options.map(x=>Array.isArray(x)?x:[x.value,x.label]);if(!options.some(x=>x[0]===val))options=[...options,[String(val),String(val)||'Not answered yet']];control=`<select ${attrs}>${options.map(([v,l])=>`<option value="${esc(v)}" ${val===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;}
else if(opts.type==='textarea'||opts.lines)control=`<textarea ${attrs} maxlength="20000" rows="${opts.rows||3}" placeholder="${esc(opts.placeholder||'')}">${esc(val)}</textarea>`;
else control=`<input ${attrs} type="${opts.type||'text'}" ${opts.type==='number'?'min="0" max="1000000000000" step="any"':''} ${opts.type==='date'?'':'maxlength="2000"'} value="${esc(val)}" placeholder="${esc(opts.placeholder||'')}">`;
return `<div class="field ${opts.full?'full':''}"><label for="${id}">${esc(label)}${opts.required?'<span class="required">Needed</span>':''}</label>${control}<span class="hint" id="${id}-hint">${esc(hint)}</span></div>`;}
function checkbox(path,label,hint=''){const val=read(draft,path);return `<div class="field full"><label class="checkbox"><input type="checkbox" data-bind="${esc(path)}" ${val?'checked':''}><span>${esc(label)}<span class="hint">${esc(hint)}</span></span></label></div>`;}
const badge=(text,color='gray')=>`<span class="badge ${color}">${esc(text)}</span>`;
function notice(text,kind=''){return `<div class="notice ${kind}">${text}</div>`;}
function sectionHead(n,title,action=''){return `<div class="section-head"><h2>${n?`<span class="section-number">${n}</span>`:''}${esc(title)}</h2>${action}</div>`;}
function footer(){return `<div class="footer-note"><span>Made by <strong>Avalon Partner</strong> with Captain Amado. Free to use and share.</span><span>Version 1.0 · Roblox rules checked 21 Oct 2026</span></div>`;}
function toast(msg,error=false){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').className='toast'+(error?' error':'');$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,5500);}
function top(){const p=workspace?.project;$('#projectName').textContent=p?(p.name||'Untitled project')+' · '+(p.gameVersion||'No game version yet'):'Asset Brief & Handoff Builder';$('#saveStatus').textContent=storageMessage;$('#saveStatus').className='save-status'+(storageFailed?' error':'');$('#exportButton').disabled=!workspace;$$('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===view||(view==='editor'&&b.dataset.nav==='register'));if(b.classList.contains('active'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function openDialog(title,body,actions){const d=$('#dialog');if(d.open)d.close();$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialogError').textContent='';dialogActions=actions;$('#dialogActions').innerHTML=actions.map((a,i)=>`<button class="btn ${a.style||''}" data-dialog-action="${i}">${esc(a.label)}</button>`).join('');d.showModal();setTimeout(()=>($('[autofocus]',d)||$('button',d))?.focus(),0);}
function closeDialog(){$('#dialog').close();dialogActions=[];pendingImport=null;}
$('#dialog').addEventListener('click',e=>{const b=e.target.closest('[data-dialog-action]');if(!b)return;const a=dialogActions[Number(b.dataset.dialogAction)];if(a)a.run();});
$('#dialog').addEventListener('cancel',()=>{dialogActions=[];pendingImport=null;});
function alertDialog(title,msg){openDialog(title,notice(esc(msg),'error'),[{label:'Close',run:closeDialog}]);}
function protectedNav(next){if(!dirty){draft=null;profileDraft=null;next();return;}openDialog('Keep your changes?',`<p>You made changes that are not saved yet.</p><p class="muted">You can save them, throw them away, or stay on this page.</p>`,[{label:'Stay here',run:closeDialog},{label:'Throw away changes',style:'danger',run:()=>{closeDialog();dirty=false;draft=null;profileDraft=null;next();autosave();}},{label:'Save and continue',style:'primary',run:()=>{if(commit(false)){closeDialog();draft=null;profileDraft=null;next();}}}]);}
function navigate(to){protectedNav(()=>{if(!workspace&&['register','profile','outputs'].includes(to)){view='start';toast('Click Start from scratch or Try an example first.');}else view=to;if(view==='profile')profileDraft=clone(workspace.project);render();window.scrollTo(0,0);});}
function latestSnapshot(){if(!workspace)return null;let s=clone(workspace);if(profileDraft&&dirty)s.project=clone(profileDraft);if(draft&&dirty)s=C.saveAsset(s,clone(draft),'Local editor','Saved from current editor for export');return s;}
function preserveRecovery(){if(!rawRecovery)return;localStorage.setItem(RECOVERY,rawRecovery);if(localStorage.getItem(RECOVERY)!==rawRecovery)throw new Error('Recovery text could not be preserved');}
function autosave(){clearTimeout(saveTimer);if(!workspace)return;try{preserveRecovery();const wrapper={format:'avalon.asset-briefs.autosave',version:1,snapshot:workspace,draft,profileDraft,view,step,selectedOutput,lastExport};const raw=JSON.stringify(wrapper);localStorage.setItem(STORE,raw);if(localStorage.getItem(STORE)!==raw)throw new Error('Storage did not retain the write');storageFailed=false;storageMessage=dirty?'Changes kept in this browser · Click '+(view==='profile'?'Save project info':'Save brief'):'Saved in this browser · Click Save project file to keep a copy';}catch(e){storageFailed=true;storageMessage='Cannot save in this browser · Click Save project file';}top();}
function queueSave(){clearTimeout(saveTimer);storageMessage='Saving in this browser…';top();saveTimer=setTimeout(autosave,400);}
function markDirty(){dirty=true;const el=$('#dirtyState');if(el)el.textContent='Not saved yet';const b=$('#saveBrief');if(b)b.textContent='Save brief';queueSave();}
function validateCandidate(s){const v=C.validateSnapshot(s);if(!v.ok){alertDialog('Could not save this change',v.errors.slice(0,6).join('\n'));return false;}return true;}
function commit(showToast=true){if(!workspace)return false;for(const el of $$('[data-bind]')){if(!el.checkValidity()){el.reportValidity();return false;}}if(!dirty){if(showToast)toast('No new changes to save.');return true;}let s;try{if(profileDraft){s=clone(workspace);s.project=clone(profileDraft);}else if(draft){s=C.saveAsset(workspace,clone(draft),'Local editor','Updated production brief');}else return true;}catch(e){alertDialog('Could not save',e.message);return false;}if(!validateCandidate(s))return false;workspace=s;if(draft)draft=clone(list().find(a=>a.id===draft.id));dirty=false;autosave();if(showToast)toast('Saved! Your checks and warnings are now up to date.');if(view==='editor'||view==='profile')render();return true;}
function download(text,name,mime='text/plain;charset=utf-8'){try{const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return true;}catch(e){alertDialog('Download could not start',e.message+' Try copying the text instead, or use another browser.');return false;}}
function exportJSON(override=null){let s=override;if(!s){if(!workspace)return;if(dirty&&!commit(false))return;s=workspace;}if(!validateCandidate(s))return;const name=C.filename(s.project.name||'Avalon_Project')+'_'+today()+'.json';if(download(JSON.stringify(s,null,2),name,'application/json;charset=utf-8')){if(!override){lastExport=C.now();autosave();}toast('Your project file is downloading. Keep it safe. You can open it again later.');}}
function loadSnapshot(s){workspace=clone(s);draft=null;profileDraft=null;dirty=false;view='register';selectedOutput=list()[0]?.id||'';lastExport='';autosave();render();window.scrollTo(0,0);}
function moduleSummary(s){return Object.entries(s?.tools||{}).map(([key,val])=>({key,version:val&&typeof val==='object'&&'moduleVersion'in val?val.moduleVersion:'unknown format'}));}
function replacement(candidate,label){if(!validateCandidate(candidate))return;if(!workspace){if(rawRecovery){openDialog('Replace the saved work that could not load?',notice('Some saved work in this browser could not load. Download it first if you want to keep it.','warning'),[{label:'Cancel',run:closeDialog},{label:'Download saved work',run:()=>download(rawRecovery,'Avalon_Browser_Recovery.txt')},{label:'Start new project',style:'primary',run:()=>{closeDialog();loadSnapshot(candidate);}}]);}else loadSnapshot(candidate);return;}const old=workspace, incoming=candidate;const cur=moduleSummary(old),inc=moduleSummary(incoming);const absent=cur.filter(x=>!Object.hasOwn(incoming.tools,x.key));const changed=inc.map(x=>{const state=!Object.hasOwn(old.tools,x.key)?'New':JSON.stringify(old.tools[x.key])===JSON.stringify(incoming.tools[x.key])?'Same':'Changed';return `<tr><td>${esc(x.key)}</td><td>${esc((typeof x.version==='object'?JSON.stringify(x.version):String(x.version)).slice(0,300))}</td><td>${state}</td></tr>`;}).join('');pendingImport=incoming;
openDialog(label,`${notice('This will replace the project you have open now. Check the details below first. Two projects can have the same name and still be different.','warning')}${dirty?notice('You have changes that are not saved yet. Click Download a backup first to keep them. Replacing will throw them away.','warning'):''}<table class="doc-table"><thead><tr><th>Project</th><th>Open now</th><th>From the file</th></tr></thead><tbody><tr><td>Name</td><td>${esc(old.project.name||'Untitled')}</td><td>${esc(incoming.project.name||'Untitled')}</td></tr><tr><td>Game version</td><td>${esc(old.project.gameVersion||'Not set')}</td><td>${esc(incoming.project.gameVersion||'Not set')}</td></tr><tr><td>Project ID</td><td class="mono">${esc(old.project.id)}</td><td class="mono">${esc(incoming.project.id)}</td></tr><tr><td>Asset briefs</td><td>${C.getAssets(old).length}</td><td>${C.getAssets(incoming).length}</td></tr></tbody></table><p><strong>${old.project.id===incoming.project.id?'Same project ID. It will still replace everything.':'These are different projects.'}</strong> Nothing gets combined. The file replaces what is open now.</p><table class="doc-table"><thead><tr><th>Tool data in the file</th><th>Version</th><th>What changed</th></tr></thead><tbody>${changed||'<tr><td colspan="3">No tool data in this file</td></tr>'}</tbody></table>${absent.length?notice('<strong>Tool data missing from the file:</strong> '+absent.map(x=>esc(x.key)).join(', ')+'. It will be gone after you replace. Save a backup first.','warning'):notice('Nothing from your open project will go missing.')}<p class="small muted">Data from other Avalon tools is kept as it is. This tool does not check it. This tool cannot see if a download finished, so check your Downloads folder.</p>`,[{label:'Cancel',run:closeDialog},{label:'Download a backup',run:()=>{try{exportJSON(latestSnapshot());}catch(e){$('#dialogError').textContent=e.message;}}},{label:'Replace and open',style:'primary',run:()=>{const next=pendingImport;closeDialog();if(next)loadSnapshot(next);}}]);}
async function importFile(file){if(!file)return;if(file.size>5*1024*1024){alertDialog('Could not open this file','This file is too big. The limit is 5 MB. Nothing in your project changed.');return;}try{const raw=await file.text();const res=C.parseSnapshot(raw);if(!res.ok){alertDialog('Could not open this file',res.errors.slice(0,8).join('\n')+'\nNothing in your project changed.');return;}replacement(res.value,'Check the file before you open it');}catch(e){alertDialog('Could not open this file',e.message+' Nothing in your project changed.');}}
$('#importFile').addEventListener('change',e=>{importFile(e.target.files[0]);e.target.value='';});
function createEmpty(){replacement(C.newProject(),'Start from scratch');}
function loadExample(){replacement(T.exampleProject(),'Try an example');}
function duplicateProject(){if(!workspace)return;let s;try{s=latestSnapshot();}catch(e){alertDialog('Could not duplicate',e.message);return;}s.project.id=C.uuid();s.project.name=(s.project.name||'Untitled project')+' (copy)';replacement(s,'Make a copy of this project');}
function addAsset(type){protectedNav(()=>{if(!workspace)workspace=C.newProject();draft=C.newAsset(type);draft.engine=workspace.project.engine;draft.platform=workspace.project.platform;draft.audience=workspace.project.targetAudience;view='editor';step='purpose';dirty=true;render();autosave();window.scrollTo(0,0);});}
function typePicker(){if(!workspace){toast('Start a project first. Click Start from scratch or Try an example.');return;}openDialog('What are you making?',`<p class="muted">Pick a type. The tool will show only the questions for that type. You can add more later.</p><div class="type-picker">${Object.entries(T.types).map(([key,t])=>`<button class="type-choice" data-new-type="${esc(key)}"><strong>${esc(t.label)}</strong><span>${esc(t.description)}</span></button>`).join('')}</div>`,[{label:'Cancel',run:closeDialog}]);}
function editAsset(id){protectedNav(()=>{const a=list().find(x=>x.id===id);if(!a)return;draft=clone(a);dirty=false;view='editor';step='purpose';render();window.scrollTo(0,0);});}
function render(){top();const m=$('#main');if(view==='start')m.innerHTML=startView();else if(view==='register')m.innerHTML=registerView();else if(view==='profile')m.innerHTML=profileView();else if(view==='editor')m.innerHTML=editorView();else if(view==='outputs')m.innerHTML=outputsView();else if(view==='sources')m.innerHTML=sourcesView();else m.innerHTML=helpView();if(rawRecovery&&workspace)m.insertAdjacentHTML('afterbegin',notice('Some earlier changes could not load. You can download them as a text file. <button class="btn text" data-action="recovery">Download saved work</button> <button class="btn text" data-action="clear-recovery">Delete saved work</button>','warning'));}
function startView(){return `<section class="intro"><div><div class="eyebrow">Avalon Partner / Plan your game assets</div><h1>Clear briefs.<br>Better handoffs.</h1><p class="lede">Turn “make me a monster” into a clear plan. Then your artist, teammate, or AI helper knows exactly what to make.</p><p class="small muted" style="margin-bottom:20px">An <strong>asset</strong> is one piece of your game, like a model, a sound, or an icon. A <strong>brief</strong> is a short plan for it. A <strong>handoff</strong> is when you give that plan to the person who makes it.</p><div class="toolbar"><button class="btn primary" data-action="new-project">Start from scratch</button><button class="btn" data-action="example">Try an example</button></div><p class="small muted" style="margin-top:14px">Free. No sign-up. Works offline.</p></div><div class="intro-art" aria-hidden="true"><div class="sheet-illustration"><div class="eyebrow">Asset brief / 001</div><svg viewBox="0 0 220 120" width="100%" height="120"><path d="m110 12 65 33v58l-65 33-65-33V45Z" transform="translate(0,-10)" fill="#edf3ed" stroke="#31634d" stroke-width="1.5"/><path d="m45 35 65 34 65-34M110 69v56M79 52l64-33" fill="none" stroke="#31634d" stroke-width="1.5"/><path d="M25 14v84m-4-81 4-5 4 5m-8 77 4 5 4-5M189 47v51" fill="none" stroke="#963947"/><path d="M12 107h192" stroke="#bdcfc1" stroke-dasharray="3 4"/></svg><div class="rule"></div><div class="rule short"></div><div style="margin-top:16px;font-size:10px;color:#4d6b55">Goal · Details · Done checks</div></div><div class="illus-tag">One plan.<br>Three ways to share it.</div></div></section><div class="flow-strip" style="border-top:0;padding-top:0;margin-bottom:6px"><strong style="color:var(--ink)">How to use this tool:</strong><span><b>1</b>Pick what you want made, like a model, a sound, or an icon.</span><span><b>2</b>Answer the questions: what it does and how it looks or sounds.</span><span><b>3</b>Add done checks, then share or print the brief.</span></div><div class="feature-grid"><article class="card"><div class="eyebrow">01 / Plan</div><h3>Answer the right questions</h3><p class="small muted">Pick from 7 asset types. Each one asks only the questions it needs, with examples.</p></article><article class="card"><div class="eyebrow">02 / Link</div><h3>See what a change affects</h3><p class="small muted">Link assets that go together, like a model and its animation. If one changes, the tool tells you which others to check.</p></article><article class="card"><div class="eyebrow">03 / Share</div><h3>Know when it is done</h3><p class="small muted">Share an easy-to-read brief, AI instructions, or a checklist. Write down who checked the work and what they saw.</p></article></div>${workspace?notice(`<strong>Current project: ${esc(workspace.project.name||'Untitled project')}</strong> · ${list().length} assets <button class="btn text" data-nav="register">Continue working</button>`):''}${notice('Your work saves in this browser, but it can get erased. Click <strong>Save project file</strong> to keep a copy on your computer. You can open that same file in other Avalon tools too.')}${rawRecovery?`<div class="notice error">Some saved work in this browser could not load. It is still there. <button class="btn text" data-action="recovery">Download saved work</button></div>`:''}${footer()}`;}
function filteredAssets(){return list().filter(a=>{const q=filters.query.toLowerCase();const hay=[a.name,a.code,a.owner,a.purpose,a.version].join(' ').toLowerCase();const cs=C.checks(a,workspace);return (!q||hay.includes(q))&&(!filters.type||a.type===filters.type)&&(!filters.status||a.status===filters.status)&&(!filters.attention||(filters.attention==='missing'?cs.some(x=>x.level==='missing'):a.reviewFlags.some(x=>x.status==='open')));});}
function registerRows(){const arr=filteredAssets();if(!arr.length)return `<div class="empty"><div class="eyebrow">${list().length?'No matches':'Your next asset starts here'}</div><h2>${list().length?'Nothing matches':'Give your idea a clear brief'}</h2><p>${list().length?'No assets match your search. Click Clear filters to see them all.':'Nothing here yet. Click Add your first asset to start. It can be a 3D model, rig, animation, 2D art, UI art, sound effect, or music.'}</p><button class="btn primary" data-action="${list().length?'clear-filters':'add-asset'}">${list().length?'Clear filters':'Add your first asset'}</button></div>`;return `<div class="asset-list">${arr.map(a=>{const checks=C.checks(a,workspace),missing=checks.filter(x=>x.level==='missing').length,flags=a.reviewFlags.filter(x=>x.status==='open').length;const passed=a.criteria.filter(c=>C.criteriaState(a,c)==='pass').length;return `<article class="asset-row"><div class="type-mark">${esc(({model:'3D',rig:'RIG',animation:'ANIM',art2d:'2D',interface:'UI',sfx:'SFX',music:'MUS'})[a.type])}</div><div><h3>${esc(title(a))}</h3><div class="subline"><span>${esc(a.code||'No code')} · ${esc(a.version||'No version')}</span><span>${esc(a.owner||'No owner yet')}</span>${badge(statusName(a.status))}${flags?badge(flags+' linked change'+(flags===1?'':'s')+' to check','red'):''}${missing?badge(missing+' not answered','amber'):badge('All questions answered','green')}</div></div><div class="row-actions">${badge(passed+'/'+a.criteria.length+' checks passed','gray')}<button class="btn small" data-action="edit" data-id="${a.id}" aria-label="Open ${esc(title(a))}">Open</button></div></article>`;}).join('')}</div>`;}
function registerView(){const all=list(),missing=all.filter(a=>C.checks(a,workspace).some(x=>x.level==='missing')).length,flagged=all.filter(a=>a.reviewFlags.some(f=>f.status==='open')).length,unverified=all.reduce((n,a)=>n+a.criteria.filter(c=>C.criteriaState(a,c)!=='pass').length,0);return `<div class="page-title"><div><div class="eyebrow">Your project</div><h1>Asset list</h1><p class="muted">See what to make, what is missing, and what needs another look.</p></div><div class="toolbar"><button class="btn" data-action="csv" title="CSV is a simple spreadsheet file. It opens in Excel or Google Sheets. You cannot open it back in this tool.">Save list as spreadsheet (CSV)</button><button class="btn primary" data-action="add-asset">+ Add asset</button></div></div><div class="stats"><div class="stat"><span>Assets in this project</span><strong>${all.length}</strong></div><div class="stat"><span>Briefs with questions left</span><strong>${missing}</strong></div><div class="stat"><span>Assets with changes to check</span><strong>${flagged}</strong></div><div class="stat"><span>Done checks not passed yet</span><strong>${unverified}</strong></div></div><div class="filterbar"><div class="search"><label for="searchAssets">Find an asset</label><input id="searchAssets" data-filter="query" value="${esc(filters.query)}" placeholder="Search name, code, owner, goal…" type="search"></div><div><label for="filterType">Asset type</label><select id="filterType" data-filter="type"><option value="">All types</option>${Object.entries(T.types).map(([k,t])=>`<option value="${k}" ${filters.type===k?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div><div><label for="filterStatus">Status</label><select id="filterStatus" data-filter="status"><option value="">All statuses</option>${statuses.map(([k,t])=>`<option value="${k}" ${filters.status===k?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="filterAttention">Needs attention</label><select id="filterAttention" data-filter="attention"><option value="">All assets</option><option value="missing" ${filters.attention==='missing'?'selected':''}>Questions left</option><option value="review" ${filters.attention==='review'?'selected':''}>Linked changes to check</option></select></div></div><div id="registerRows">${registerRows()}</div>${notice('<strong>These checks only look at what you typed.</strong> A filled-in brief does not mean the asset is good. “Approved by owner” is just a status. Each done check still needs a person, a date, and what they saw.')}${footer()}`;}
function profileView(){if(!profileDraft)profileDraft=clone(workspace.project);return `<div class="page-title"><div><div class="eyebrow">Shared with your other Avalon tools</div><h1>Project info</h1><p class="muted">Fill this in once. Every brief in this project uses it. One brief can still use different settings if you change them in that brief.</p></div><div class="toolbar"><button class="btn" data-action="duplicate-project">Make a copy</button><button class="btn" data-action="new-project">Start from scratch</button></div></div><div class="card"><div class="field-grid">${field('name','Project name','Example: Moonwell Hollow',{profile:true,full:true})}${field('platform','Platform','Where people play. Example: Roblox, PC, or phone',{profile:true})}${field('engine','Game engine and tools','The apps you build with. Example: Roblox Studio and Blender',{profile:true})}${field('genre','Genre','The kind of game. Example: team exploring game',{profile:true})}${field('targetAudience','Who it is for','Who plays it? Add ages and any needs, like big text or no flashing lights.',{profile:true})}${field('targetDevices','Devices','One per line. Example: computer, tablet, phone',{profile:true,lines:true})}${field('designPillars','Main game ideas','The 2 or 3 big ideas your game is about. One per line. Example: easy-to-spot shapes, playful danger',{profile:true,lines:true})}${field('stage','How far along','Example: first test version, one finished level, or already live',{profile:true})}${field('gameVersion','Game version','The version of your game these briefs are for. Example: 0.1',{profile:true})}${field('sessionLengthMinutes','Play time per visit (minutes)','Optional. About how long one play visit lasts. Leave blank if you do not know.',{profile:true,number:true,type:'number'})}</div></div>${notice('If a brief has its own engine, platform, or audience, changing this page will not change it. Check those briefs before you share them.')}<div class="editor-footer"><span class="status-text" id="dirtyState">${dirty?'Not saved yet':'Saved'}</span><div class="toolbar"><button class="btn" data-nav="register">Back to asset list</button><button class="btn primary" data-action="save-profile">Save project info</button></div></div><details class="disclosure"><summary>Project ID and moving files</summary><div><p>This ID stays the same when you save or open the file. Make a copy gives the copy a new ID.</p><p class="mono">${esc(workspace.project.id)}</p><p class="small muted">To use this project in another Avalon tool, click Save project file. Then open that file in the other tool. Two projects with the same name are not always the same project.</p></div></details>${footer()}`;}
function viewSnapshot(){if(!draft)return workspace;const s=clone(workspace);if(!s.tools.asset_briefs)s.tools.asset_briefs={moduleVersion:1,updatedAt:C.now(),payload:{assets:[]}};const arr=s.tools.asset_briefs.payload.assets;const i=arr.findIndex(a=>a.id===draft.id);if(i<0)arr.push(clone(draft));else arr[i]=clone(draft);return s;}
function summaryPanel(){const checks=C.checks(draft,viewSnapshot()),missing=checks.filter(c=>c.level==='missing'),flags=draft.reviewFlags.filter(f=>f.status==='open'),pass=draft.criteria.filter(c=>C.criteriaState(draft,c)==='pass').length;return `<aside class="brief-summary" aria-label="Brief status"><h3>Before you share it</h3><div class="status-item"><strong>${missing.length?missing.length+' questions left':'All needed questions answered'}</strong><p>${missing.length?esc(missing.slice(0,3).map(x=>x.title).join('; ')):'This only checks that boxes are filled. Read it over to make sure it is clear.'}</p></div><div class="status-item"><strong>${flags.length} linked change${flags.length===1?'':'s'} to check</strong><p>${flags.length?'An asset this one needs has changed. Check it and write down what you found.':'Link related assets so you hear about changes.'}</p></div><div class="status-item"><strong>${pass} / ${draft.criteria.length} done checks passed</strong><p>Changing the status does not pass a check. A person has to check it.</p></div><button class="btn small" data-step="checks">Go to done checks</button></aside>`;}
function editorView(){if(!draft)return registerView();return `<div class="page-title"><div><button class="btn text" data-nav="register">Back to asset list</button><div class="eyebrow" style="margin-top:14px">${esc(T.types[draft.type].label)} / Brief</div><h1 id="assetHeading">${esc(title(draft))}</h1><p class="muted">Say what to make. Then say how someone will check that it is done.</p></div><div class="toolbar"><button class="btn" data-action="asset-outputs">Preview and share</button><button class="btn danger" data-action="delete-asset">Delete asset</button></div></div><div class="editor-tabs" aria-label="Brief sections">${steps.map(([k,v])=>`<button data-step="${k}" class="${step===k?'active':''}" ${step===k?'aria-current="step"':''}>${v}</button>`).join('')}</div><div class="editor-layout"><div class="editor-body">${step==='purpose'?purposeView():step==='specs'?specsView():step==='references'?referencesView():step==='links'?linksView():step==='checks'?checksView():step==='delivery'?deliveryView():budgetView()}</div><div id="summaryPanel">${summaryPanel()}</div></div><div class="editor-footer"><span class="status-text" id="dirtyState">${dirty?'Not saved yet':'Saved'} · <span title="This number goes up when you change what the asset needs.">Brief update #${draft.revision}</span></span><div class="toolbar"><button class="btn" data-action="next-step">${step==='budget'?'Back to step 1':'Next step'}</button><button class="btn primary" id="saveBrief" data-action="save">Save brief</button></div></div>${footer()}`;}
function purposeView(){return `<section class="card">${sectionHead('1','What should this asset do?')}<p class="muted small">Start with what the player does. Words like “looks cool” are hard to check. Add an example picture, or something a person can see or hear.</p><div class="field-grid section-space">${field('name','Asset name','Example: Mossback sentinel or inventory icon set',{required:true})}${field('code','Asset code','A short tag that never changes, like MON-001 or UI-014.')}${field('purpose','What it does in the game','What does the player do or learn because of it?',{type:'textarea',full:true,required:true})}${field('audience','Audience','Who will see or hear it? Think about age, mood, and players who need extra help.',{type:'textarea'})}${field('context','Where players see or hear it','Example: seen from 10 meters away on a phone, or heard while characters talk.',{type:'textarea',required:true})}${field('direction','How it should look or sound','Describe the shape, colors, mood, beat, or feel. You can add example links in step 3.',{type:'textarea',full:true,required:true})}${field('variations','Versions needed','List colors, skins, states (like on and off), or loud and soft versions. Write None if you only need one.',{type:'textarea',required:true})}${field('completion','What “done” means','What files must you get, and what must be checked, before it is finished?',{type:'textarea',required:true})}</div></section><section class="card">${sectionHead('','Who and when')}<div class="field-grid">${field('owner','Who is making it','The person or team who will make and deliver it.')}${field('dueDate','Due date','Optional. The tool will not send you a reminder.',{type:'date'})}${field('version','Asset version','Example: v1.2. Which version of the asset this brief is for.',{required:true})}${field('status','Status','Shows where the work is. It does not pass any done checks.',{type:'select',options:statuses})}${field('platform','Platform (only if different)','Leave blank to use the platform from Project info.')}${field('engine','Engine (only if different)','Leave blank to use the engine from Project info.')}</div></section>`;}
function sourceLink(title,url){return `<a href="${url}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>`;}
function platformNote(a){const platform=(a.platform||workspace.project.platform).toLowerCase();if(!platform.includes('roblox'))return notice('Your project sets these details. This tool only has Roblox rules. Check the rules for your own game engine.');let body='';if(['model','rig'].includes(a.type))body=`<strong>Roblox models (meshes):</strong> Roblox says one mesh can have at most 20,000 triangles. That is a top limit, not a goal. Staying under it does not promise your game runs fast. Avatar bodies and accessories have extra rules. ${sourceLink('General specifications','https://create.roblox.com/docs/art/modeling/specifications')}.`;
else if(a.type==='animation')body=`<strong>Roblox animation:</strong> write the exact rig (skeleton) name and version. If you export several animations with a mesh, export each one as its own file. ${sourceLink('Animation Editor','https://create.roblox.com/docs/animation/editor')} · ${sourceLink('General specifications','https://create.roblox.com/docs/art/modeling/specifications')}.`;
else if(['sfx','music'].includes(a.type))body=`<strong>Roblox audio upload rules:</strong> one track. MP3, OGG, WAV, or FLAC. Less than 20 MB and less than 420 seconds (7 minutes). Sample rate 48 kHz or lower. Channels: mono, stereo 2.0, 3.0, or 5.1 surround. These are upload rules, not sound mixing goals. ${sourceLink('Audio assets','https://create.roblox.com/docs/audio/assets')}.`;
else body=`<strong>Roblox UI images:</strong> say how the image should resize: fit, crop, stretch, or nine-slice. Nine-slice keeps corners sharp when a panel grows. Icons usually do not need it. ${sourceLink('UI 9-slice design','https://create.roblox.com/docs/ui/9-slice')} · ${sourceLink('Importer','https://create.roblox.com/docs/studio/importer')}.`;
return notice(body+' <span class="small">Checked 21 Oct 2026. This tool does not open or test your files.</span>');}
function specsView(){const fields=(T.specs[draft.type]||[]).filter(x=>!(draft.type==='model'&&draft.specs.rigRequired!=='yes'&&['targetRig','rigRequirements'].includes(x.key)));return `<section class="card">${sectionHead('2','Details for the maker','<button class="btn small" data-action="preset" title="See a short list of tips for this kind of asset. You can add it to your brief.">Add helpful notes</button>')}<p class="muted small">Decide these with the person making the asset. It is fine to leave a question “Not answered yet” until you agree.</p>${platformNote(draft)}<div class="field-grid section-space">${fields.map(f=>field('specs.'+f.key,f.label,f.hint,{type:f.type,options:f.options,required:f.required,full:f.type==='textarea'})).join('')}</div>${['model','rig'].includes(draft.type)?notice('<strong>Pick your own texture size.</strong> The Roblox texture page gives two different top sizes. Choose a size for your project here. Then test it where you will upload it. '+sourceLink('Texture specifications','https://create.roblox.com/docs/art/modeling/texture-specifications'),'warning'):''}</section>${numericWarnings(draft).map(c=>notice('<strong>Check your number:</strong> '+esc(c),'warning')).join('')}`;}
function numericWarnings(a){return C.checks(a,viewSnapshot()).filter(c=>['roblox-audio-duration','duration-positive'].includes(c.code)).map(c=>c.why);}
function entryHead(label,type,i){return `<div class="entry-head"><strong>${esc(label)}</strong><button class="btn small danger" data-action="remove-record" data-list="${type}" data-index="${i}">Remove</button></div>`;}
function referencesView(){return `<section class="card">${sectionHead('3','Examples to follow','<button class="btn small" data-action="add-reference">+ Add example</button>')}<p class="muted small">An example (also called a reference) is something to follow, like a picture or a song. Keep its link, who made it, and your permission to use it together. Approving it here only means “follow this style.”</p>${notice('Approving an example does not mean you are allowed to copy or use it. Write down the license and where it came from. If you are not sure you can use it, ask a trusted adult or an expert. This is not legal advice.')}<div class="section-space">${draft.references.map((r,i)=>`<article class="entry-card">${entryHead('Example '+(i+1),'references',i)}<div class="field-grid">${field(`references.${i}.label`,'Name of example','Example: outline drawing v2',{full:true})}${field(`references.${i}.url`,'Link','Links that start with http or https can be opened. Anything else is saved as plain text.',{type:'text'})}${field(`references.${i}.sourceRecord`,'Original source','Paste the link or ID of where it first came from. It can come from another Avalon tool.')}${field(`references.${i}.attribution`,'Credit notes','Who made it, what it is called, and how they want to be credited.',{type:'textarea'})}${field(`references.${i}.license`,'License or permission','Example: the license name, link, and any limits. This tool does not check it.',{type:'textarea'})}${field(`references.${i}.notes`,'What to follow or avoid','Example: copy the outline shape only. Use our own colors.',{type:'textarea',full:true})}${checkbox(`references.${i}.approved`,'Approved as a style to follow','If you change an approved example, linked briefs get a warning to check when you save.')}</div>${safeURL(r.url)?`<a class="btn text" href="${esc(safeURL(r.url))}" target="_blank" rel="noopener noreferrer">Open link</a>`:''}${safeURL(r.sourceRecord)?`<a class="btn text" style="margin-left:12px" href="${esc(safeURL(r.sourceRecord))}" target="_blank" rel="noopener noreferrer">Open original source</a>`:''}</article>`).join('')||'<div class="empty"><h3>No examples yet</h3><p>Nothing here yet. Click Add example to add a link or a written note. The tool never opens or scans links by itself.</p></div>'}</div></section>`;}
function linksView(){const candidates=list().filter(a=>a.id!==draft.id),lookup=id=>candidates.find(a=>a.id===id);return `<section class="card">${sectionHead('4','Links to other assets','<button class="btn small" data-action="add-dependency">+ Add link</button>')}<p class="muted small">Link this asset to another asset it needs. For example, an animation needs its model or rig. If that asset changes, this brief gets a warning. The tool does not change it for you.</p><div class="section-space">${draft.dependencies.map((d,i)=>`<article class="entry-card">${entryHead('Depends on '+(lookup(d.assetId)?.name||'a missing asset'),'dependencies',i)}<div class="field-grid">${field(`dependencies.${i}.assetId`,'Asset it needs','Pick the asset this one needs.',{type:'select',options:candidates.map(a=>[a.id,title(a)])})}${field(`dependencies.${i}.kind`,'Link type','Rig (same skeleton), Style (same look), or General (anything else).',{type:'select',options:[['rig','Rig'],['style','Style'],['general','General']]})}${field(`dependencies.${i}.note`,'Why does it need it?','Example: this animation uses the exact Mossback_v1 skeleton.',{type:'textarea',full:true})}</div></article>`).join('')||'<div class="empty"><h3>No links yet</h3><p>Nothing here yet. Click Add link if this asset needs another one. Typing the name of another asset does not link them.</p></div>'}</div></section><section class="card">${sectionHead('','Related assets','<button class="btn small" data-action="add-related">+ Add related asset</button>')}<p class="small muted">For assets that go together but do not need each other. These do not get change warnings.</p><div class="section-space">${draft.relatedAssets.map((id,i)=>`<div class="entry-card">${entryHead(lookup(id)?.name||'Missing asset','relatedAssets',i)}${field(`relatedAssets.${i}`,'Related asset','',{type:'select',options:candidates.map(a=>[a.id,title(a)])})}</div>`).join('')||'<p class="muted small">Nothing here yet. Click Add related asset to add one.</p>'}</div></section><section class="card">${sectionHead('','Changes to check')}<div class="review-list">${draft.reviewFlags.map((f,i)=>`<div class="notice ${f.status==='open'?'warning':''}"><strong>${f.status==='open'?'Check needed':'Checked'}</strong><p>${esc(f.reason)}</p><p class="small">${dateText(f.createdAt)} · Changed asset: ${esc(list().find(a=>a.id===f.sourceId)?.name||f.sourceId)}</p>${f.status==='open'?`<button class="btn small" data-action="ack-flag" data-index="${i}">Mark as checked</button>`:`<p class="small">${esc(f.reviewer)}: ${esc(f.note)} (${dateText(f.resolvedAt)})</p>`}</div>`).join('')||'<p class="small muted">No changes to check right now.</p>'}</div></section>`;}
function checksView(){const cs=C.checks(draft,viewSnapshot());return `<section class="card">${sectionHead('5','Done checks','<button class="btn small" data-action="add-criterion">+ Add check</button>')}<p class="small muted">A done check is a test that shows the work is finished. Say what to check, how to check it, and what a pass looks like.</p><div class="toolbar section-space"><button class="btn small" data-action="criteria-template">Add starter checks you can edit</button></div>${notice('<strong>Writing a check is not the same as passing it.</strong> This tool only looks at what you typed. A person has to look at, listen to, or test the asset in the game to pass a check.')}<div class="section-space">${draft.criteria.map((c,i)=>`<article class="entry-card">${entryHead('Check '+(i+1),'criteria',i)}<div class="field-grid">${field(`criteria.${i}.requirement`,'What must be true','Example: the idle animation is there and loops without stopping.',{type:'textarea',full:true})}${field(`criteria.${i}.method`,'How to check','Example: put it in the test level and play it 3 times in a row.',{type:'textarea'})}${field(`criteria.${i}.expected`,'What a pass looks like','Example: no jump when it loops. Both feet stay on the ground.',{type:'textarea'})}</div><div class="review-box">${badge(C.criteriaState(draft,c)==='pass'?'Passed':C.criteriaState(draft,c)==='fail'?'Failed':C.criteriaState(draft,c)==='stale'?'Out of date, check again':'Not checked yet',C.criteriaState(draft,c)==='pass'?'green':C.criteriaState(draft,c)==='unverified'?'gray':'amber')}<p style="margin-top:8px">${c.review.reviewer?`${esc(c.review.reviewer)} · ${dateText(c.review.checkedAt)} · ${esc(c.review.version)} · Brief update #${c.review.assetRevision}`:'Nobody has checked this yet.'}</p>${c.review.evidence?`<p>${esc(c.review.evidence)}</p>`:''}<button class="btn small" data-action="review-criterion" data-index="${i}" style="margin-top:10px">Record check result</button></div></article>`).join('')||'<div class="empty"><h3>How will you know it is done?</h3><p>Nothing here yet. Click Add check, or click Add starter checks you can edit.</p></div>'}</div></section><section class="card">${sectionHead('','What this tool checks for you')}<p class="small muted">These look only at what you typed. The tool does not score quality or test anything in a game engine.</p><div class="review-list section-space">${cs.map(c=>`<div class="check-rule">${badge(c.level==='missing'?'Not answered':c.level==='review'?'Check':'Info',c.level==='missing'?'amber':c.level==='review'?'red':'gray')}<strong>${esc(c.title)}</strong><p>${esc(c.why)}</p><span class="mono">${esc(c.code)}</span></div>`).join('')||notice('No problems found in what you typed. This does not mean the asset passed.')}</div></section><section class="card">${sectionHead('','Change requests','<button class="btn small" data-action="add-revision">+ Ask for a change</button>')}<p class="small muted">Write down what needs to change. Closing a request does not pass any done checks.</p><div class="section-space">${draft.revisions.map((r,i)=>`<div class="entry-card">${entryHead('Change request '+(i+1),'revisions',i)}<div class="field-grid">${field(`revisions.${i}.requestedAt`,'Requested on','',{type:'date'})}${field(`revisions.${i}.by`,'Requested by','Name or role.')}${field(`revisions.${i}.note`,'What should change','Say exactly what is different from the brief.',{type:'textarea',full:true})}${field(`revisions.${i}.status`,'Status','',{type:'select',options:[['open','Open'],['resolved','Done']]})}${field(`revisions.${i}.resolution`,'What was changed','Write what changed and which version has the fix.',{type:'textarea'})}</div></div>`).join('')||'<p class="small muted">No change requests yet.</p>'}</div></section><section class="card">${sectionHead('','Brief history')}<p class="small muted">When you change what the asset needs, the brief update number goes up. Old check results then need to be checked again. Small changes, like the owner or status, do not change the number.</p><ul class="history">${draft.history.slice().reverse().map(h=>`<li><small>${dateText(h.at)} · ${esc(h.by)}</small>${esc(h.summary)}</li>`).join('')||'<li>No saved changes yet.</li>'}</ul></section>`;}
function deliveryView(){return `<section class="card">${sectionHead('6','Files to deliver')}<p class="small muted">List the files the maker should send back. The tool does not attach, open, or send any files.</p><div class="field-grid section-space">${field('handoff.recipient','Who gets the work','A name or team. The tool does not send anything.',{full:true})}${field('handoff.sourceFiles','Work files needed','Files you can still edit. Example: Blender file, art file with layers, music project, raw recordings.',{type:'textarea',full:true,required:true})}${field('handoff.finalExports','Final files needed','Finished files ready for the game. List file types, versions, names, and where they go in the game.',{type:'textarea',full:true,required:true})}${field('handoff.naming','File naming rule','Example: MON_Mossback_Idle_v2.fbx. Say if capital letters or folders matter.',{type:'textarea'})}${field('handoff.implementation','Notes for putting it in the game','Explain upload settings, where it goes, what it needs, or which test level to use.',{type:'textarea'})}</div></section><section class="card">${sectionHead('','Files received','<button class="btn small" data-action="add-delivery">+ Add a file you got</button>')}${notice('Only add files the maker really sent you. Adding a file name or link does not prove the file is good. It does not pass any check.')}<div class="section-space">${draft.deliveries.map((d,i)=>`<article class="entry-card">${entryHead('File '+(i+1),'deliveries',i)}<div class="field-grid">${field(`deliveries.${i}.name`,'File name','Example: MON_Mossback_Idle_v2.fbx',{full:true})}${field(`deliveries.${i}.kind`,'File type','',{type:'select',options:[['source','Work file (editable)'],['export','Final file'],['other','Other']]})}${field(`deliveries.${i}.version`,'Version','The version of this file.')}${field(`deliveries.${i}.url`,'Link or location','Links that start with http or https can be opened. A folder path is saved as plain text.',{full:true})}${field(`deliveries.${i}.notes`,'Notes','Who sent it, when, and anything missing.',{type:'textarea',full:true})}</div>${safeURL(d.url)?`<a class="btn text" href="${esc(safeURL(d.url))}" target="_blank" rel="noopener noreferrer">Open link</a>`:''}</article>`).join('')||'<div class="empty"><h3>No files yet</h3><p>Nothing here yet. That is normal before the work is made. Click Add a file you got when files arrive.</p></div>'}</div></section>`;}
function amount(n,currency){return n===null||n===undefined?'Not answered yet':Number(n).toLocaleString(undefined,{maximumFractionDigits:20})+' '+(currency||'(no currency set)');}
function budgetFeedback(){const b=C.budgetSummary(draft);const known=draft.budget.milestones.some(m=>m.amount!==null);return `<div id="budgetFeedback"><div class="budget-sums"><div><small>Total of amounts entered</small><strong>${known?amount(b.knownTotal,draft.budget.currency):'No amounts entered'}</strong></div><div><small>Steps with no amount</small><strong>${b.unknownCount}</strong></div><div><small>Money left over</small><strong>${amount(b.remaining,draft.budget.currency)}</strong></div></div>${!b.complete&&draft.budget.milestones.length?notice('This total only adds the amounts you entered. To see money left over, enter every step amount and the total budget.','warning'):''}${!b.hasCurrency&&(draft.budget.total!==null||known)?notice('You entered amounts but no currency. Add a currency code, like USD.','warning'):''}${b.overBudget?notice('Your steps cost more than the total budget. Change the amounts or what is included.','warning'):''}</div>`;}
function budgetView(){const b=C.budgetSummary(draft);return `<section class="card">${sectionHead('7','Budget (optional)')}<p class="small muted">Plan what you will pay for, in one currency. These are your own numbers. They are not a price guess, a payment, or a contract.</p><div class="field-grid section-space">${field('budget.currency','Currency code','Three letters, like USD, EUR, GBP, or CAD. The tool does not convert money.')}${field('budget.total','Total budget (in the currency above)','Leave blank if you do not know. Type 0 only if it really costs nothing.',{type:'number',number:true})}${field('budget.scope','What the budget covers','List the work and files this money pays for.',{type:'textarea',full:true})}${field('budget.assumptions','What is and is not included','Example: one round of changes included. Putting it in the game is not included. Taxes still to agree.',{type:'textarea',full:true})}</div>${budgetFeedback()}<p class="small muted">How the math works: Total of amounts entered = all step amounts added up. Money left over = total budget minus that total. It only shows when every step has an amount. No taxes, fees, or exchange rates are added.</p></section><section class="card">${sectionHead('','Payment steps','<button class="btn small" data-action="add-milestone">+ Add step</button>')}<div class="section-space">${draft.budget.milestones.map((m,i)=>`<article class="entry-card">${entryHead('Step '+(i+1),'budget.milestones',i)}<div class="field-grid">${field(`budget.milestones.${i}.name`,'Step name','Example: rough shape approved',{full:true})}${field(`budget.milestones.${i}.amount`,'Amount ('+(draft.budget.currency||'no currency set')+')','Leave blank if you do not know.',{type:'number',number:true})}${field(`budget.milestones.${i}.dueDate`,'Target date','',{type:'date'})}${field(`budget.milestones.${i}.deliverable`,'What finishes this step','What someone can see or check when this step is done.',{type:'textarea',full:true})}${field(`budget.milestones.${i}.status`,'Step status','This tool does not make or track payments.',{type:'select',options:[['planned','Planned'],['in_progress','In progress'],['done','Done']]})}</div></article>`).join('')||'<p class="small muted">Nothing here yet. Click Add step if you want to split the budget into parts.</p>'}</div></section>`;}
function outputsView(){const assets=list();if(!selectedOutput||!assets.some(a=>a.id===selectedOutput))selectedOutput=assets[0]?.id||'';const a=assets.find(a=>a.id===selectedOutput);return `<div class="page-title"><div><div class="eyebrow">One brief, three ways to share</div><h1>Share your brief</h1><p class="muted">Give the brief to a teammate, an artist, or an AI helper. To keep editing later, click Save project file.</p></div><div class="toolbar"><button class="btn" data-action="print-all" ${assets.length?'':'disabled'}>Print all briefs</button></div></div>${a?`<div class="outputs-controls"><div class="field"><label for="outputAsset">Asset</label><select id="outputAsset">${assets.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${esc(title(x))} · ${esc(x.version||'No version')}</option>`).join('')}</select></div><div class="field"><label for="outputMode">Type of brief</label><select id="outputMode"><option value="human" ${outputMode==='human'?'selected':''}>Brief for a person</option><option value="ai" ${outputMode==='ai'?'selected':''}>Brief for an AI helper</option><option value="checklist" ${outputMode==='checklist'?'selected':''}>Done checklist</option></select></div><div class="toolbar"><button class="btn" data-action="copy-output" title="Copies the brief as Markdown: plain text with simple formatting. Paste it into Discord, a doc, or a chat.">Copy text</button><button class="btn" data-action="markdown" title="Markdown (.md) is plain text with simple formatting. It opens in most notes apps.">Download text file (.md)</button><button class="btn primary" data-action="print">Print / save PDF</button></div></div><div class="toolbar" style="margin-bottom:20px"><button class="btn small" data-action="edit" data-id="${a.id}">Edit this brief</button><button class="btn small" data-action="three-outputs">Download all three (.md)</button></div><div id="outputReport">${T.reportHTML(workspace,a,outputMode)}</div>`:`<div class="empty output-empty"><div class="eyebrow">Start with an asset</div><h2>Your briefs will show up here</h2><p>Nothing here yet. Click Add an asset. Then fill in its goal, details, and done checks.</p><button class="btn primary" data-action="add-asset">Add an asset</button></div>`}${footer()}`;}

{title:'Audio assets',url:'https://create.roblox.com/docs/audio/assets',scope:'Roblox rules / your own audio',text:'Your own audio must be one track in MP3, OGG, WAV, or FLAC. It must be under 20 MB and under 7 minutes. Sample rate must be 48 kHz or lower. Channels can be mono, stereo 2.0, 3.0, or 5.1 surround. This tool does not set a loudness goal.'},
