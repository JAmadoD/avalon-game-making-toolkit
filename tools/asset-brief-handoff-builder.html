function sourcesView(){return `<div class="page-title"><div><div class="eyebrow">Where our tips come from</div><h1>Roblox rules &amp; tips</h1><p class="muted">These official pages back up the tips in this tool. Following them does not promise your asset will work.</p></div></div><div class="card">${sectionHead('','Two kinds of advice')}<div class="panel-grid"><div><h3>Roblox rules</h3><p class="small muted">These come from Roblox pages. Each one shows the date we checked it. Rules can change, so check again before you start.</p></div><div><h3>Your choices</h3><p class="small muted">You decide your own limits: triangles, texture size, sound levels, length, rig, and speed goals. A new project does not fill these in for you.</p></div></div>${notice('<strong>Helpful notes:</strong> open an asset, go to step 2 (Details), and click Add helpful notes. You see the note first, then decide. Nothing you already typed gets erased.')}<p class="small muted">We read these pages on <strong>21 Oct 2026</strong>. The links need the internet. These summaries work offline. They do not update by themselves.</p></div><div class="panel-grid section-space">${sources.map(s=>`<article class="card source-card"><div class="eyebrow">${esc(s.scope)}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p><p class="source-date">Checked 21 Oct 2026${s.warning?' · Texture size rule unclear':''}</p><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.url}</a></article>`).join('')}</div>${footer()}`;}
function helpView(){return `<div class="page-title"><div><div class="eyebrow">How to use this tool</div><h1>From idea to finished asset</h1><p class="muted">Use the brief to say clearly what you want. Then use the checklist to write down what was really checked.</p></div></div><section class="card">${sectionHead('','Your first brief, step by step')}<ol><li><strong>Start a project.</strong> Click Try an example to see 4 sample briefs, or click Start from scratch. Then fill in Project info: platform, engine, who it is for, and game version.</li><li><strong>Add an asset.</strong> Pick a type. Go through the steps: goal, details, examples, links, done checks, files, and budget (optional).</li><li><strong>Link assets that go together.</strong> For example, link an animation to its model or rig. If the model changes, the animation brief gets a warning.</li><li><strong>Click Save brief.</strong> This saves your changes, adds them to the history, and updates the checks.</li><li><strong>Share the brief.</strong> Go to Share briefs. Pick a brief for a person, a brief for an AI helper, or the done checklist. Copy it, download it, or print it.</li><li><strong>Check the work.</strong> When files arrive, add them. Test each done check. Write down who checked it, the date, pass or fail, and what they saw.</li><li><strong>Click Save project file.</strong> Keep that file. Open it later to keep working, or open it in another Avalon tool.</li></ol></section><section class="card">${sectionHead('','What the labels mean')}<table class="doc-table"><thead><tr><th>Label</th><th>Meaning</th></tr></thead><tbody><tr><td>Not answered yet</td><td>Nobody filled this in yet. Blank does not mean zero or fail.</td></tr><tr><td>Tool check</td><td>The tool checks that boxes are filled, links work, and the budget math adds up. It does not judge your words or open your files.</td></tr><tr><td>Not checked yet</td><td>Nobody has recorded a full result for this done check.</td></tr><tr><td>Passed / Failed</td><td>A person checked it and wrote down their name, what they saw, and the date. It matches the current brief update and asset version. The tool cannot prove who checked it.</td></tr><tr><td>Out of date</td><td>The result is for an older brief update or an older asset version. Check it again.</td></tr><tr><td>Linked change to check</td><td>An asset this one needs was changed or deleted. Look at it before you go on. Marking it checked does not approve the finished asset.</td></tr><tr><td>Approved by owner</td><td>Just a status. Each done check still shows its own result.</td></tr><tr><td>Approved example</td><td>This example is the style to follow. It does not mean you have permission to use it. The tool does not check licenses.</td></tr><tr><td>Brief update #</td><td>Goes up by 1 each time you change what the asset needs. Small changes, like the owner or status, do not count.</td></tr></tbody></table></section><section class="card">${sectionHead('','Saving and opening projects')}<p>After each change, the tool tries to save in this browser. The top bar tells you if it worked. If you close the page before you click Save brief, your changes can often come back next time, in the same browser.</p>${notice('Your work saves in this browser, but it can get erased. Click Save project file to keep a copy on your computer. This page is the tool. The project file is your work. Keep both.','warning')}<p>Opening a project file replaces the project you have open. The tool shows you both first, so you can compare. Click Download a backup to save your open project first. If you cancel, or the file is broken, nothing changes.</p><p>You can have one project open at a time. To switch, click Open project file and pick the other file. Make a copy (in Project info) creates a new project with a new ID. It keeps all the links between assets. The tool never combines two projects.</p><p class="small muted">${sourceLink('MDN localStorage guidance','https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage')} · Checked 21 Oct 2026.</p></section><section class="card">${sectionHead('','Project file format (for advanced users)')}<p>You do not need this part to use the tool. The project file is JSON, a text format for data. Its format is <span class="mono">avalon.creator-project</span>, version 1. All Avalon tools share the same project info. This tool keeps its own data in <span class="mono">tools.asset_briefs</span>, module version 1.</p><pre class="mono">${esc(JSON.stringify({format:'avalon.creator-project',schemaVersion:1,project:{id:'GENERATED_ONCE_AS_A_UUID',name:'',platform:'',engine:'',genre:'',targetAudience:'',targetDevices:[],stage:'',gameVersion:'',designPillars:[],sessionLengthMinutes:null},tools:{asset_briefs:{moduleVersion:1,updatedAt:'ACTUAL_ISO_8601_TIMESTAMP',payload:{assets:[]}}}},null,2))}</pre><details class="disclosure"><summary>What each asset field holds (advanced)</summary><div><p><span class="mono">payload.assets[]</span> holds records with UUID identities, a type, metadata, production requirements, and review history.</p><table class="doc-table"><thead><tr><th>Fields</th><th>Stored data</th></tr></thead><tbody><tr><td class="mono">id, type, name, code, version, owner, dueDate, status</td><td>Asset identity; type is model, rig, animation, art2d, interface, sfx, or music. Status tracks production only. Dates use YYYY-MM-DD or empty text.</td></tr><tr><td class="mono">purpose, audience, direction, context, variations, completion, engine, platform</td><td>Creator-written requirements and optional shared-profile overrides.</td></tr><tr><td class="mono">specs</td><td>String-valued technical fields. A blank string is unanswered, including numeric-looking specification fields. Nonempty additional spec keys are retained and shown in reports.</td></tr><tr><td class="mono">relatedAssets[], dependencies[]</td><td>Related UUIDs; dependencies contain assetId, kind (rig/style/general), and note. Only dependencies propagate changes.</td></tr><tr><td class="mono">references[]</td><td>id, label, url, sourceRecord, attribution, license, notes, approved. Approval is for creative direction.</td></tr><tr><td class="mono">criteria[]</td><td>id, requirement, method, expected, review. Review contains status (unverified/pass/fail), reviewer, evidence, checkedAt, version, assetRevision.</td></tr><tr><td class="mono">revisions[]</td><td>id, requestedAt, by, note, status (open/resolved), resolution.</td></tr><tr><td class="mono">deliveries[], handoff</td><td>Delivery id, kind, name, url, version, notes. Handoff sourceFiles, finalExports, naming, implementation, recipient.</td></tr><tr><td class="mono">budget</td><td>currency, total (number or null), scope, assumptions, milestones. Each milestone has id, name, amount (number or null), dueDate, deliverable, status.</td></tr><tr><td class="mono">reviewFlags[], history[]</td><td>Flags store id, sourceId, reason, createdAt, status, reviewer, note, resolvedAt. History stores id, at, by, summary.</td></tr><tr><td class="mono">createdAt, updatedAt, revision</td><td>ISO timestamps and a positive integer production revision. Only requirement changes advance it.</td></tr></tbody></table><p>Safe unfamiliar properties and foreign modules are retained as inert JSON. This tool does not validate their specialized meaning. Unsupported root schemas or unsupported versions of this module are refused; no unsupported module is reset to blank.</p></div></details><details class="disclosure"><summary>File limits and safety (advanced)</summary><div><p>Imports are limited to 5 MiB of UTF-8 JSON, depth 30, 150,000 values, and 100,000 characters per string. There are up to 250 assets and 200 records per asset collection, including history. The app refuses a save beyond the history limit rather than silently removing history. Save a backup before starting a new asset record.</p><p>Money fields use nonnegative finite numbers or null, with a three-letter currency when supplied. The profile session length is a number or null. Every asset and nested record has a UUID. Unsafe object keys are rejected recursively.</p><p>Markdown and print are readable reports. The spreadsheet file (CSV) is a summary export with quoted fields and formula-prefix protection. CSV adds an apostrophe where needed for spreadsheet safety; original values stay unchanged in JSON. CSV is not an import format.</p><p>Only a full documented project snapshot can be imported. Individual asset import, CSV import, automatic foreign-record mapping, binary attachments, cloud sync, engine connections, checking what your words mean, and live usage tracking are not built in.</p><p>HTTP and HTTPS links can be opened; other location strings are kept as text. Imported content is never executed. No fonts, scripts, APIs, analytics, or images are fetched by this app.</p></div></details></section><section class="card">${sectionHead('','Version notes')}<p><strong>Version 1.0, 21 Oct 2026.</strong> First full version: 7 asset types, 4 example briefs, saving, change warnings for linked assets, check results, budgets, a preview before opening files, 3 ways to share, project files, spreadsheet export, and printing.</p><details class="disclosure"><summary>License and notices</summary><div><p>Copyright (c) 2026 Joshua Amado. Free and source available under the AmadOpenSource License 1.0. Use it for anything, including paid work; what you make with it is yours. The tool itself may not be sold or turned into a paid product. The linked pages belong to their owners. This file has no outside images, fonts, code, or asset files.</p><p>Roblox is a trademark of Roblox Corporation. This independent creator tool is not affiliated with or endorsed by Roblox. That means Roblox did not make or approve it.</p></div></details></section>${footer()}`;}
function outputAsset(){return list().find(a=>a.id===selectedOutput)||list()[0];}
function exportMarkdown(mode=outputMode){const a=outputAsset();if(!a)return;download(T.markdown(workspace,a,mode),C.filename(a.name||a.code||'Asset')+'_'+mode+'.md','text/markdown;charset=utf-8');toast('Your text file is downloading.');}
async function copyOutput(){const a=outputAsset();if(!a)return;const text=T.markdown(workspace,a,outputMode);try{await navigator.clipboard.writeText(text);toast('Copied! You can paste it now.');}catch(e){openDialog('Copy the text',`<p class="small muted">This browser would not let us copy for you. Select all the text below and copy it.</p><textarea id="copyFallback" rows="16" readonly aria-label="Text to copy">${esc(text)}</textarea>`,[{label:'Select all',run:()=>{$('#copyFallback').focus();$('#copyFallback').select();}},{label:'Close',run:closeDialog}]);}}
function printOutput(all=false){const assets=all?list():[outputAsset()].filter(Boolean);if(!assets.length)return;$('#printRoot').innerHTML=assets.map((a,i)=>`<div class="${i?'print-next':''}">${T.reportHTML(workspace,a,all?'human':outputMode)}</div>`).join('');try{window.print();}catch(e){toast('Printing does not work here. Try Download text file instead.',true);}}
function preset(){const isRoblox=(draft.platform||workspace.project.platform).toLowerCase().includes('roblox');let note='',format='';if(!isRoblox)note='Delivery tip: send the work files, the final files, names with version numbers, where linked files are, and a note from a test in the game engine. Ask the person getting the work about the exact engine rules. This is a general tip, not a checked platform rule.';else if(['model','rig'].includes(draft.type)){note='Roblox tip (checked 2026-10-21): plan a work file you can edit, plus an FBX export if you use the Roblox FBX steps. In Blender, turn off Add Leaf Bones. Turn on Bake Animation only when you export animation. After upload, check the size, pivot (center point), parts, rig, and skinning. Other file types and avatars have different details. Sources: https://create.roblox.com/docs/art/modeling/export-requirements ; https://create.roblox.com/docs/studio/importer';format='FBX final file, plus the editable work file and texture files if needed.';}else if(draft.type==='animation'){note='Roblox tip (checked 2026-10-21): write the exact rig name and version. If you export animation with a mesh, use one file for each animation track. On that rig, test the loop, the change into other animations, and where feet and hands touch. Sources: https://create.roblox.com/docs/art/modeling/specifications ; https://create.roblox.com/docs/animation/editor';format='One FBX file per animation track, plus the editable work file.';}else if(['sfx','music'].includes(draft.type))note='Roblox tip (checked 2026-10-21): export one track as MP3, OGG, WAV, or FLAC. Stay within the Roblox limits for length, file size, sample rate, and channels. Write down the file details. Listen to it in the real game scene. How loud it should be is your choice. Source: https://create.roblox.com/docs/audio/assets';else note='Roblox UI tip (checked 2026-10-21): pick fit, crop, stretch, or nine-slice on purpose. Write down the size on screen, the image size, how see-through edges should look, and each state (like pressed). For nine-slice panels, write the slice points and check corners and edges at every size. Sources: https://create.roblox.com/docs/ui/9-slice ; https://create.roblox.com/docs/studio/importer';openDialog('Preview helpful notes',`<p>This note will be added to “Notes for putting it in the game” in step 6. You can edit it later.</p><div class="notice">${esc(note)}</div>${format&&!draft.specs.format?`<p><strong>It will also fill the empty file type box with:</strong> ${esc(format)}</p>`:'<p class="small muted">Nothing you already typed will change.</p>'}<p class="small muted">It will not pick your triangle limit, texture size, rig, or sound levels. You decide those.</p>`,[{label:'Cancel',run:closeDialog},{label:'Add the notes',style:'primary',run:()=>{draft.handoff.implementation=[draft.handoff.implementation,note].filter(Boolean).join('\n\n');if(format&&!draft.specs.format)draft.specs.format=format;closeDialog();markDirty();render();toast('Notes added to step 6. Click Save brief to keep them.');}}]);}
function appendRecord(path,factory){const arr=read(draft,path);if(arr.length>=200){toast('This list is full (200 items max). Save a backup before you clean it up.',true);return;}arr.push(factory());markDirty();render();const el=$$('[data-bind^="'+path+'."]').at(-1);el?.scrollIntoView({block:'center',behavior:'smooth'});}
function addDependency(related=false){const used=related?draft.relatedAssets:draft.dependencies.map(d=>d.assetId);const candidates=list().filter(a=>a.id!==draft.id&&!used.includes(a.id));if(!candidates.length){toast('There are no more assets to link. Add another asset first.');return;}if(related)appendRecord('relatedAssets',()=>candidates[0].id);else appendRecord('dependencies',()=>({assetId:candidates[0].id,kind:draft.type==='animation'?'rig':'general',note:''}));}
function criteriaTemplate(){const common=[['The work files open and have all the needed parts.','Open the work files in the agreed app and look at the list of parts.','Every part named in the brief is there and can be edited. Write down anything missing.'],['Every final file and version asked for is here, with the right names.','Compare the files you got with the lists of final files and versions.','Every file and version is there. A right name alone does not prove the file is good.']];let specific;if(['model','rig'].includes(draft.type))specific=['The rig, size, and pivot match the brief.','Put it in the test level. Compare the skeleton, size, and center point with the brief.','Write down the version and sizes you tested. Report any wrong or missing rig before you approve it.'];else if(draft.type==='animation')specific=['The animation plays on the right rig, loops, and keeps its touch points.','Play the animation on the exact rig 3 times in a row, including how it starts and ends.','No missing parts, no unplanned sliding, no jump at the loop, and no touch points lost beyond what you agreed.'];else if(['sfx','music'].includes(draft.type))specific=['The sound has the right length, versions, and looping.','Listen to each version on the agreed speakers or headphones, and in the game scene. Play loops 3 times.','Write down any gaps, clicks, sounds that get covered up, or distortion. Compare to the sound mix notes.'];else specific=['Each image is easy to read and looks right at every size it is used.','Put every state on the agreed backgrounds at the smallest and largest sizes.','The checker looks at each image, checks see-through edges, and writes down any stretching or missing states.'];const rows=[...common,specific].filter(([r])=>!draft.criteria.some(c=>c.requirement===r));if(draft.criteria.length+rows.length>200){toast('There are too many checks to add the starter checks.',true);return;}rows.forEach(([requirement,method,expected])=>draft.criteria.push({...C.newCriterion(),requirement,method,expected}));markDirty();render();toast(rows.length?'Starter checks added. Change them to fit this asset.':'These starter checks are already here.');}
function recordReview(i){if(dirty&&!commit(false))return;const c=draft.criteria[i];if(!c.requirement.trim()||!c.method.trim()||!c.expected.trim()){toast('First fill in What must be true, How to check, and What a pass looks like.',true);return;}openDialog('Record a check result',`${notice('Only record a check that really happened, or a decision you can explain. The tool saves what you type. It cannot test the asset itself.')}<p><strong>${esc(c.requirement)}</strong></p><p class="small muted">Asset ${esc(draft.version||'no version set')} · Brief update #${draft.revision}</p><div class="field-grid section-space"><div class="field"><label for="reviewDecision">Result</label><select id="reviewDecision"><option value="pass">Pass (say what you saw)</option><option value="fail">Fail (say what you saw)</option><option value="unverified">Set back to not checked</option></select></div><div class="field"><label for="reviewDate">Date checked</label><input type="date" id="reviewDate" value="${today()}" max="${today()}"></div><div class="field full"><label for="reviewerName">Who checked it</label><input id="reviewerName" maxlength="200" value="" placeholder="Your name, or the name of the person who checked"></div><div class="field full"><label for="reviewEvidence">What you saw, or why</label><textarea id="reviewEvidence" maxlength="20000" rows="4" placeholder="Which file and version you tested, where you tested it, what you saw, and where any proof is saved (like a screenshot)."></textarea><span class="hint">Seeing the right file name is not enough. Look at, listen to, or test the asset.</span></div></div>`,[{label:'Cancel',run:closeDialog},{label:'Save result',style:'primary',run:()=>{const status=$('#reviewDecision').value,reviewer=$('#reviewerName').value.trim(),evidence=$('#reviewEvidence').value.trim(),d=$('#reviewDate').value;if(status!=='unverified'&&(!reviewer||!evidence||!d||d>today())){$('#dialogError').textContent='Add who checked it, what they saw, and a date that is not in the future.';return;}const review={status,reviewer,evidence,checkedAt:status==='unverified'?'':d===today()?C.now():d+'T12:00:00.000Z',version:status==='unverified'?'':draft.version,assetRevision:status==='unverified'?0:draft.revision};const prev=c.review;if(prev.status!=='unverified')draft.history.push({id:C.uuid(),at:C.now(),by:reviewer||'Local editor',summary:'Replaced earlier reviewer decision for criterion '+c.id+': '+prev.status+'; reviewer '+prev.reviewer+'; date '+prev.checkedAt+'; evidence '+prev.evidence});c.review=review;dirty=true;if(commit(false)){closeDialog();render();toast('Check result saved. Remember: the tool did not test the asset itself.');}}}]);}
function acknowledgeFlag(i){if(dirty&&!commit(false))return;const flag=draft.reviewFlags[i];openDialog('Check a linked change',`${notice(esc(flag.reason),'warning')}<p class="small muted">Write what you checked, and what you changed or kept on purpose. This only clears the warning. It does not pass any done checks.</p><div class="field-grid section-space"><div class="field full"><label for="flagReviewer">Checked by</label><input id="flagReviewer" maxlength="200"></div><div class="field full"><label for="flagNote">What you found</label><textarea id="flagNote" maxlength="20000" rows="4" placeholder="Example: updated the rig to v2. The animation still needs a test on the new rig."></textarea></div></div>`,[{label:'Cancel',run:closeDialog},{label:'Mark as checked',style:'primary',run:()=>{const who=$('#flagReviewer').value.trim(),note=$('#flagNote').value.trim();if(!who||!note){$('#dialogError').textContent='Add who checked it and what they found.';return;}Object.assign(flag,{status:'acknowledged',reviewer:who,note,resolvedAt:C.now()});dirty=true;if(commit(false)){closeDialog();render();toast('Marked as checked. Done checks keep their own results.');}}}]);}
function deleteAsset(){const a=draft;const dependents=list().filter(x=>x.dependencies.some(d=>d.assetId===a.id));openDialog('Delete this asset?',`<p><strong>${esc(title(a))}</strong> will be removed from this project.</p>${notice(dependents.length?`${dependents.length} linked asset(s) will keep the broken link and get a warning to check.`:'No other briefs are linked to this asset.','warning')}<p class="small muted">Want a way to undo it? Click Download backup first.</p>`,[{label:'Cancel',run:closeDialog},{label:'Download backup',run:()=>exportJSON(latestSnapshot())},{label:'Delete asset',style:'danger',run:()=>{try{const s=C.deleteAsset(workspace,a.id,'Local editor');workspace=s;draft=null;dirty=false;view='register';closeDialog();autosave();render();toast('Asset deleted. Any linked briefs now show a warning to check.');}catch(e){$('#dialogError').textContent=e.message;}}}]);}
function handleAction(action,b){switch(action){case 'new-project':createEmpty();break;case 'example':loadExample();break;case 'import':$('#importFile').click();break;case 'export':exportJSON();break;case 'duplicate-project':duplicateProject();break;case 'add-asset':typePicker();break;case 'edit':editAsset(b.dataset.id);break;case 'save':case 'save-profile':commit();break;case 'next-step':step=steps[(steps.findIndex(x=>x[0]===step)+1)%steps.length][0];render();$('#main').scrollIntoView({block:'start'});break;case 'clear-filters':Object.keys(filters).forEach(k=>filters[k]='');render();break;case 'asset-outputs':if(dirty&&!commit(false))break;selectedOutput=draft.id;draft=null;view='outputs';render();window.scrollTo(0,0);break;case 'delete-asset':deleteAsset();break;case 'add-reference':appendRecord('references',C.newReference);break;case 'add-criterion':appendRecord('criteria',C.newCriterion);break;case 'add-revision':appendRecord('revisions',()=>({...C.newRevision(),requestedAt:today()}));break;case 'add-delivery':appendRecord('deliveries',C.newDelivery);break;case 'add-milestone':appendRecord('budget.milestones',C.newMilestone);break;case 'add-dependency':addDependency();break;case 'add-related':addDependency(true);break;case 'remove-record':{const arr=read(draft,b.dataset.list);arr.splice(Number(b.dataset.index),1);markDirty();render();break;}case 'review-criterion':recordReview(Number(b.dataset.index));break;case 'ack-flag':acknowledgeFlag(Number(b.dataset.index));break;case 'criteria-template':criteriaTemplate();break;case 'preset':preset();break;case 'csv':if(dirty&&!commit(false))break;download(C.csv(workspace),C.filename(workspace.project.name||'Project')+'_Asset_Register.csv','text/csv;charset=utf-8');toast('Your spreadsheet (CSV) is downloading.');break;case 'markdown':exportMarkdown();break;case 'three-outputs':{const a=outputAsset();if(a)download(['human','ai','checklist'].map(m=>T.markdown(workspace,a,m)).join('\n\n---\n\n'),C.filename(a.name||'Asset')+'_All_Handoff_Outputs.md','text/markdown;charset=utf-8');toast('All three briefs are downloading as one text file.');break;}case 'copy-output':copyOutput();break;case 'print':printOutput();break;case 'print-all':printOutput(true);break;case 'recovery':download(rawRecovery||'No recovery text', 'Avalon_Browser_Recovery.txt');break;case 'clear-recovery':openDialog('Delete the saved work?',notice('This deletes the earlier changes that could not load. Download them first if you still need them. Your open project stays.','warning'),[{label:'Cancel',run:closeDialog},{label:'Delete saved work',style:'danger',run:()=>{try{localStorage.removeItem(RECOVERY);rawRecovery=null;closeDialog();autosave();render();}catch(e){$('#dialogError').textContent='The browser would not let us delete it.';}}}]);break;}}
document.addEventListener('click',e=>{const nb=e.target.closest('[data-new-type]');if(nb){const t=nb.dataset.newType;closeDialog();addAsset(t);return;}const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}const st=e.target.closest('[data-step]');if(st){step=st.dataset.step;render();$('#main').scrollIntoView({block:'start'});return;}const a=e.target.closest('[data-action]');if(a&&!a.disabled)try{handleAction(a.dataset.action,a);}catch(err){alertDialog('Something went wrong',err.message);}});
function bindInput(e){const el=e.target;if(el.dataset.filter){filters[el.dataset.filter]=el.value;$('#registerRows').innerHTML=registerRows();return;}if(!el.dataset.bind)return;let value=el.type==='checkbox'?el.checked:el.value;if(el.dataset.number){value=value===''?null:Number(value);if(value!==null&&!Number.isFinite(value)){toast('Type a number, or leave this box empty.',true);return;}}if(el.dataset.lines)value=value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const obj=el.dataset.profile?profileDraft:draft;if(!obj)return;if(el.dataset.bind==='budget.currency'&&typeof value==='string')value=value.toUpperCase();put(obj,el.dataset.bind,value);markDirty();if(view==='editor'&&$('#summaryPanel'))$('#summaryPanel').innerHTML=summaryPanel();if(el.dataset.bind.startsWith('budget.')&&$('#budgetFeedback'))$('#budgetFeedback').outerHTML=budgetFeedback();if(el.dataset.bind==='name'&&draft&&$('#assetHeading'))$('#assetHeading').textContent=title(draft);}
document.addEventListener('input',bindInput);
document.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'||el.type==='checkbox')bindInput(e);if(el.dataset.bind){if(el.dataset.bind==='specs.rigRequired'){render();$('#f-specs-rigRequired')?.focus();return;}if(step==='budget'&&view==='editor'&&$('#budgetFeedback')){$('#budgetFeedback').outerHTML=budgetFeedback();if(el.dataset.bind==='budget.currency')el.value=draft.budget.currency;}}if(el.id==='outputAsset'){selectedOutput=el.value;$('#outputReport').innerHTML=T.reportHTML(workspace,outputAsset(),outputMode);}if(el.id==='outputMode'){outputMode=el.value;$('#outputReport').innerHTML=T.reportHTML(workspace,outputAsset(),outputMode);}});
window.addEventListener('beforeunload',e=>{if(dirty||storageFailed){e.preventDefault();e.returnValue='';}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!$('#dialog').open){e.preventDefault();if(workspace)commit();}});
function restore(){
 let raw=null;
 try{
  rawRecovery=localStorage.getItem(RECOVERY);if(rawRecovery&&rawRecovery.length>12*1024*1024)rawRecovery=null;raw=localStorage.getItem(STORE);if(!raw)return;
  if(raw.length>12*1024*1024)throw new Error('Browser recovery exceeds supported size');
  const saved=JSON.parse(raw,(k,v)=>{if(['__proto__','prototype','constructor'].includes(k))throw new Error('Unsafe recovery key');return v;});
  if(saved.format!=='avalon.asset-briefs.autosave'||saved.version!==1)throw new Error('Unsupported browser recovery');
  const s=C.parseSnapshot(JSON.stringify(saved.snapshot));if(!s.ok)throw new Error(s.errors[0]);
  workspace=s.value;
  let draftProblem=false;
  if(saved.draft){
   const temp=clone(workspace);if(!temp.tools.asset_briefs)temp.tools.asset_briefs={moduleVersion:1,updatedAt:C.now(),payload:{assets:[]}};
   const arr=temp.tools.asset_briefs.payload.assets;const i=arr.findIndex(a=>a.id===saved.draft.id);
   if(i<0)arr.push(saved.draft);else arr[i]=saved.draft;
   if(C.validateSnapshot(temp).ok)draft=saved.draft;else draftProblem=true;
  }
  if(saved.profileDraft){const temp=clone(workspace);temp.project=saved.profileDraft;if(C.validateSnapshot(temp).ok)profileDraft=saved.profileDraft;else draftProblem=true;}
  view=['start','register','profile','editor','outputs','sources','help'].includes(saved.view)?saved.view:'register';
  step=steps.some(x=>x[0]===saved.step)?saved.step:'purpose';selectedOutput=typeof saved.selectedOutput==='string'?saved.selectedOutput:'';
  lastExport=typeof saved.lastExport==='string'?saved.lastExport:'';
  dirty=!!(draft&&JSON.stringify(draft)!==JSON.stringify(list().find(a=>a.id===draft.id)))||!!(profileDraft&&JSON.stringify(profileDraft)!==JSON.stringify(workspace.project));
  if(draft)view='editor';else if(profileDraft)view='profile';else if(view==='editor'||view==='profile')view='register';
  if(draftProblem){if(!rawRecovery)rawRecovery=raw;try{preserveRecovery();}catch(_){}storageFailed=true;storageMessage='Project loaded · Some changes did not load. Download them below';}
  else storageMessage=dirty?'Unsaved changes brought back · Click '+(view==='profile'?'Save project info':'Save brief'):'Loaded from this browser · Click Save project file to keep a copy';
 }catch(e){storageFailed=true;storageMessage='Could not load from this browser · Click Open project file';if(!rawRecovery)rawRecovery=raw;try{preserveRecovery();}catch(_){}workspace=null;draft=null;profileDraft=null;dirty=false;view='start';}
}
// Public read-only inspection surface supports transparent local verification. Returned state is a copy.
globalThis.AvalonBriefApp={getSnapshot:()=>workspace?clone(workspace):null,getDraft:()=>draft?clone(draft):null,getView:()=>({view,step,dirty,storageFailed}),version:'1.0.0'};
restore();render();
})();
