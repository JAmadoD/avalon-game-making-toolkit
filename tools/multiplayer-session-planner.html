  const md = v => value(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\\`*_{}\[\]#|!]/g,'\\$&').replace(/\r\n?|\n/g,' / ');
  const list = (items,empty='None entered.') => Array.isArray(items) && items.length ? '<ul>'+items.map(x=>'<li>'+textHTML(x)+'</li>').join('')+'</ul>' : '<p class="report-muted">'+escape(empty)+'</p>';
  const paragraph = (label,v) => '<p><strong>'+escape(label)+':</strong> '+textHTML(v)+'</p>';
  function enumLabel(key,v) { const row=(data().ENUMS[key]||[]).find(x=>x[0]===v);return row ? row[1] : value(v); }
  function ruleValue(key,v) { if(data().RULE_ENUM.includes(key))return enumLabel(key,v);if(v===null||v===undefined)return 'Not entered';if(key.endsWith('Seconds'))return v+' seconds';if(key==='participationGoalPercent')return v+'%';return value(v); }
  function get(snapshot) { const m=snapshot.tools && snapshot.tools[data().KEY];return {project:snapshot.project||{},module:m,payload:m&&m.payload}; }
  function stateLabel(p,id) { return id==='*'?'Any stage':(p.states.find(s=>s.id===id)||{}).label||id; }
  function seconds(v) { return v===null||v===undefined ? 'Unknown' : Number(v.toFixed ? v.toFixed(2):v)+' seconds'; }
  function percent(v) { return v===null||v===undefined ? 'Unknown' : Number(v.toFixed(1))+'%'; }
  function safeStatus(v) { return pretty(v||'unknown'); }
  function pairsHTML(rows) {return '<dl class="report-pairs">'+rows.map(([a,b])=>'<div><dt>'+escape(a)+'</dt><dd>'+textHTML(b)+'</dd></div>').join('')+'</dl>';}
  function openDecisions(p,scenarios,findings) {
    const rows=[], seenActions=new Set(), grouped=new Map();
    const normalize=x=>value(x).trim().replace(/\s+/g,' ').toLowerCase();
    const scenarioKey=x=>{const match=(scenarios||[]).find(s=>normalize(s.id)===normalize(x)||normalize(s.title)===normalize(x));return match?String(match.id):value(x);};
    (findings||[]).forEach(f=>{
      const id=scenarioKey(f.scenario), action=value(f.action);
      rows.push({title:value(f.title),id,reason:value(f.reason),action,severity:value(f.severity)});
      seenActions.add(normalize(id)+'\n'+normalize(action));
    });
    (scenarios||[]).forEach(s=>(s.decisions||[]).forEach(d=>{
      const key=normalize(s.id)+'\n'+normalize(d);
      if(!seenActions.has(key)){rows.push({title:s.title+': decision to make',id:String(s.id),reason:value(s.reason),action:value(d),severity:'Decision'});seenActions.add(key);}
    }));
    rows.forEach(r=>{
      const key=normalize(r.id)+'\n'+normalize(r.reason);
      if(!grouped.has(key)){
        const match=(scenarios||[]).find(s=>String(s.id)===r.id);
        grouped.set(key,{scenario:match?match.title:r.id,reason:r.reason,titles:[],actions:[],severity:r.severity});
      }
      const g=grouped.get(key);
      if(!g.titles.some(t=>normalize(t)===normalize(r.title)))g.titles.push(r.title);
      if(!g.actions.some(a=>normalize(a)===normalize(r.action)))g.actions.push(r.action);
      if(r.severity==='blocked')g.severity=r.severity;
    });
    return Array.from(grouped.values());
  }
  function goalNotes(p,t) {
    const r=p.rules, notes=[];
    if(r.waitGoalSeconds===null) notes.push('No wait goal is set. Enter your own goal to compare.');
    else if(t.longestWaitSeconds===null) notes.push('We cannot check your '+r.waitGoalSeconds+' second wait goal, because the longest wait is unknown.');
    else notes.push('Longest wait without playing: '+seconds(t.longestWaitSeconds)+'. Your goal: '+r.waitGoalSeconds+' seconds. '+(t.longestWaitSeconds<=r.waitGoalSeconds?'This timeline meets the goal.':'This timeline is over the goal.'));
    if(r.participationGoalPercent===null) notes.push('No play time goal is set.');
    else if(t.participationPercent===null) notes.push('We cannot check your '+r.participationGoalPercent+'% play time goal, because the timeline has missing times or no time at all.');
    else notes.push('Play time: '+percent(t.participationPercent)+'. Your goal: '+r.participationGoalPercent+'%. '+(t.participationPercent>=r.participationGoalPercent?'This timeline meets the goal.':'This timeline is below the goal.'));
    notes.push('This only checks the timeline you entered. Guessed times are still guesses. They do not tell you how real players will act.');
    return notes;
  }

 if(ruleTab==='limits')body='<div class="card"><h2>How many people can play?</h2><p class="muted small">Server size counts everyone in the server. Match maximum only counts the players in the match.</p><div class="form-grid">'+rnum('Fewest players to start (players)','minPlayers','How many players must be in this server before a match can start.')+rnum('Most players in a match (players)','maxPlayers','Knocked-out players still count, because they keep their spot.')+rnum('Server size (players)','serverCapacity','The most people in one server, counting watchers and waiting players. This is your choice, not a Roblox limit. Use 1 to 500.')+rselect('Teams','teamPolicy','Team rules apply on top of the player minimum.')+'</div></div><div class="card section-spacer"><h2>Team size rules</h2><p class="muted small">Skip these if you picked No teams. Leave a box blank if you are not sure.</p><div class="form-grid">'+rnum('Number of teams','teamCount','How many teams each match has.')+rnum('Fewest players per team (players)','minTeamSize','A lower match minimum does not change this number.')+rnum('Most players per team (players)','teamSize','For one team, not the whole match.')+rnum('How many players apart teams can be','maxTeamDifference','Only for uneven teams. Example: 1 means teams of 3 and 2 are OK. Same-size teams are always 0.')+'</div></div>';
 if(ruleTab==='entry')body='<section class="card"><h2>When does a match start?</h2><div class="form-grid">'+rselect('Start rule','startMode','With Ready, only players who click Ready get picked. With the host rule, the host must also click Start.')+rselect('When there are too few players','fallback','Solo and practice give players something to do. Only Start with fewer players changes the minimum.')+rnum('Lower minimum (players)','fallbackMin','Only used with Start with fewer players. All other rules still apply.')+rtext('What players do in the lobby','lobbyActivity','What can players do while they wait? How do they leave? What messages do they see?')+'</div></section><section class="card section-spacer"><h2>Friend groups (parties)</h2><p class="muted small">A party is a group of friends who join together.</p><div class="form-grid">'+rselect('If a group does not fit','partyPolicy','A group of 3 cannot squeeze into 2 open spots. Sending them to another server is something you must build.')+rselect('Friends and teams','partyTeamPolicy','To keep friends together, one team must have room for all of them.')+rtext('Notes about friend groups','partyNotes','Where does each friend wait? How do they say OK to splitting up? How do they get back together? What if sending them to another server fails?')+'</div></section>';
 if(ruleTab==='lifecycle')body='<section class="card"><h2>Can players join a round that already started?</h2><div class="form-grid">'+rselect('Late join rule','lateJoin','A late joiner is a player who arrives after the round started. Getting into the server and getting into the match are two different things.')+rnum('Latest time to jump in (seconds after the round starts)','lateJoinCutoffSeconds','Used with Jump in now. Blank means not sure. To allow joining the whole round, use the round length.')+rselect('If someone leaves mid-round','departure','Keeping a round going with fewer players is not the same as starting a new one.')+rselect('If a player is knocked out','elimination','Getting knocked out does not kick them from the server or free up their spot.')+'</div></section><section class="card section-spacer"><h2>Losing connection and coming back</h2><div class="form-grid">'+rselect('Coming back rule','reconnect','If you pick a saved spot rule, you must build and test it in your game.')+rnum('How long to save their spot (seconds)','reconnectGraceSeconds','For the saved spot rules. When time runs out, they join like a late player. A saved spot is not a player who is playing.')+rtext('Fairness, respawn and reward notes','fairnessNotes','When do players respawn? How long can a pause last? What happens to score and saved spots? What do players see?')+'</div></section>';
 if(ruleTab==='timing')body='<section class="card"><h2>How long each part of a round lasts</h2><p class="muted small">Leave blank if you are not sure. Type 0 if a part does not exist. These times do not include waiting for new players to show up.</p><div class="form-grid">'+rnum('Round length (seconds)','roundSeconds')+rnum('Ready countdown (seconds)','countdownSeconds')+rnum('Results screen (seconds)','resultsSeconds')+rnum('Reset time between rounds (seconds)','resetSeconds')+'</div></section><section class="card section-spacer"><h2>Set your own goals</h2><p class="muted small">These are your own goals. The tool compares them with the Player timeline.</p><div class="form-grid">'+rnum('Longest wait you are OK with (seconds)','waitGoalSeconds','Compared with the longest time a player goes without playing the match. Practice does not count as playing.')+rnum('Play time goal (% of time spent playing)','participationGoalPercent','How much of the whole timeline the player spends in the match. Waiting and being offline count as not playing.')+'</div></section>';
 const issues=D.issues(p);return title('03 / Game rules','Set your game rules','The tool uses these numbers and choices to run the what if tests. Your written notes are just for you. The tool does not read them.')+'<div class="section-tabs" aria-label="Rule parts">'+tabChoices.map(a=>'<button data-action="rule-tab" data-tab="'+a[0]+'" class="'+(ruleTab===a[0]?'active':'')+'"'+(ruleTab===a[0]?' aria-pressed="true"':' aria-pressed="false"')+'>'+a[1]+'</button>').join('')+'</div>'+body+(issues.length?callout('Some numbers do not work together',issues.map(x=>x.title+': '+x.detail).join(' '),'red'):'')+'<div class="bottom-next"><span>The what if tests update when you change rules. Your timeline does not change on its own.</span>'+button('Next: game flow','navigate','data-view="flow"','primary')+'</div>';
}
function flowView(){
 const p=payload();return title('04 / Game flow','A place for every player','Your game moves through stages, like Lobby, Countdown and Round. A step is when it moves from one stage to the next. Write what each player does at every step.',button('Add a step','add-transition','','primary'))+callout('Rules do the math. Notes explain.','Start, room and team checks come from Game rules. Here you write the things the tool cannot check, like goals, host actions and what happens when things break.','neutral')+'<div class="state-grid">'+p.states.map((s,i)=>'<section class="state-card"><div class="state-index">STAGE '+String(i+1).padStart(2,'0')+'</div><h3>'+esc(s.label||'Unnamed stage')+'</h3><p>'+esc(s.actions||'Nothing written yet. Click Edit stage to add what players do.')+'</p>'+button('Edit stage','edit-state','data-index="'+i+'"','small ghost')+'</section>').join('')+'</div><div class="section-row"><h2>Steps between stages</h2><div class="actions">'+button('Add a stage','add-state','','small')+button('Download steps (spreadsheet)','export-transitions','title="Downloads a .csv file you can open in Excel or Google Sheets"','small')+'</div></div>'+p.transitions.map((t,i)=>'<details class="flow-edit" id="transition-'+esc(t.id)+'"><summary><span class="flow-path"><span>'+esc(stageName(t.from))+'</span> → <span>'+esc(stageName(t.to))+'</span></span></summary><div class="details-body"><div class="form-grid">'+field('From stage',pathPrefix+'transitions.'+i+'.from','select','',{options:[['*','Any stage with players'],...p.states.map(s=>[s.id,s.label])]})+field('To stage',pathPrefix+'transitions.'+i+'.to','select','',{options:p.states.map(s=>[s.id,s.label])})+field('When does this happen?',pathPrefix+'transitions.'+i+'.condition','textarea','Say it in your own words. The number rules are still checked on their own.',{full:true})+field('Match players (including knocked out)',pathPrefix+'transitions.'+i+'.participants','textarea')+field('Watchers',pathPrefix+'transitions.'+i+'.spectators','textarea','People watching who are not in the match.')+field('Players waiting in line',pathPrefix+'transitions.'+i+'.queued','textarea')+field('Friend groups',pathPrefix+'transitions.'+i+'.parties','textarea')+field('Players who disconnected, and saved spots',pathPrefix+'transitions.'+i+'.disconnected','textarea')+field('People on other servers',pathPrefix+'transitions.'+i+'.otherServers','textarea')+'</div><div class="actions section-spacer">'+button('Move up','move-transition','data-index="'+i+'" data-dir="-1"'+(i===0?' disabled':''),'small')+button('Move down','move-transition','data-index="'+i+'" data-dir="1"'+(i===p.transitions.length-1?' disabled':''),'small')+button('Delete step','delete-record','data-list="transitions" data-index="'+i+'"','small danger')+'</div></div></details>').join('')+(p.transitions.length?'':empty('No steps yet','Click Add a step. Start with the first player joining, then go through a full round.',button('Add a step','add-transition')))+'<div class="bottom-next"><span>You can rename a stage. Its steps stay connected.</span>'+button('Next: what if tests','navigate','data-view="scenarios"','primary')+'</div>';
}
function scenarioCard(s,compact=false){const tone=s.status==='blocked'?'red':s.status==='unknown'||s.status==='conditional'?'amber':'gray';return '<article class="scenario-card '+esc(s.status)+'" data-scenario="'+esc(s.id)+'">'+badge(s.status==='ready'?'Works':s.status==='blocked'?'Players are stuck':s.status==='unknown'?'Needs more info':s.status==='conditional'?'Works, with a catch':'Good to know',tone)+'<h3>'+esc(s.title)+'</h3><div class="scenario-description">'+esc(s.inputs)+'</div><div class="note-label">How this test works</div><p class="basis-copy">'+esc(s.basis)+'</p><p class="reason">'+esc(s.reason)+'</p>'+(s.actions.length?'<h4 class="section-spacer">What players can do</h4>'+list(s.actions):'')+(compact?'':'<div class="cohorts">'+Object.entries({participants:'In the match',spectators:'Watching',queued:'Waiting',party:'Friend group',disconnected:'Disconnected',elsewhere:'Other servers'}).map(([k,label])=>'<div class="cohort"><strong>'+label+'</strong><span>'+esc(s.cohorts[k]||'No change in this test.')+'</span></div>').join('')+'</div>')+(s.waitSeconds!==null?'<div class="assumption"><strong>About '+sec(s.waitSeconds)+' of wait from your round times.</strong> This uses your round times only. Waiting for players, your place in line, and loading can add more.</div>':'')+(s.decisions.length?'<h4 class="section-spacer">Still to decide</h4>'+list(s.decisions):'')+'<div class="scenario-actions">'+button('Add to my to-do list','decision-from-scenario','data-scenario="'+esc(s.id)+'"','small')+(!compact?button('Make a player timeline','timeline-from-scenario','data-scenario="'+esc(s.id)+'"','small'):'')+'</div></article>';}
function scenarioResults(){const rows=scenarios().filter(s=>(scenarioFilter==='all'||s.status===scenarioFilter)&&(s.title+' '+s.inputs+' '+s.reason+' '+s.actions.join(' ')+' '+s.decisions.join(' ')).toLowerCase().includes(scenarioQuery.toLowerCase()));return rows.length?'<div class="scenario-grid">'+rows.map(s=>scenarioCard(s)).join('')+'</div>':empty('No tests match','Try a different word, or pick All results.');}
function sandboxFields(){const b=pathPrefix+'sandbox.';return '<div class="form-grid three">'+field('What is happening now?',b+'phase','select','In the waiting lobby, only players waiting in line can start a match.',{enum:'phase'})+field('Match players (players)',b+'participants','number','Players in the match, including knocked-out ones. Not watchers or waiting players.',{integer:true,max:500})+field('Knocked out (players)',b+'eliminated','number','How many match players are knocked out. They are already counted above.',{integer:true,max:500})+field('Watchers (players)',b+'spectators','number','People in the server who are only watching.',{integer:true,max:500})+field('Waiting in line (players)',b+'queued','number','Players in this server waiting to play.',{integer:true,max:500})+field('Ready players in line (players)',b+'readyPlayers','number','Used when the start rule needs everyone to click Ready.',{integer:true,max:500})+field('Saved spots (spots)',b+'reservedSlots','number','Spots held for players who disconnected. They take up room, but nobody is playing in them.',{integer:true,max:500})+field('Players on other servers (players)',b+'otherServers','number','Just for reference. They are never counted in this server.',{integer:true,max:1e9})+field('Friend group trying to join (players)',b+'partySize','number','A group arriving from outside. They are not in the server yet.',{integer:true,max:500})+field('Players on each team',b+'teamSizes','teams','Count knocked-out players too. The numbers must add up to Match players. Leave empty if there are no teams.')+field('Time since the round started (seconds)',b+'elapsedSeconds','number','How long the round has been going.')+field('Team losing players (team number)',b+'departingTeam','number','For the leave and disconnect tests. The first team is 1.',{integer:true,min:1,max:32})+field('Players who leave mid-round (players)',b+'departures','number','Leaving removes them from the match. Getting knocked out does not.',{integer:true,max:500})+field('OK to split the group?',b+'splitConsent','checkbox','Pretend the group answered. This is just for the test.',{checkLabel:'Every friend in the group said splitting up is OK'})+'</div>';}
function scenariosView(){const iss=D.issues(payload());return title('05 / What if tests','What if things do not go as planned?','Here are 10 tricky moments, plus your own test. Each card says how it works. Some use the test numbers below.',button('Download tests (spreadsheet)','export-scenarios','title="Downloads a .csv file you can open in Excel or Google Sheets"'))+'<details id="sandbox"><summary>Change the test numbers</summary><div class="details-body">'+callout('Count every person only once.','People in the server = match players + watchers + players waiting in line. Knocked-out players are already match players. Saved spots belong to players who are offline. A friend group arriving is not inside yet.','neutral')+sandboxFields()+'</div></details>'+(iss.length?callout('Some numbers need fixing',iss.map(x=>x.title+': '+x.detail).join(' '),'red'):'')+'<div class="filterbar"><div class="field"><label for="scenarioSearch">Search the tests</label><input type="search" id="scenarioSearch" placeholder="Try: group, leave, wait…" value="'+esc(scenarioQuery)+'"></div><div class="field small-filter"><label for="scenarioFilter">Result</label><select id="scenarioFilter">'+[['all','All results'],['blocked','Players are stuck'],['unknown','Needs more info'],['conditional','Works, with a catch'],['ready','Works'],['info','Good to know']].map(a=>'<option value="'+a[0]+'"'+(scenarioFilter===a[0]?' selected':'')+'>'+a[1]+'</option>').join('')+'</select></div></div><div id="scenarioResults">'+scenarioResults()+'</div>'+callout('These tests do not guess the future.','Lots of players in your game does not tell you how fast people join one server. This tool does not guess when players arrive or if they come back. If we do not know something, it stays unknown.','neutral');}
function timelineView(){const p=payload(),t=M.timeline(p.timeline),target=p.rules.participationGoalPercent,goal=p.rules.waitGoalSeconds;const known=p.timeline.reduce((a,r)=>a+(r.durationSeconds??0),0);return title('06 / Player timeline','See how long players wait','Pick one player. List what they do, in order, and how long each step takes. Mark each time as a guess, something you saw in a playtest, or not sure. Then see how much of the time they really get to play.',button('Add a step','add-timeline','','primary'))+'<section class="card">'+field('Whose timeline is this?',pathPrefix+'timelinePerson','text','Describe the player and when they arrive. Example: one player who joins 45 seconds into a round.',{max:1000})+(p.timeline.length?'<div class="timeline-visual" role="img" aria-label="Player timeline in order. Exact times and roles are listed below.">'+p.timeline.map((r,i)=>'<div class="timeline-piece '+esc(r.role)+(r.durationSeconds===null?' unknown':'')+'" style="flex:'+Math.max(1,r.durationSeconds===null?Math.max(known*.08,10):r.durationSeconds)+'"><span>'+String(i+1).padStart(2,'0')+'</span><span class="time">'+esc(sec(r.durationSeconds))+'</span></div>').join('')+'</div><div class="legend"><span>Playing</span><span class="practice">Practice</span><span class="spectate">Watching</span><span class="queue">Waiting</span><span class="offline">Offline</span></div><p class="small muted section-spacer">Striped blocks have no time yet, so their size is made up. Block sizes are only a picture. The exact times are in the steps below.</p>':'')+'</section><div class="grid four section-spacer"><div class="card metric"><div class="label">Total time</div><div class="value">'+esc(sec(t.totalSeconds))+'</div><div class="explain">Steps with a time add up to '+esc(sec(t.knownSeconds))+'. Steps with no time: '+esc(t.unknownSegments)+'.</div></div><div class="card metric"><div class="label">Playing the match</div><div class="value">'+esc(sec(t.playSeconds))+'</div><div class="explain">Practice: '+esc(sec(t.practiceSeconds))+'. Watching does not count as playing.</div></div><div class="card metric"><div class="label">Play time %</div><div class="value">'+(t.participationPercent===null?'Unknown':Math.round(t.participationPercent*10)/10+'%')+'</div><div class="explain">Time playing out of all the time. Your goal: '+(target===null?'not set':target+'%')+'.</div></div><div class="card metric"><div class="label">Longest wait</div><div class="value">'+esc(sec(t.longestWaitSeconds))+'</div><div class="explain">Wait before first playing: '+esc(sec(t.timeToFirstPlaySeconds))+'. Your goal: '+esc(sec(goal))+'.</div></div></div>'+callout('These numbers come from this timeline only.',t.reason||'Missing times make the totals unknown. Guesses stay guesses.','neutral')+(target!==null&&t.participationPercent!==null&&t.participationPercent<target?callout('Play time is below your goal.','The player is in the match '+(Math.round(t.participationPercent*10)/10)+'% of the time. Your goal is '+target+'%. Try making a waiting part shorter, or change the join rule. Then playtest.','amber'):'')+(goal!==null&&t.longestWaitSeconds!==null&&t.longestWaitSeconds>goal?callout('The longest wait is over your goal.','The longest time without playing the match is '+sec(t.longestWaitSeconds)+'. Your goal is '+sec(goal)+'. Practice and watching do not count as playing.','amber'):'')+'<div class="section-row"><h2>Steps, in order</h2><div class="actions">'+button('Fill in a round for me','timeline-template','title="Replaces your timeline with a standard round. You can review it first."','small')+'</div></div>'+p.timeline.map((r,i)=>'<section class="card timeline-entry"><div class="entry-head"><h3>'+String(i+1).padStart(2,'0')+' · '+esc(r.label||'Unnamed step')+'</h3><div class="actions">'+button('Up','move-timeline','data-index="'+i+'" data-dir="-1"'+(i===0?' disabled':''),'small')+button('Down','move-timeline','data-index="'+i+'" data-dir="1"'+(i===p.timeline.length-1?' disabled':''),'small')+button('Delete','delete-record','data-list="timeline" data-index="'+i+'"','small danger')+'</div></div><div class="form-grid three">'+field('Step name',pathPrefix+'timeline.'+i+'.label','text','',{max:200})+field('Part of the game',pathPrefix+'timeline.'+i+'.phase','select','',{enum:'timelinePhase'})+field('What the player is doing',pathPrefix+'timeline.'+i+'.role','select','Playing the match is not the same as practice or watching.',{enum:'role'})+field('How long (seconds)',pathPrefix+'timeline.'+i+'.durationSeconds','number','If you clear this, it changes to Not sure yet.')+field('Where the time came from',pathPrefix+'timeline.'+i+'.basis','select','New times start as My best guess. Only pick I saw it in a playtest after you really tested it.',{enum:'basis'})+field('Notes',pathPrefix+'timeline.'+i+'.note','textarea','For playtest times, write the game version, the date, and what you saw.')+'</div></section>').join('')+(p.timeline.length?'':empty('Nothing here yet','Click Add a step, or Fill in a round for me. You can also make one from a what if test. Leave waiting-for-players time blank if you do not know it.',button('Add the first step','add-timeline','','primary')))+'<div class="bottom-next"><span>Changing round times in Game rules does not change this timeline.</span>'+button('Next: to-do & playtests','navigate','data-view="review"','primary')+'</div>';}
function findingsHtml(f){return f.map((x,i)=>'<article class="insight">'+badge(x.severity==='blocked'?'Problem':x.severity==='info'?'Check':'To decide',x.severity==='blocked'?'red':x.severity==='info'?'gray':'amber')+'<div><h4>'+esc(x.title)+'</h4><p>'+esc(x.reason)+'</p><p style="margin-top:6px">'+esc(x.action||'')+'</p>'+button('Add to my to-do list','finding-decision','data-finding="'+i+'"','small ghost')+'</div></article>').join('');}
function reviewView(){const p=payload(),f=findings();let content='';const query=reviewQuery.toLowerCase();
 if(reviewTab==='decisions')content='<div class="section-row"><h2>Tips from the tool</h2><span class="small muted">'+f.length+' tips based on your rules</span></div>'+(f.length?findingsHtml(f):empty('No tips right now','Write down your own open questions, and run real playtests.'))+'<div class="section-row"><h2>My to-do list</h2>'+button('Add a to-do','add-decision','','small')+'</div><div class="record-list">'+p.decisions.filter(r=>(r.title+' '+r.scenario+' '+r.owner+' '+r.notes).toLowerCase().includes(query)).map(r=>{const i=p.decisions.indexOf(r);return '<article class="card"><div class="record-head"><div>'+badge(D.ENUMS.decisionStatus.find(a=>a[0]===r.status)[1],r.status==='open'?'amber':'gray')+'<h3 style="margin-top:10px">'+esc(r.title||'Untitled to-do')+'</h3><div class="small muted">'+esc(r.scenario||'General')+' · '+esc(r.owner||'Nobody picked yet')+'</div></div><div class="actions">'+button('Edit','edit-decision','data-index="'+i+'"','small')+button('Delete','delete-record','data-list="decisions" data-index="'+i+'"','small danger')+'</div></div><div class="record-body">'+esc(r.notes||'No notes yet.')+'</div></article>';}).join('')+'</div>'+(p.decisions.length?'':empty('Nothing here yet','Click Add a to-do to write down something you need to decide. If you mark it tested, add notes on what you saw.',button('Add the first to-do','add-decision')));
 if(reviewTab==='dependencies')content=callout('Picking a feature does not build it.','Bots, sending groups to other servers, saved spots and checkpoint joining are things you must build in your game. You set the status below. This tool cannot check your game.','neutral')+'<div class="record-list">'+p.dependencies.filter(r=>(r.name+' '+r.notes).toLowerCase().includes(query)).map(r=>{const i=p.dependencies.indexOf(r);return '<article class="card"><div class="record-head"><div>'+badge(D.ENUMS.dependencyStatus.find(a=>a[0]===r.status)[1],r.status==='proposed'?'amber':'gray')+'<h3 style="margin-top:10px">'+esc(r.name||'Unnamed feature')+'</h3></div><div class="actions">'+button('Edit','edit-dependency','data-index="'+i+'"','small')+button('Delete','delete-record','data-list="dependencies" data-index="'+i+'"','small danger')+'</div></div><p class="record-body">'+esc(r.notes||'No notes yet.')+'</p></article>';}).join('')+'</div>'+(p.dependencies.length?'':empty('Nothing here yet','Click Add a feature to list things your game needs built for these rules to work.',button('Add a feature','add-dependency')));
 if(reviewTab==='tests')content=callout('Write down what really happened.','A playtest is when real people try your game. For each pass or fail, write the game version, the date, who tested, and what you saw. The examples have test ideas, but none have been run yet.','neutral')+'<div class="record-list">'+p.checklist.filter(r=>(r.title+' '+r.scenario+' '+r.procedure+' '+r.expected+' '+r.evidence).toLowerCase().includes(query)).map(r=>{const i=p.checklist.indexOf(r);return '<details id="test-'+esc(r.id)+'"><summary><span>'+badge(D.ENUMS.result.find(a=>a[0]===r.result)[1],r.result==='fail'?'red':r.result==='pass'?'':'gray')+' <span style="margin-left:7px">'+esc(r.title||'Untitled playtest')+'</span></span></summary><div class="details-body"><div class="form-grid">'+field('Playtest name',pathPrefix+'checklist.'+i+'.title')+field('Which test',pathPrefix+'checklist.'+i+'.scenario')+field('What to do',pathPrefix+'checklist.'+i+'.procedure','textarea')+field('What should happen',pathPrefix+'checklist.'+i+'.expected','textarea')+field('Result',pathPrefix+'checklist.'+i+'.result','select','You pick this after you test. The tool does not test your game.',{enum:'result'})+field('What you saw, game version, date and tester',pathPrefix+'checklist.'+i+'.evidence','textarea','Write what really happened. Links are saved as plain text.')+'</div>'+button('Delete playtest','delete-record','data-list="checklist" data-index="'+i+'"','small danger')+'</div></details>';}).join('')+'</div>'+(p.checklist.length?'':empty('Nothing here yet','Click Add a playtest. Test your real game, especially with too few or too many players.',button('Add a playtest','add-test')));

function guide(){return title('09 / Help & sources','How this tool works','Our own explanations, based on the official pages below. The date shows when we last checked each page, not when it was written.')+'<div class="grid two">'+D.SOURCES.map(s=>'<article class="card source-card"><div class="source-meta">'+esc(s.publisher)+' · Checked '+esc(s.reviewedOn)+'</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.summary)+'</p><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.url)+'</a></article>').join('')+'</div><div class="callout neutral"><strong>Planning help, not official settings.</strong><p>All example player counts, times and goals are made-up examples. They are not Roblox limits or real player data. This file does not connect to your game, has no login, does not collect data, and does not include bots or matchmaking.</p></div><details id="guide-start" open><summary>How to use and save your work</summary><div class="details-body"><ol class="small"><li>Click Try an example or Start from scratch. Then add your game name and version.</li><li>Set your game rules and your test numbers. Leave a box blank if you are not sure.</li><li>Look at the 10 what if tests and your own test. Add to-dos and fill in the game flow steps.</li><li>Make one player’s timeline. Mark times you saw in a playtest, and times that are guesses.</li><li>Click Save project file to keep working later. Download the report and checklist to share with your team.</li></ol><p class="small">Your work saves in this browser, but it can get erased. Some browsers block saving when you open a file from your computer. Moving the file, using another browser, private browsing, or clearing your history can make your work disappear. Click Save project file to keep a copy on your computer. You can always use Open project file to get it back.</p></div></details><details id="guide-math"><summary>How the math works</summary><div class="details-body"><div class="table-wrap"><table><thead><tr><th>Math</th><th>What it means</th></tr></thead><tbody><tr><td>People in the server = match players + watchers + waiting players</td><td>Knocked-out players are already match players. Friends in a group are already counted, so do not add them again.</td></tr><tr><td>Open server spots = server size − people in the server − saved spots</td><td>Saved spots are held for players who disconnected. Nobody is playing in them.</td></tr><tr><td>Open match spots = most players in a match − match players − saved spots</td><td>An open match spot still has to follow your join and team rules.</td></tr><tr><td>Fair teams</td><td>Uses the number of teams, the fewest and most players per team, and how far apart teams can be. Extra players may keep waiting.</td></tr><tr><td>Wait until the next round</td><td>Time left in the round + results + reset + countdown. Waiting for new players, your place in line, and loading are not included.</td></tr><tr><td>Play time % = seconds playing ÷ all seconds × 100</td><td>Practice, watching, waiting and offline time do not count as playing. If a time is missing, we cannot get a full percent.</td></tr></tbody></table></div><p class="small section-spacer">The tool never reads your written notes. The same numbers always give the same result. It is not a guess about whether players will come back. Your player timeline is separate, so changing rules later does not change its times.</p></div></details><details id="guide-format"><summary>For experts: what is inside a project file</summary><div class="details-body"><p class="small">You do not need this part to use the tool. It is for people who want to read or build tools for the .json project file.</p></div><div class="details-body"><p class="small">Root: <span class="mono">format = avalon.creator-project</span>, <span class="mono">schemaVersion = 1</span>. The shared project contains id, name, platform, engine, genre, targetAudience, targetDevices, stage, gameVersion, designPillars and sessionLengthMinutes. UUID identity is retained across saves; explicit duplication creates a new identity.</p><p class="small">This app edits only <span class="mono">tools.multiplayer_sessions</span> and explicit shared-profile edits. Its module has <span class="mono">moduleVersion: 1</span>, an actual UTC ISO <span class="mono">updatedAt</span>, and <span class="mono">payload</span>. Other namespaces and unfamiliar versions remain inert JSON. No automatic merge, timestamp winner or cross-tool delivery is performed.</p><div class="table-wrap"><table><thead><tr><th>Payload field</th><th>Shape / meaning</th></tr></thead><tbody><tr><td>rules</td><td>Player/team limits, numerical durations/goals, configured policy strings, lobby/party/fairness notes. Unknown numeric values are null; unchosen policies are "undecided".</td></tr><tr><td>sandbox</td><td>phase, participants, eliminated, spectators, queued, otherServers, readyPlayers, teamSizes, partySize, elapsedSeconds, departingTeam, departures, reservedSlots, splitConsent. Counts are disjoint except the explicitly labeled eliminated subset.</td></tr><tr><td>states</td><td>Ordered records: id, label, actions. The six base state IDs remain present; custom states can be added.</td></tr><tr><td>transitions</td><td>id, from, to, condition, participants, spectators, queued, parties, disconnected, otherServers. From may be * (any occupied state).</td></tr><tr><td>timelinePerson / timeline</td><td>Person description; ordered segments with id, label, phase, durationSeconds, basis, role, note. basis is assumed, observed or unknown.</td></tr><tr><td>decisions</td><td>id, title, scenario, owner, status (open/decided/tested), notes.</td></tr><tr><td>dependencies</td><td>id, name, status (proposed/building/implemented/verified), notes. Implementation/tested statuses are creator assertions.</td></tr><tr><td>checklist</td><td>id, title, scenario, procedure, expected, result (not_tested/pass/fail/blocked), evidence.</td></tr><tr><td>notes</td><td>Overall design notes, kept as literal text.</td></tr></tbody></table></div><p class="small section-spacer">Open project file limits: 2 MiB UTF-8, 32 nesting levels, 100,000 JSON nodes, 10,000 items in a generic array, 20,000 characters per generic string and 64 tool namespaces. Planner counts are capped at 500, teams at 32, durations at 86,400 seconds; these are this tool’s modeling limits. Own fields and collection limits are checked before mutation. Unsupported root or own-module versions are refused. Unknown-module meaning is not validated.</p><p class="small">Import offers identity/version/module differences and a backup download before whole-workspace replacement. Current modules missing from the incoming file are explicitly listed. Invalid or canceled imports leave the current workspace unchanged. JSON and CSV content is treated as data, unsafe prototype keys are rejected, and CSV exports neutralize formula prefixes. Only full JSON snapshots are supported for import; specialized record/CSV import is not implemented.</p></div></details><details id="guide-license"><summary>License and credit</summary><div class="details-body"><p class="small">Our code and text use the AmadOpenSource License 1.0, so you can use and share them for free. Use it for anything, including paid work; what you make with it is yours. The tool itself may not be sold or turned into a paid product. This file does not include code, fonts or pictures from anyone else. The linked pages belong to their owners. Made by Avalon Partner with Captain Amado. This tool is not made by Roblox.</p><pre class="small wrap-text">'+esc(LICENSE)+'</pre></div></details>';
}

function timelineDraft(id){const r=payload().rules,b=payload().sandbox,arr=[];const add=(label,phase,seconds,role,note)=>arr.push({id:D.uuid(),label,phase,durationSeconds:seconds,basis:seconds===null?'unknown':'assumed',role,note:note||''});let person='One waiting player who then plays a full round.';

  else if(a==='add-dependency')editRecord('dependency');
  else if(a==='edit-dependency')editRecord('dependency',Number(e.dataset.index));
  else if(a==='decision-from-scenario'){const s=scenarios().find(s=>s.id===e.dataset.scenario);if(s)editRecord('decision',undefined,{title:s.decisions[0]||'Review '+s.title,scenario:s.id,notes:'Test: '+s.title+'\n'+s.reason+'\n\nWhat I decided and why: '});}
  else if(a==='finding-decision'){const f=findings()[Number(e.dataset.finding)];if(f)editRecord('decision',undefined,{title:f.title,scenario:f.scenario,notes:f.reason+'\n\nIdea: '+f.action});}
  else if(a==='timeline-template')previewTimeline();
  else if(a==='timeline-from-scenario')previewTimeline(e.dataset.scenario);
  else if(a==='apply-timeline'){if(proposedTimeline){const c=D.clone(snapshot);c.tools[KEY].payload.timeline=proposedTimeline.rows;c.tools[KEY].payload.timelinePerson=proposedTimeline.person;commit(c);proposedTimeline=null;$('#modal').close();view='timeline';render();}}
  else if(a==='export-transitions')download(PlannerReports.transitionCSV(snapshot),safeFilename(snapshot.project.name,'_transitions.csv'),'text/csv;charset=utf-8');
  else if(a==='export-scenarios')download(PlannerReports.scenarioCSV(scenarios()),safeFilename(snapshot.project.name,'_scenarios.csv'),'text/csv;charset=utf-8');
  else if(a==='export-checklist')download(PlannerReports.checklistCSV(snapshot),safeFilename(snapshot.project.name,'_playtest_checklist.csv'),'text/csv;charset=utf-8');
  else if(a==='export-report'){const s=scenarios();download(PlannerReports.standalone(snapshot,s,findings(s)),safeFilename(snapshot.project.name,'_session_design_brief.html'),'text/html;charset=utf-8');}
  else if(a==='export-markdown'){const s=scenarios();download(PlannerReports.markdown(snapshot,s,findings(s)),safeFilename(snapshot.project.name,'_session_design_brief.md'),'text/markdown;charset=utf-8');}
  else if(a==='export-prompt'){const s=scenarios();download(PlannerReports.aiPrompt(snapshot,s,findings(s)),safeFilename(snapshot.project.name,'_AI_review_prompt.txt'),'text/plain;charset=utf-8');}
  else if(a==='print'){preparePrint();window.print();}
 }catch(err){toast(err.message||'That did not work. Your work is still safe.',true);}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el){ev.preventDefault();action(el);}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.path)processInput(el);else if(el.id==='scenarioSearch'){scenarioQuery=el.value;$('#scenarioResults').innerHTML=scenarioResults();}else if(el.id==='reviewSearch'){reviewQuery=el.value;const start=el.selectionStart;const pos=window.scrollY;$('#main').innerHTML=reviewView();const fresh=$('#reviewSearch');fresh.focus({preventScroll:true});fresh.setSelectionRange(start,start);window.scrollTo(0,pos);}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.path){processInput(el);if(!pendingInvalid.size&&!el.closest('dialog'))render(true);}else if(el.id==='scenarioFilter'){scenarioFilter=el.value;$('#scenarioResults').innerHTML=scenarioResults();}});
$('#fileInput').addEventListener('change',async ev=>{const file=ev.target.files?.[0];if(!file)return;try{if(file.size>D.LIMIT)throw Error('This file is too big. The limit is 2 MB.');const next=D.parseSnapshot(await file.text());previewReplacement(next,file.name,'import');}catch(e){toast('Could not open that file: '+e.message+' Your work did not change.',true);openModal('Could not open that file',callout('Your work did not change',e.message,'red'),button('Close','close-modal')+button('Pick another project file','import','','primary'));}});
$('#modal').addEventListener('cancel',ev=>{if(pendingInvalid.size){ev.preventDefault();toast('Fix the box marked in red before closing.',true);return;}pendingImport=null;pendingKind='';setTimeout(()=>render(true),0);});
window.addEventListener('beforeunload',ev=>{if((hasChanges&&saveFailed)||pendingInvalid.size){ev.preventDefault();ev.returnValue='';}});
window.addEventListener('beforeprint',preparePrint);
window.addEventListener('storage',ev=>{if(ev.key===STORE&&ev.newValue!==lastSaved&&snapshot){storageConflict=ev.newValue===null?'null':ev.newValue;saveStatus='Another tab saved. Auto-save is paused.';saveFailed=true;clearTimeout(saveTimer);updateChrome();toast('This tool saved in another tab. Click Save project file before you pick which copy to keep.',true);}});
try{const raw=localStorage.getItem(STORE);if(raw){snapshot=D.parseSnapshot(raw);lastSaved=raw;saveStatus='Your work was loaded from this browser. Click Save project file to keep a copy.';}}catch(e){saveStatus='Could not load your work from this browser. Use Open project file to get it back.';saveFailed=true;}
render();
window.AvalonPlanner={getSnapshot:()=>D.clone(snapshot),getScenarios:()=>scenarios(),getFindings:()=>findings(),validateSnapshot:D.validateSnapshot,parseSnapshot:D.parseSnapshot,previewImport:raw=>previewReplacement(D.parseSnapshot(raw),'A project file'),exportText:()=>JSON.stringify(snapshot,null,2),storageKey:STORE,version:'1.0.0'};
})();
</script>
