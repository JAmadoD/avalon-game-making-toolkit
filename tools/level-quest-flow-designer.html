function inputField(label,path,{type='text',hint='',placeholder='',min,max,maxlength=200,rows,options,value}={}){const val=value!==undefined?value:getPath(draft.data,path),id='f_'+path.replaceAll('.','_');let field;if(options){options=options.slice();if(val!==null&&val!==undefined&&val!==''&&!options.some(o=>String(Array.isArray(o)?o[0]:o)===String(val)))options.unshift([val,'Missing: '+String(val)]);field=`<select id="${id}" data-path="${path}"${type==='boolean'?' data-value-type="boolean"':''}>${options.map(o=>{const pair=Array.isArray(o)?o:[o,o];return `<option value="${esc(pair[0])}" ${String(val)===String(pair[0])?'selected':''}>${esc(pair[1])}</option>`;}).join('')}</select>`;}else if(type==='textarea'){field=`<textarea id="${id}" data-path="${path}" maxlength="${maxlength}" rows="${rows||3}" placeholder="${esc(placeholder)}">${esc(val)}</textarea>`;}else if(type==='checkbox'){return `<label class="check-row"><input type="checkbox" data-path="${path}" ${val?'checked':''}>${esc(label)}</label>${hint?`<span class="hint">${esc(hint)}</span>`:''}`;}else{field=`<input id="${id}" data-path="${path}" type="${type}" value="${esc(val)}" ${type==='number'?'step="any" data-value-type="number"':''} ${min!==undefined?`min="${min}"`:''} ${max!==undefined?`max="${max}"`:''} maxlength="${maxlength}" placeholder="${esc(placeholder)}">`;}return `<div class="field"><label for="${id}">${esc(label)}</label>${field}${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`;}
function draftActions(){return `<div class="form-actions"><button class="button primary" type="submit">Save changes</button>${button('Cancel changes','revert-draft','','small')}<span class="draft-badge" id="draftStatus">${draftDirty?'Not saved yet':'Saved'}</span></div>`;}
function conditionText(r){if(!r?.conditions?.length)return 'None';return r.mode+': '+r.conditions.map(c=>QF.describeCondition?QF.describeCondition(payload(),c):(c.kind==='completed'?cname(c.kind,c.ref)+(c.value?' completed':' not completed'):c.kind==='flag'?cname(c.kind,c.ref)+' = '+c.value:cname(c.kind,c.ref)+' ≥ '+c.value)).join(r.mode==='AND'?' + ':' / ');}
function costsText(o){return o.costs.length?o.costs.map(c=>fmt(c.amount)+' '+cname(c.kind,c.ref)).join(', '):'None';}
function effectsText(o){return o.effects.length?o.effects.map(c=>c.kind==='flag'?cname(c.kind,c.ref)+' = '+c.value:(c.value>=0?'+':'')+fmt(c.value)+' '+cname(c.kind,c.ref)).join(', '):'None';}
function shell(content){return `<div class="app-layout"><aside class="sidebar" aria-label="Tool steps"><div class="project-chip"><span class="eyebrow">Your project</span><strong>${esc(W.project.name||'Untitled project')}</strong><small>${esc(W.project.platform||'Platform not set')} · ${esc(W.project.gameVersion||'Version not set')}</small></div><nav class="steps">${NAV.map(([id,name],i)=>`<button class="nav-step ${page===id?'active':''}" data-action="nav" data-page="${id}" ${page===id?'aria-current="page"':''}><span class="num">0${i+1}</span>${name}</button>`).join('')}</nav><div class="sidebar-actions">${button('Undo edit','undo','', 'small')}${button('New project','new','', 'small')}</div><div class="sidebar-note"><strong>Your file. Your design.</strong>Your work saves in this browser, but it can get erased. Click Save project file to keep a copy on your computer.<br><br>You can open that file in our other creator tools too.</div></aside><main class="workspace" id="main" tabindex="-1">${content}</main></div>`;}
function heading(step,title,desc,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${step}</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="button-row">${actions}</div>`:''}</div>`;}
function render(){if(page==='start'||!W){$('#app').innerHTML=landing();return;}let content='';if(page==='brief')content=briefView();if(page==='flow')content=flowView();if(page==='state')content=stateView();if(page==='walk')content=walkView();if(page==='checks')content=checksView();if(page==='pacing')content=pacingView();if(page==='export')content=exportView();$('#app').innerHTML=shell(content);updateSaveStatus();if(page==='flow'&&flowMode==='graph')drawGraph();}
function landing(){return `<main class="landing" id="main" tabindex="-1">${W?`<div class="continue-card"><div><div class="eyebrow">Pick up where you left off</div><strong>${esc(W.project.name||'Untitled project')}</strong><p>${payload().nodes.length} nodes · ${payload().edges.length} connections · ${esc(W.project.gameVersion||'Version not set')}</p></div>${button('Keep working','continue','','primary')}</div>`:''}<section class="hero"><div class="hero-copy"><div class="eyebrow">Plan your level before you build it</div><h1>Build the path.<br><span>Test the choices.</span></h1><p>Draw a map of your level or quest. Add the rules, like keys and locked doors. Then test it to see what players can really do.</p><div class="button-row">${button('Start from scratch','new','','primary')}<a class="button dark-outline" href="#examples">Try an example</a>${button('Open project file','import','','dark-outline')}</div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 440 315"><defs><marker id="heroArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#9bc1a6"/></marker></defs><g fill="none" stroke="#79a489" stroke-width="1.5" marker-end="url(#heroArrow)"><path d="M220 62V95"/><path d="M166 139H100v43"/><path d="M273 139h65v43"/><path d="M100 227v25h120v20"/><path d="M338 227v25H220v20"/></g><g font-family="system-ui,sans-serif"><rect x="155" y="17" width="132" height="45" rx="8" fill="#edf4e9"/><text x="221" y="45" text-anchor="middle" fill="#174431" font-size="11" font-weight="650">Player goal</text><rect x="139" y="95" width="164" height="55" rx="8" fill="#1f513c" stroke="#7da28b"/><text x="221" y="116" fill="#abc9b5" text-anchor="middle" font-size="7" letter-spacing="1.6">CHOICE</text><text x="221" y="135" fill="#edf5ed" text-anchor="middle" font-size="11">Which route will you take?</text><rect x="27" y="182" width="146" height="45" rx="8" fill="#2c5c43" stroke="#749b80"/><text x="100" y="210" fill="#e2f0e1" text-anchor="middle" font-size="10">Find the missing key</text><rect x="265" y="182" width="146" height="45" rx="8" fill="#2c5c43" stroke="#749b80"/><text x="338" y="210" fill="#e2f0e1" text-anchor="middle" font-size="10">Spend a resource</text><rect x="149" y="273" width="144" height="36" rx="8" fill="#d7e7ce"/><text x="221" y="296" fill="#224330" text-anchor="middle" font-size="10" font-weight="650">A reward you earned</text></g></svg></div></section><div class="landing-meta"><span>Free <b>·</b> Works offline <b>·</b> No sign-up</span><span>For Roblox creators & game designers</span></div><div class="section-title" id="examples"><div><h2>Try an example</h2><p>Pick one of these 3 examples. You can change anything in them.</p></div></div><div class="card-grid">${QFContent.examples.map((ex,i)=>`<article class="example-card"><div class="example-top"><span class="example-number">0${i+1}</span>${tag(i===0?'Keys & costs':i===1?'Checkpoints':'Branching quests','grey')}</div><h3>${esc(ex.title)}</h3><p>${esc(ex.subtitle)}</p>${button('Try this example','example',`data-key="${esc(ex.key)}"`,'small')}</article>`).join('')}</div><div class="section-title" style="margin-top:34px;margin-bottom:0"><div><h2>How to use this tool</h2></div></div><div class="how-strip"><div><h3>01 · Write your goal</h3><p>Say what the player must do, and how they win.</p></div><div><h3>02 · Map your level</h3><p>Add places and tasks. Draw arrows to connect them.</p></div><div><h3>03 · Test it</h3><p>Play through it here. Watch your items and flags change.</p></div><div><h3>04 · Save and build</h3><p>Click Save project file. Then build and test it in Roblox Studio or your game engine.</p></div></div><footer class="landing-footer"><span>Made by Avalon Partner with Captain Amado.<br>Free and source available. The tool is not for sale.</span><span>Sources checked: Oct 21, 2026<br>Version 1.0 · Works offline</span></footer></main>`;}
function briefView(){if(!draft||draft.kind!=='profile')initDraft('profile');const p=draft.data.project;return heading('01 / Your goal','What should the player do?','Write a clear goal and say how the player wins. These details are saved in your project file.')+`<div class="columns"><section class="panel panel-pad"><form id="draftForm"><div class="form-section"><h3>The goal</h3><div class="form-grid">${inputField('Project name','project.name',{maxlength:300,placeholder:'Give your project a name'})}<div class="field">${inputField('Game version','project.gameVersion',{maxlength:300,placeholder:'For example, prototype 0.2'})}</div><div class="span-2">${inputField('Player goal','goal',{type:'textarea',maxlength:12000,placeholder:'Find the lost key and bring it back to the village.',hint:'What does the player do, why, and where does it end?'})}</div><div class="span-2">${inputField('How the player wins','successCriteria',{type:'textarea',maxlength:12000,placeholder:'The player reaches the exit with the key.',hint:'Say it in plain words. Later, add matching requirements to your Ending node.'})}</div></div></div><div class="form-section"><h3>Your game and players</h3><div class="form-grid">${inputField('Platform','project.platform',{maxlength:300,placeholder:'Roblox, PC, console, or another platform'})}${inputField('Game engine','project.engine',{maxlength:300,placeholder:'Roblox Studio, Godot, Unity…'})}${inputField('Genre','project.genre',{maxlength:300,placeholder:'Adventure, obby, RPG…'})}${inputField('How far along is it?','project.stage',{maxlength:300,placeholder:'Idea, test version, almost done…'})}<div class="span-2">${inputField('Who is it for?','project.targetAudience',{maxlength:1500,placeholder:'Who will play it? What do they already know?'})}</div><div class="field"><label for="targetDevices">Devices</label><input id="targetDevices" data-array-path="project.targetDevices" value="${esc(p.targetDevices.join(', '))}" maxlength="1000" placeholder="Desktop, Phone, Tablet"><span class="hint">Put a comma between each one.</span></div>${inputField('Goal play time (minutes)','project.sessionLengthMinutes',{type:'number',min:0,max:10080,hint:'How long one play session should last. Leave it blank if you are not sure.'})}<div class="span-2 field"><label for="designPillars">Big ideas for your game</label><textarea id="designPillars" data-array-path="project.designPillars" data-separator="newline" rows="3" maxlength="12000" placeholder="One short idea per line">${esc(p.designPillars.join('\n'))}</textarea><span class="hint">The main things your game should be or feel like.</span></div></div></div><div class="form-section">${inputField('Notes and questions','notes',{type:'textarea',maxlength:12000,rows:4,placeholder:'Things to figure out, build notes, questions to test…'})}</div>${draftActions()}</form></section><aside class="stack"><section class="panel panel-pad"><div class="eyebrow muted" style="margin-bottom:10px">Your plan</div><h2>Small steps, clear rules.</h2>${[['Add the key moments','Add a start, places, tasks, and an ending.'],['Connect them with arrows','Each arrow is a path or choice the player can take.'],['Add items and flags','Add keys, yes/no facts, and coins before you set rules.'],['Test more than one path','Try going back, spending too early, failing, and picking the other choice.'],['Save, build, and playtest','Build it in your game with the build plan and test checklist. A playtest is when real people try your game.']].map((x,i)=>`<div class="guide-step"><span class="guide-num">${i+1}</span><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}${button('Go to the map','nav','data-page="flow"','block')}</section><div class="callout"><strong>One project file for all tools.</strong><p>Click Save project file to get a .json file. You can open it in our other creator tools. Two projects with the same name are still different projects. Data from other tools stays safe in the file.</p></div>${guidePanel()}</aside></div>`;}
function guidePanel(){const ex=QFContent.examples.find(x=>x.key===guideKey)||QFContent.examples.find(x=>x.title===W.project.name);if(!ex)return '';return `<section class="panel panel-pad"><div class="eyebrow muted" style="margin-bottom:10px">Follow these steps</div><h3>${esc(ex.title)}</h3><p class="smalltext muted" style="margin:8px 0 12px">${esc(ex.description)}</p>${(ex.guide||[]).map((x,i)=>`<div class="guide-step"><span class="guide-num">${i+1}</span><div>${esc(x)}</div></div>`).join('')}</section>`;}
function flowView(){const p=payload();return heading('02 / Map your level','Every path should mean something.','A node is one box on your map: a place, a task, or an ending. Add nodes, then connect them with arrows. Arrows only go one way.',button('Add a node','add-node','','primary')+button('Connect two nodes','add-edge',p.nodes.length<1?'disabled':'')+button('Undo edit','undo',history.length?'':'disabled'))+`<div class="flow-layout"><div class="flow-main"><section class="panel"><div class="panel-head"><h2>Your map <span class="muted smalltext">${p.nodes.length} nodes / ${p.edges.length} connections</span></h2>${tag(p.startNodeId?'Start: '+nameBy(p.startNodeId):'No start yet',p.startNodeId?'grey':'gold')}</div><div class="flow-toolbar"><div class="segmented" aria-label="Flow view"><button data-action="flow-mode" data-mode="graph" class="${flowMode==='graph'?'active':''}" aria-pressed="${flowMode==='graph'}">Map view</button><button data-action="flow-mode" data-mode="list" class="${flowMode==='list'?'active':''}" aria-pressed="${flowMode==='list'}">List view</button></div>${flowMode==='graph'?`<div class="zoom-control">${button('−','zoom-out','aria-label="Zoom out"','small')}<span class="zoom-value">${Math.round(zoom*100)}%</span>${button('+','zoom-in','aria-label="Zoom in"','small')}${button('Fit','fit','title="Zoom to fit the whole map"','small')}</div>`:`<span class="smalltext muted">Same map, shown as a list.</span>`}</div>${p.nodes.length===0?`<div class="empty"><span class="empty-number">1</span><h3>Nothing here yet. Add your first node.</h3><p>Start with a starting point. Then add a task and an ending. Connect them with arrows to make a path.</p>${button('Add a starting point','add-type','data-type="start"','primary')}</div>`:flowMode==='graph'?'<div class="graph-viewport" id="graphViewport" tabindex="0" aria-label="Map of your level. Scroll to see more."><div id="graphSpace" class="graph-space"><div id="graphWorld" class="graph-world"></div></div></div>':flowLists()}<div class="legend"><span>Place or task</span><span class="gate" title="A gate is like a locked door. Players need something to pass.">Gate (locked door)</span><span class="checkpoint" title="A checkpoint is a save spot where players come back after failing.">Checkpoint (save spot)</span><span class="failure">Failure (player fails)</span></div></section><p class="graph-hint">${flowMode==='graph'?'Drag a node to move it. Or press Tab to pick a node, then use the arrow keys. Hold Shift to move it farther. Press Enter to edit it.':'Search and edit every node and arrow here. No dragging needed. A copy is a brand new node. Rules that use the original still use the original.'}</p>${guidePanel()}</div>${inspectorView()}</div>`;}
function flowLists(){const p=payload(),q=flowSearch.toLowerCase();const ns=p.nodes.filter(n=>(!typeFilter||n.type===typeFilter)&&(n.name+' '+n.description).toLowerCase().includes(q));const es=p.edges.filter(e=>(e.label+' '+e.description+' '+nameBy(e.from)+' '+nameBy(e.to)).toLowerCase().includes(q));return `<div class="search-bar"><input class="search-input" type="search" id="flowSearch" aria-label="Search nodes and connections" placeholder="Search names, notes, or paths" value="${esc(flowSearch)}"><select id="typeFilter" aria-label="Filter node types"><option value="">All node types</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${typeFilter===k?'selected':''}>${v}</option>`).join('')}</select></div><div id="flowListResults">${flowTables(ns,es)}</div>`;}
function flowTables(ns,es){return `<h3 class="table-title">Nodes <span class="muted">(${ns.length})</span></h3>${ns.length?`<div class="table-wrap"><table><thead><tr><th>Node / type</th><th>Needs & time</th><th>Actions</th></tr></thead><tbody>${ns.map(n=>`<tr><td><strong>${esc(n.name||'Unnamed node')}</strong><span class="secondary">${TYPES[n.type]}${n.id===payload().startNodeId?' · Start':''}${n.optional?' · Optional':''}${n.repeatable?' · Repeats rewards':''}</span></td><td>${esc(conditionText(n.prerequisites))}<span class="secondary">Time: ${n.durationMinutes===null?'not set':fmt(n.durationMinutes)+' min'} · Tension: ${n.tension===null?'not set':fmt(n.tension)+'/5'}</span></td><td><div class="button-row">${button('Edit','select',`data-kind="node" data-id="${esc(n.id)}"`,'small')}${button('Copy','duplicate',`data-kind="node" data-id="${esc(n.id)}"`,'small')}${button('Connect','add-edge',`data-from="${esc(n.id)}"`,'small')}${button('Delete','delete',`data-kind="node" data-id="${esc(n.id)}"`,'small danger')}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><p>No nodes match this search. Try a different word.</p></div>'}<h3 class="table-title">Connections <span class="muted">(${es.length})</span></h3>${es.length?`<div class="table-wrap"><table><thead><tr><th>Path</th><th>Rules</th><th>Actions</th></tr></thead><tbody>${es.map(e=>`<tr><td><strong>${esc(e.label||'Unnamed connection')}</strong><span class="secondary">${esc(nameBy(e.from))} → ${esc(nameBy(e.to))}</span></td><td>${esc(conditionText(e.prerequisites))}<span class="secondary">Cost: ${esc(costsText(e))}${e.choiceGroup?' · Pick-one group: '+esc(e.choiceGroup):''}${!e.repeatable?' · Once only':''}</span></td><td><div class="button-row">${button('Edit','select',`data-kind="edge" data-id="${esc(e.id)}"`,'small')}${button('Copy','duplicate',`data-kind="edge" data-id="${esc(e.id)}"`,'small')}${button('Delete','delete',`data-kind="edge" data-id="${esc(e.id)}"`,'small danger')}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><p>No arrows here. Click Connect two nodes to add one.</p></div>'}`;}
function refreshFlowList(){const q=flowSearch.toLowerCase(),p=payload();$('#flowListResults').innerHTML=flowTables(p.nodes.filter(n=>(!typeFilter||n.type===typeFilter)&&(n.name+' '+n.description).toLowerCase().includes(q)),p.edges.filter(e=>(e.label+' '+e.description+' '+nameBy(e.from)+' '+nameBy(e.to)).toLowerCase().includes(q)));}
function graphDimensions(){const ns=payload().nodes;return {width:Math.max(520,...ns.map(n=>n.x+270)),height:Math.max(380,...ns.map(n=>n.y+165))};}
function edgeGeometry(edge,index){const a=nodeBy(edge.from),b=nodeBy(edge.to);if(!a||!b)return null;let d,tx,ty;const ax=a.x+102,ay=a.y+96,bx=b.x+102,by=b.y;if(edge.from===edge.to){d=`M${a.x+204},${a.y+32} C${a.x+285},${a.y+0} ${a.x+285},${a.y+112} ${a.x+204},${a.y+72}`;tx=a.x+265;ty=a.y+120;}else if(by>ay+15){const mid=(ay+by)/2;d=`M${ax},${ay} C${ax},${mid} ${bx},${mid} ${bx},${by}`;tx=(ax+bx)/2;ty=mid-5;}else if(Math.abs(a.y-b.y)<100){const sx=a.x<b.x?a.x+204:a.x,ex=a.x<b.x?b.x:b.x+204;d=`M${sx},${a.y+48} C${(sx+ex)/2},${a.y+48} ${(sx+ex)/2},${b.y+48} ${ex},${b.y+48}`;tx=(sx+ex)/2;ty=(a.y+b.y)/2+40;}else{const side=Math.max(a.x,b.x)+235+(index%3)*17;d=`M${a.x+204},${a.y+60} C${side},${a.y+60} ${side},${b.y+65} ${b.x+204},${b.y+65}`;tx=side-12;ty=(a.y+b.y)/2+58;}return {d,tx,ty};}
function drawGraph(){const world=$('#graphWorld');if(!world)return;const dim=graphDimensions();world.style.width=dim.width+'px';world.style.height=dim.height+'px';world.style.transform=`scale(${zoom})`;$('#graphSpace').style.width=dim.width*zoom+'px';$('#graphSpace').style.height=dim.height*zoom+'px';world.innerHTML=`<svg class="graph-svg" width="${dim.width}" height="${dim.height}" aria-label="Arrows between nodes"><defs><marker id="edgeArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#6b9078" stroke-width="1.1"/></marker></defs>${payload().edges.map((ed,i)=>{const g=edgeGeometry(ed,i);if(!g)return '';const selected=selection?.kind==='edge'&&selection.id===ed.id;return `<path d="${g.d}" class="edge-line ${selected?'selected':''}" marker-end="url(#edgeArrow)"/><path d="${g.d}" fill="none" stroke="transparent" stroke-width="18" class="edge-click" role="button" tabindex="0" data-action="select" data-kind="edge" data-id="${esc(ed.id)}" aria-label="Edit path ${esc(ed.label)} from ${esc(nameBy(ed.from))} to ${esc(nameBy(ed.to))}"/><text x="${g.tx}" y="${g.ty}" text-anchor="middle" class="edge-label" data-action="select" data-kind="edge" data-id="${esc(ed.id)}">${esc(ed.label.length>26?ed.label.slice(0,24)+'…':ed.label)}</text>`;}).join('')}</svg>${payload().nodes.map(n=>`<button class="graph-node type-${n.type} ${selection?.kind==='node'&&selection.id===n.id?'selected':''}" style="left:${n.x}px;top:${n.y}px" data-action="select" data-kind="node" data-id="${esc(n.id)}" aria-label="${esc(n.name||'Unnamed node')}, ${TYPES[n.type]}. Enter to edit, arrow keys to move."><span class="node-kind">${TYPES[n.type]}${n.id===payload().startNodeId?' / START':''}</span><span class="node-name">${esc(n.name||'Unnamed node')}</span><span class="node-meta"><span>${n.durationMinutes===null?'Time ?':fmt(n.durationMinutes)+' min'}</span>${n.prerequisites.conditions.length?`<span>Needs ${n.prerequisites.conditions.length} (${n.prerequisites.mode})</span>`:''}${n.repeatable?'<span>Repeats</span>':''}${n.optional?'<span>Optional</span>':''}</span></button>`).join('')}`;}
function rulesEditor(){const d=draft.data;const available=[['flag','Flag (yes/no fact)'],['item','Item'],['resource','Resource (like coins)'],['completed','Finished objective']];function refs(kind){return kind==='completed'?payload().nodes.filter(n=>n.type==='objective').map(n=>[n.id,n.name]):payload().catalogs[({flag:'flags',item:'items',resource:'resources'})[kind]].map(n=>[n.id,n.name]);}function refOpts(kind,ref){const os=refs(kind);if(!os.some(x=>x[0]===ref))os.unshift([ref,'Missing: '+ref]);return os;}
const reqs=d.prerequisites.conditions.map((c,i)=>`<div class="rule-row"><div class="rule-grid">${inputField('Type of requirement',`prerequisites.conditions.${i}.kind`,{options:available})}${inputField('Which one',`prerequisites.conditions.${i}.ref`,{options:refOpts(c.kind,c.ref)})}<div class="span-2">${inputField(c.kind==='flag'?'Must be':c.kind==='completed'?'Objective status':'Has at least',`prerequisites.conditions.${i}.value`,(c.kind==='flag'||c.kind==='completed')?{type:'boolean',options:[[true,c.kind==='completed'?'Completed':'True'],[false,c.kind==='completed'?'Not completed':'False']]}:{type:'number',min:0,max:1000000000,hint:'Only checks that the player has it. It does not take it away.'})}</div></div><button type="button" class="remove-rule" data-action="remove-rule" data-list="prerequisites.conditions" data-index="${i}">Remove requirement</button></div>`).join('');
const costRows=d.costs.map((c,i)=>`<div class="rule-row"><div class="rule-grid">${inputField('Type to spend',`costs.${i}.kind`,{options:available.filter(x=>x[0]==='item'||x[0]==='resource')})}${inputField('Which one',`costs.${i}.ref`,{options:refOpts(c.kind,c.ref)})}${inputField('How many to spend',`costs.${i}.amount`,{type:'number',min:.000000001,max:1000000000})}</div><button type="button" class="remove-rule" data-action="remove-rule" data-list="costs" data-index="${i}">Remove cost</button></div>`).join('');
const effects=d.effects.map((c,i)=>`<div class="rule-row"><div class="rule-grid">${inputField('Type to change',`effects.${i}.kind`,{options:available.filter(x=>x[0]!=='completed')})}${inputField('Which one',`effects.${i}.ref`,{options:refOpts(c.kind,c.ref)})}${inputField(c.kind==='flag'?'Set flag to':'Amount to add or remove (+ / −)',`effects.${i}.value`,c.kind==='flag'?{type:'boolean',options:[[true,'True'],[false,'False']]}:{type:'number',min:-1000000000,max:1000000000,hint:'A plus number gives. A minus number takes away. Costs are paid before rewards.'})}</div><button type="button" class="remove-rule" data-action="remove-rule" data-list="effects" data-index="${i}">Remove change</button></div>`).join('');
return `<div class="stack-sm"><details ${d.prerequisites.conditions.length?'open':''}><summary>Requirements: what the player needs <span class="muted">(${d.prerequisites.conditions.length})</span></summary><div class="details-body">${inputField('How many must be true?','prerequisites.mode',{options:[['AND','AND: all of them'],['OR','OR: at least one']]})}${reqs||'<p class="hint">No requirements yet. Any player can go here, if they can pay the costs.</p>'}<button type="button" class="button small" data-action="add-rule" data-list="prerequisites.conditions">Add requirement</button></div></details><details ${d.costs.length||d.effects.length?'open':''}><summary>Costs, rewards & changes <span class="muted">(${d.costs.length+d.effects.length})</span></summary><div class="details-body"><p class="hint">A cost takes items or resources away. Rewards come after costs. If a key should not get used up, put it in Requirements, not in Costs.</p><h4 style="margin:12px 0 6px">Costs</h4>${costRows}<button type="button" class="button small" data-action="add-rule" data-list="costs">Add cost</button><h4 style="margin:16px 0 6px">Rewards and changes</h4>${effects}<button type="button" class="button small" data-action="add-rule" data-list="effects">Add change</button></div></details></div>`;}
function inspectorView(){if(!draft||!['node','edge'].includes(draft.kind))return `<aside class="panel inspector" id="inspector"><div class="panel-head"><h2>Node editor</h2>${tag('Pick a node','grey')}</div><div class="empty"><span class="empty-number">2</span><h3>Give each node a job</h3><p>Click a node or an arrow to edit it. You can set what it needs, what it costs, and what it gives.</p></div><div class="panel-pad"><div class="callout"><strong>New here?</strong><p>First add your keys, flags, and coins in Items & flags. Then you can use them in rules.</p></div><div class="button-row" style="margin-top:14px">${button('Set up items & flags','nav','data-page="state"','small')}</div></div></aside>`;const d=draft.data,isNode=draft.kind==='node';return `<aside class="panel inspector" id="inspector"><div class="panel-head"><h2 class="inspector-title">${isNode?'Node':'Connection'} editor</h2>${tag(isNode?TYPES[d.type]:'One-way arrow','grey')}</div><div class="panel-pad"><form id="draftForm"><div class="stack-sm">${inputField(isNode?'Node name':'Connection label',isNode?'name':'label',{maxlength:200})}${isNode?inputField('Node type','type',{options:Object.entries(TYPES)}):`<div class="form-grid">${inputField('From node','from',{options:payload().nodes.map(n=>[n.id,n.name])})}${inputField('To node','to',{options:payload().nodes.map(n=>[n.id,n.name])})}</div>`}${inputField(isNode?'What does the player do here?':'What happens on this path?','description',{type:'textarea',maxlength:12000})}<div class="form-grid">${inputField(isNode?'Time to do this (minutes)':'Time to travel (minutes)','durationMinutes',{type:'number',min:0,max:10080,hint:'Your best guess. Leave blank if not sure. 0 means no time.'})}${isNode?inputField('Tension (1 to 5)','tension',{options:[['','Not set'],[1,'1 · Calm'],[2,'2 · Curious'],[3,'3 · Tense'],[4,'4 · Intense'],[5,'5 · Most intense']],hint:'How exciting or scary this part should feel. 1 is calm. 5 is the most intense.'}):''}</div>${isNode?inputField('Optional (players can skip it)','optional',{type:'checkbox',hint:'This is only a label. Your rules decide if the ending needs it.'}):inputField('Pick-one group','choiceGroup',{maxlength:100,placeholder:'For example, harbor-pledge',hint:'Give arrows the same group name to make the player pick only one of them. Leave blank if this is not a pick-one choice.'})}${inputField(isNode?'Give costs and rewards on every visit':'Allow this path more than once','repeatable',{type:'checkbox',hint:isNode?'If off, costs and rewards happen on the first visit only. Players can still come back.':'If off, the player can use this path only once.'})}${isNode&&d.type==='start'?button(d.id===payload().startNodeId?'This is the start':'Make this the start','set-start',`type="button" data-id="${esc(d.id)}" ${d.id===payload().startNodeId?'disabled':''}`,'small'):''}</div>${rulesEditor()}<div class="stack-sm">${isNode?`<details ${d.type==='failure'?'open':''}><summary>Position and checkpoint</summary><div class="details-body"><div class="form-grid">${inputField('Map X position (px)','x',{type:'number',min:0,max:10000})}${inputField('Map Y position (px)','y',{type:'number',min:0,max:10000})}</div>${d.type==='failure'?`<div style="margin-top:12px">${inputField('What happens after this failure?','recovery.mode',{options:[['none','Stop: the run ends here'],['checkpoint_keep','Go back to checkpoint, keep progress'],['checkpoint_restore','Go back to checkpoint, undo progress']],hint:'Keep means the player keeps everything they got. Undo means items, flags, tasks, and choices go back to how they were at the checkpoint.'})}</div>`:''}<div style="margin-top:12px">${inputField('Respawn notes','recovery.note',{type:'textarea',maxlength:12000,hint:'Where does the player respawn (come back) and which way do they face? Test this in your game.'})}</div></div></details>`:''}<details><summary>ID and more actions</summary><div class="details-body"><p class="mono smalltext">${esc(d.id)}</p><p class="hint">An ID is a code the tool uses to find this. Copies get new IDs. Renaming does not break your rules.</p><div class="button-row" style="margin-top:12px">${button('Make a copy','duplicate',`type="button" data-kind="${draft.kind}" data-id="${esc(d.id)}"`,'small')}${button('Delete','delete',`type="button" data-kind="${draft.kind}" data-id="${esc(d.id)}"`,'small danger')}${isNode?button('Add an arrow from here','add-edge',`type="button" data-from="${esc(d.id)}"`,'small'):''}</div></div></details></div>${draftActions()}</form></div></aside>`;}
function stateView(){return heading('03 / Items & flags','What does the player start with?','A flag is a yes/no fact. An item is something you hold, like a key. A resource is an amount, like coins. Add them here and set what the player starts with.')+`<div class="columns"><div class="catalog-grid"><div class="search-bar panel"><input class="search-input" id="catalogSearch" type="search" value="${esc(catalogSearch)}" placeholder="Search flags, items, and resources" aria-label="Search flags, items, and resources"></div><div id="catalogResults" class="catalog-grid">${catalogCards()}</div></div><aside class="stack">${catalogInspector()}<div class="callout"><strong>Needing a key is not the same as spending it.</strong><p><b>Needs 1 brass key</b> checks that the player has it. The player keeps the key.<br><b>Costs 1 brass key</b> takes the key away.</p><p>Rules are checked before anything is paid. If a path and the node it leads to both cost something, the player must have enough for both.</p></div><div class="callout"><strong>Blank means not set.</strong><p>A blank starting value is not 0 and not false. The tool treats it as unknown, even after rewards. Type a starting value so you can test with real numbers.</p></div></aside></div>`;}
function catalogCards(){const q=catalogSearch.toLowerCase();return [['flags','Flags','Yes/no facts, like “Bridge repaired”.'],['items','Items','Things a player can hold or spend, like a key.'],['resources','Resources','Amounts, like energy, coins, or supplies.']].map(([kind,title,desc])=>{const rows=payload().catalogs[kind].filter(c=>(c.name+' '+(c.unit||'')).toLowerCase().includes(q));return `<section class="panel"><div class="catalog-header"><div><h2>${title}</h2><p class="smalltext muted">${desc}</p></div>${button('Add '+(kind==='flags'?'flag':kind==='items'?'item':'resource'),'add-catalog',`data-kind="${kind}"`,'small')}</div>${rows.length?rows.map(c=>`<div class="catalog-row"><div class="catalog-info"><strong>${esc(c.name||'No name')}</strong><p>Starts at: ${c.initial===null?'not set':kind==='flags'?String(c.initial):fmt(c.initial)}${kind==='resources'&&c.unit?' '+esc(c.unit):''}</p></div><div class="button-row">${button('Edit','select',`data-kind="catalog:${kind}" data-id="${esc(c.id)}"`,'small')}${button('Delete','delete',`data-kind="catalog:${kind}" data-id="${esc(c.id)}"`,'small danger')}</div></div>`).join(''):`<div class="empty"><p>${q?'Nothing matches your search.':'Nothing here yet. Add a '+(kind==='flags'?'flag':kind==='items'?'key or other item':'resource and its unit')+' to use it in rules and rewards.'}</p></div>`}</section>`;}).join('');}
function catalogInspector(){if(!draft?.kind?.startsWith('catalog:'))return `<section class="panel panel-pad"><h2>Use clear names.</h2><p class="muted smalltext" style="margin:10px 0">Pick short names that are easy to tell apart. Try <b>Generator on</b>, <b>Brass key</b>, or <b>Energy</b>.</p><p class="muted smalltext">Click Edit to set a starting value. Then use it in a rule on a node or arrow.</p>${button('Go back to the map','nav','data-page="flow"','small')}</section>`;const kind=draft.kind.split(':')[1];return `<section class="panel panel-pad" id="inspector"><h2 style="font-size:18px;margin-bottom:16px">${kind==='flags'?'Flag':kind==='items'?'Item':'Resource'} editor</h2><form id="draftForm"><div class="stack">${inputField('Name','name',{maxlength:200})}${kind==='flags'?inputField('Starts as','initial',{options:[['','Not set'],['true','True'],['false','False']],hint:'If not set, rules that check this flag will not pass.'}):inputField('Starting amount','initial',{type:'number',min:0,max:1000000000,hint:'Type 0 if the player starts with none. Blank means not set.'})}${kind==='resources'?inputField('Unit (what you count)','unit',{maxlength:80,placeholder:'coins, energy points, seconds…'}):''}<p class="hint mono">ID: ${esc(draft.id)}</p>${button('Make a copy','duplicate',`type="button" data-kind="${draft.kind}" data-id="${esc(draft.id)}"`,'small')}</div>${draftActions()}</form></section>`;}
function startWalk(){const init=QF.init(payload());walkHistory=[];if(init.ok){walkState=init.state;walkTrace=clone(init.state.path);walkError='';}else{walkState=null;walkTrace=[];walkError=init.reasons.join(' ');}return init.ok;}
function takeStep(id){if(!walkState)return;const next=QF.step(payload(),walkState,id);if(!next.ok){toast(next.reasons.join('\n'),true);return;}walkHistory.push(clone(walkState));if(walkHistory.length>100)walkHistory.shift();walkState=next.state;walkTrace=clone(walkState.path);render();$('#main')?.focus({preventScroll:true});}
function walkView(){if(!walkState&&!walkError)startWalk();const head=heading('04 / Test play','Try it like a player.','Pick paths and see what happens. The tool checks your rules at each step. If you change the design, the test starts over.',button('Start over','restart-walk','','small')+button('Go back one step','undo-step',walkHistory.length?'':'disabled','small'));if(!walkState)return head+`<section class="panel"><div class="empty"><h3>The test cannot start yet</h3><p>${esc(walkError||'Add nodes and pick a starting point.')}</p><div class="button-row" style="justify-content:center">${button('Go to the map','nav','data-page="flow"','primary')}${button('Find problems','nav','data-page="checks"')}</div></div></section>`;const n=nodeBy(walkState.location),choices=QF.choices(payload(),walkState),timing=QFExport.pacing(payload(),walkTrace);return head+`<div class="columns"><section><div class="walk-hero"><div class="eyebrow">You are here / ${TYPES[n.type]}</div><h2>${esc(n.name)}</h2><p>${esc(n.description||'Tip: describe what the player does here in the map editor.')}</p><div class="tags">${tag(walkState.totalSteps+' steps','grey')}${tag('Time so far: '+fmt(timing.knownMinutes)+' min','grey')}${tag(timing.unknownSegments+' parts with no time set',timing.unknownSegments?'gold':'grey')}</div></div>${walkState.log?.length?`<div class="callout" style="margin-bottom:18px"><strong>What just happened</strong><p>${esc(walkState.log[walkState.log.length-1].message)}</p></div>`:''}<h2 style="font-size:18px;margin-bottom:14px">${n.type==='ending'?'You reached an ending!':n.type==='failure'&&n.recovery.mode==='none'?'You reached a fail ending':'What can you do next?'}</h2>${choices.length?choices.map(ch=>`<article class="choice-card ${ch.available?'':'blocked'}"><div class="spread"><div><h3>${esc(ch.edge.label||'Continue')}</h3><p>Go to ${esc(nameBy(ch.edge.to))}</p></div>${tag(ch.available?'Open':'Blocked',ch.available?'':'red')}</div>${ch.edge.description?`<p>${esc(ch.edge.description)}</p>`:''}<p>Travel: ${ch.edge.durationMinutes===null?'not set':fmt(ch.edge.durationMinutes)+' min (guess)'} · Path cost: ${esc(costsText(ch.edge))}${nodeBy(ch.edge.to)?.costs.length?' · Node cost: '+esc(costsText(nodeBy(ch.edge.to))):''}</p>${ch.reasons.length?`<ul class="reason-list">${ch.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}${(ch.notes||[]).length?`<p>${esc(ch.notes.join(' '))}</p>`:''}<div class="button-row">${button(ch.available?'Take this path':'You can’t go yet','walk-step',`data-id="${esc(ch.edge.id)}" ${ch.available?'':'disabled'}`,ch.available?'primary small':'small')}${button('See the rules','select',`data-kind="edge" data-id="${esc(ch.edge.id)}"`,'small ghost')}</div></article>`).join(''):`<div class="panel panel-pad"><p class="smalltext muted">${n.type==='ending'?'Your path followed all the rules for this ending. Now playtest it in your real game.':n.type==='failure'?'This node ends the run on purpose. Click Start over to try a different path.':'There are no paths out of here. The player is stuck. Add an arrow, make this an Ending or Failure node, or use Find problems.'}</p><div class="button-row" style="margin-top:14px">${button('See timing & pace','nav','data-page="pacing"','small')}${button('Find problems','nav','data-page="checks"','small')}</div></div>`}<div class="callout" style="margin-top:19px"><strong>This only tests your rules.</strong><p>It does not test jumps, physics, or walls. It cannot tell if players understand the story or have fun. It only checks the rules you entered.</p>${walkState.historyTruncated?'<p>This test got too long to remember every step. Timing only shows the recent steps. Click Start over to see it all.</p>':''}</div></section><aside class="stack"><section class="panel"><div class="panel-head"><h2>What the player has</h2>${tag('Test only','grey')}</div><div class="walk-state">${stateSummary()}</div></section><section class="panel panel-pad"><div class="spread"><h3>Your path so far</h3><span class="smalltext muted">Last 12 steps</span></div>${walkTrace.slice(-12).map((s,i)=>`<div class="trace-row"><span class="trace-n">${walkTrace.length- Math.min(12,walkTrace.length)+i+1}</span><div><strong>${esc(nameBy(s.nodeId))}</strong>${s.location&&s.location!==s.nodeId?`<p class="muted">Sent back to ${esc(nameBy(s.location))}</p>`:''}</div></div>`).join('')}</section></aside></div>`;}
function stateSummary(){return ['flags','items','resources'].map(kind=>`<div class="state-group"><h3>${kind==='flags'?'Flags':kind==='items'?'Items':'Resources'}</h3>${payload().catalogs[kind].length?payload().catalogs[kind].map(c=>`<div class="state-entry"><span>${esc(c.name||'Unnamed')}</span><span class="state-value">${walkState[kind][c.id]===null?'Not set':kind==='flags'?String(walkState[kind][c.id]):fmt(walkState[kind][c.id])}${kind==='resources'&&c.unit?' '+esc(c.unit):''}</span></div>`).join(''):'<p class="hint">None yet.</p>'}</div>`).join('')+`<div class="state-group"><h3>Completed objectives</h3><div class="tags">${walkState.completed.length?walkState.completed.map(id=>tag(nameBy(id),'grey')).join(''):'<p class="hint">No completed objectives yet.</p>'}</div></div><div class="state-group"><h3>Checkpoint</h3><p class="smalltext">${walkState.checkpoint?esc(nameBy(walkState.checkpoint.nodeId)):'None yet'}</p></div><div class="state-group"><h3>Choices made</h3>${Object.keys(walkState.choices).length?Object.entries(walkState.choices).map(([k,id])=>`<p class="smalltext" style="margin-bottom:6px"><strong>${esc(k)}</strong>: ${esc(edgeBy(id)?.label||'Missing path')}</p>`).join(''):'<p class="hint">No pick-one choice made yet.</p>'}</div>`;}
function runAnalysis(){guard(()=>{if(analysisBusy)return;analysisBusy=true;page='checks';render();setTimeout(()=>{try{analysisResult=QF.analyze(payload(),{maxStates:payload().analysis.maxStates});analysisRevision=revision;}catch(err){analysisResult={status:'invalid',exploredStates:0,limit:payload().analysis.maxStates,reachedNodeIds:[],reachableEndingIds:[],findings:[{id:QF.uid(),severity:'error',code:'ANALYSIS_ERROR',title:'The check could not finish',nodeIds:[],edgeIds:[],evidence:err.message,suggestion:'Try again with a smaller search size.'}]};}analysisBusy=false;render();},30);});}
function checksView(){const a=analysisResult;return heading('05 / Find problems','Find the stuck spots before a player does.','The checker tries every path a player could take. It tracks items, rules, choices, and checkpoints. Then it tells you what it found and why.',button(analysisBusy?'Checking…':'Check my design','run-checks',analysisBusy?'disabled':'','primary'))+`<div class="panel panel-pad" style="margin-bottom:20px"><div class="spread" style="flex-wrap:wrap"><div><strong>How big a search?</strong><p class="smalltext muted">A full search tries every possible path. If the search stops early, it cannot be sure about the paths it did not try.</p></div><div class="field" style="max-width:190px"><label for="searchLimit" title="A game state is one moment: where the player is and what they have.">Most game states to try</label><select id="searchLimit">${[50,250,1000,3000,6000,12000].map(n=>`<option value="${n}" ${payload().analysis.maxStates===n?'selected':''}>${fmt(n)} states</option>`).join('')}${![50,250,1000,3000,6000,12000].includes(payload().analysis.maxStates)?`<option value="${payload().analysis.maxStates}" selected>${fmt(payload().analysis.maxStates)} states</option>`:''}</select></div></div></div>${analysisBusy?'<div class="empty" role="status"><h3>Trying every path…</h3><p>Checking costs, choices, and checkpoints.</p></div>':!a?`<div class="panel"><div class="empty"><span class="empty-number">5</span><h3>Ready to check</h3><p>Find missing parts, nodes with no path to them, rules that block players, keys locked behind their own doors, stuck spots, and endings no one can reach.</p>${button('Check my design','run-checks','','primary')}</div></div>`:`<div class="analysis-state ${a.status}"><div><div class="eyebrow" style="margin-bottom:7px">${a.status==='complete'?'Full search done':a.status==='inconclusive'?'Search stopped early':'Your map needs fixes'}</div><h2>${a.status==='complete'?'Every path was checked':a.status==='inconclusive'?'Not finished. Some paths were not tested.':'Fix these problems first.'}</h2><p>${fmt(a.exploredStates||0)} game states checked${a.discoveredStates!==undefined?' / '+fmt(a.discoveredStates)+' found':''} · Max ${fmt(a.limit)}${a.incompleteReasons?.length?' · '+esc(a.incompleteReasons.join('; ')):''}</p></div></div><div class="stats"><div class="stat"><span class="value">${a.reachedNodeIds?.length||0}<small class="muted"> / ${payload().nodes.length}</small></span><span class="label">Nodes a player can reach</span></div><div class="stat"><span class="value">${a.reachableEndingIds?.length||0}</span><span class="label">Endings a player can reach</span></div><div class="stat"><span class="value">${a.findings.filter(f=>f.severity!=='info').length}</span><span class="label">Problems to look at</span></div></div><div class="spread" style="margin-bottom:15px"><h2 style="font-size:18px">What we found</h2><div class="segmented" aria-label="Show problems by type">${['all','error','warning','info'].map(v=>`<button data-action="finding-filter" data-filter="${v}" class="${findingFilter===v?'active':''}" aria-pressed="${findingFilter===v}">${v==='all'?'All':v==='error'?'Error':v==='warning'?'Warning':'Note'}</button>`).join('')}</div></div><div class="findings">${findingsHTML(a)}</div>${a.witnesses?.endings&&Object.keys(a.witnesses.endings).length?`<section class="panel panel-pad" style="margin-top:20px"><h3>Replay a path to an ending</h3><p class="smalltext muted" style="margin:8px 0 13px">Watch a path the checker found. This replaces your current test play. It does not change your design.</p><div class="button-row">${Object.keys(a.witnesses.endings).map(id=>button(esc(nameBy(id)),'replay-ending',`data-id="${esc(id)}"`,'small')).join('')}</div></section>`:''}`}<div class="callout" style="margin-top:20px"><strong>What this check can and cannot tell you</strong><p>The checker only tests the rules you entered and your starting values. It cannot tell if players can really walk or jump somewhere, if walls work, or if the level is fun. A fail ending counts as a real way for the run to end. It is just not a win.</p><p>Marking a node Optional does not skip its rules. A loop is only a problem if players get stuck in it. If some starting values are not set, or the search hits its limit, the result is not final.</p></div>`;}
function findingsHTML(a){const fs=a.findings.filter(f=>findingFilter==='all'||f.severity===findingFilter);if(!fs.length)return '<div class="panel empty"><h3>Nothing in this group</h3><p>Try the other buttons above to see more.</p></div>';return fs.map(f=>`<article class="finding ${esc(f.severity)}"><div class="finding-title">${tag(f.severity==='error'?'Error':f.severity==='warning'?'Warning':f.severity==='info'?'Note':f.severity,f.severity==='error'?'red':f.severity==='warning'?'gold':'grey')}<h3>${esc(f.title)}</h3></div><p><b>What we saw:</b> ${esc(f.evidence)}</p><p class="suggestion"><b>Try this:</b> ${esc(f.suggestion)}</p><div class="button-row">${(f.nodeIds||[]).filter(id=>nodeBy(id)).map(id=>button(esc(nameBy(id)),'select',`data-kind="node" data-id="${esc(id)}"`,'small')).join('')}${(f.edgeIds||[]).filter(id=>edgeBy(id)).slice(0,6).map(id=>button('Path: '+esc(edgeBy(id).label),'select',`data-kind="edge" data-id="${esc(id)}"`,'small ghost')).join('')}</div></article>`).join('');}
function pacingView(){const p=payload(),pc=QFExport.pacing(p,walkTrace),complete=pc.estimateComplete&&walkTrace.length>0&&!walkState?.historyTruncated,target=W.project.sessionLengthMinutes;return heading('06 / Timing & pace','Where does it get intense?','Pacing means how long each part takes and how exciting it feels. This page uses your own time guesses for the path you tested. It is not real play time.')+`${walkTrace.length?`<div class="stats"><div class="stat"><span class="value">${fmt(pc.knownMinutes)}<small> min</small></span><span class="label">${walkState?.historyTruncated?'Time for the recent steps shown':complete?'Guessed time for your test path':'Time so far (some parts have no time set)'}</span></div><div class="stat"><span class="value">${pc.unknownSegments}</span><span class="label">Parts with no time set</span></div><div class="stat"><span class="value">${target===null?'?':fmt(target)}${target===null?'':'<small> min</small>'}</span><span class="label">Your goal play time</span></div></div><section class="panel panel-pad" style="margin-bottom:20px"><div class="spread"><h2 style="font-size:18px">Tension during your test play</h2>${tag('Your guess · 1 to 5','grey')}</div><p class="smalltext muted" style="margin:8px 0 15px">Tension means how exciting or scary a part feels. Each dot is one step. A gap means no tension was set there. Fails and repeat visits show up in order.</p>${tensionChart(pc.points)}${complete&&target!==null&&pc.knownMinutes>target?`<div class="callout warn"><strong>This path is longer than your goal time.</strong><p>Your guess is ${fmt(pc.knownMinutes)} minutes. Your goal is ${fmt(target)} minutes. That is ${fmt(pc.knownMinutes-target)} minutes too long. Try a shorter path or change your goal. Then time a real playtest.</p></div>`:''}</section><section class="panel panel-pad"><h2 style="font-size:18px">Time for each step</h2><p class="smalltext muted" style="margin:7px 0 13px">Time to do the task plus time to travel there. The start has function tensionChart(points){if(!points.length)return '';const pts=points.slice(-100),width=850,height=230,left=35,right=22,top=18,bottom=42,w=width-left-right,h=height-top-bottom;const x=i=>left+(pts.length===1?w/2:i*w/(pts.length-1)),y=v=>top+(5-v)*h/4;let path='',prev=false;for(let i=0;i<pts.length;i++){if(pts[i].tension===null){prev=false;continue;}path+=(prev?'L':'M')+x(i)+','+y(pts[i].tension)+' ';prev=true;}return `<svg class="pacing-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Tension at each step of your test play. The values are also listed below.">${[1,2,3,4,5].map(v=>`<path d="M${left},${y(v)}H${width-right}" stroke="#dfe7dc" stroke-width="1"/><text x="12" y="${y(v)+4}" font-size="10" fill="#6b806c">${v}</text>`).join('')}<path d="${path}" fill="none" stroke="#387454" stroke-width="2.5"/>${pts.map((p,i)=>`${p.tension===null?'':`<circle cx="${x(i)}" cy="${y(p.tension)}" r="4" fill="#215f41"><title>${esc(p.nodeName)}: ${p.tension} of 5</title></circle>`}${pts.length<=18||i%Math.ceil(pts.length/15)===0?`<text x="${x(i)}" y="${height-17}" text-anchor="middle" font-size="9" fill="#71816e">${i+1+(points.length-pts.length)}</text>`:''}`).join('')}</svg><p class="hint">${points.length>100?'Chart shows the last 100 steps. ':''}Tension values in order: ${pts.map((p,i)=>`${i+1+(points.length-pts.length)}: ${p.tension===null?'not set':p.tension}`).join(' · ')}</p>`;}
function exportView(){const cards=[['Project file','JSON · YOUR WHOLE PROJECT','A project file is the .json file this tool saves for you. It has everything in your project. Use it to open your work later, or in our other creator tools.','export-project','Save project file','main-export'],['Map data','JSON · FOR CODERS','Your nodes, arrows, and items as data a coder can read. It cannot be loaded straight into Roblox Studio or another engine.','export-graph','Download map data',''],['Node table','CSV · SPREADSHEET','A spreadsheet of every node, with its rules, costs, rewards, times, and respawn notes.','export-objectives','Download node table',''],['Path table','CSV · SPREADSHEET','A spreadsheet of every arrow, with its rules, costs, pick-one groups, and if it can repeat.','export-connections','Download path table',''],['Build plan','TEXT FILE (.MD) · EASY TO READ','A plan your team can read, with every rule, source links, and your latest check results.','export-brief','Download build plan',''],['Playtest checklist','TEXT FILE (.MD) · TEST PLAN','A to-do list for testing your real game: choices, spending, loops, checkpoints, controls, and jumps. A playtest is when real people try your game.','export-checklist','Download checklist','']];return heading('07 / Save & share','A plan your team can build from.','Save your project file to keep your work safe. Share the easy-to-read files with your team. Then build and test the real game.',button('Save project file','export-project','','primary')+button('Print build plan','print','',''))+`<div class="card-grid">${cards.map(c=>`<section class="export-card ${c[5]}"><span class="file-type">${c[1]}</span><h3>${c[0]}</h3><p>${c[2]}</p>${button(c[4],c[3],'','small')}</section>`).join('')}</div><div class="callout" style="margin-top:20px"><strong>Moving your project to another tool</strong><p>Open your latest project file in the next tool. When you are done there, save a new project file from that tool. Tools do not sync on their own function shortVersion(module,present=true){if(!present)return 'Not in file';if(module===null||typeof module!=='object'||Array.isArray(module))return 'Kept as is ('+(module===null?'null':Array.isArray(module)?'array':typeof module)+')';return module.moduleVersion===undefined?'Kept as is, no version':'v'+(typeof module.moduleVersion==='object'?'[unknown value]':String(module.moduleVersion));}
function proposeSnapshot(raw,kind='import',exampleKey=null){const checked=QF.validateSnapshot(raw);if(!checked.ok){pending=null;openDialog('This file could not be opened',`<div class="callout error"><strong>Something is wrong with this file</strong><p>${esc(checked.error)}</p></div><p style="margin-top:14px">Nothing in your current project changed. Pick a project file made with Save project file. Map data and table files cannot be opened here.</p>`,[{label:'Go back',cls:'primary',fn:closeDialog}]);return {ok:false,error:checked.error};}guard(()=>{pending={snapshot:checked.value,kind,exampleKey,baseRevision:revision,warnings:checked.warnings};showImportPreview();});return {ok:true};}
function showImportPreview(){if(!pending)return;const next=pending.snapshot,old=W,ids=new Set([...Object.keys(old?.tools||{}),...Object.keys(next.tools)]),absent=Object.keys(old?.tools||{}).filter(k=>!own(next.tools,k));const same=old&&old.project.id===next.project.id;const ownAbsent=!Object.prototype.hasOwnProperty.call(next.tools,'level_quest');const title=pending.kind==='import'?'Check this project file':pending.kind==='duplicate'?'Make a copy of this project':pending.kind==='example'?'Open this example':'Start from scratch';const identity=(s,label)=>`<div class="identity-box"><div class="eyebrow">${label}</div><strong>${esc(s?.project.name||'No current project')}</strong>${s?`<small>Game version: ${esc(s.project.gameVersion||'Not set')}</small><small>${esc(s.project.platform||'Platform not set')}</small><span class="mono">${esc(s.project.id)}</span>`:''}</div>`;openDialog(title,`<p>${old?(same?'This is the same project. It may be an older or newer copy.':'This is a different project, even if the name matches.'):'Check the details below before you open it.'} The tool will not mix the two together.</p><div class="identity-grid">${identity(old,'Open now')}${identity(next,'Will open')}</div><p style="margin-bottom:15px">Level map: ${old?.tools.level_quest?.payload.nodes.length??0} nodes / ${old?.tools.level_quest?.payload.edges.length??0} arrows now → ${next.tools.level_quest?.payload.nodes.length??0} nodes / ${next.tools.level_quest?.payload.edges.length??0} arrows after.</p><div class="table-wrap"><table><thead><tr><th>Tool data</th><th>Now</th><th>After</th><th>Change</th></tr></thead><tbody>${[...ids].sort().map(k=>{const ap=own(old?.tools,k),bp=own(next.tools,k),a=ap?old.tools[k]:undefined,b=bp?next.tools[k]:undefined;const status=ap&&!bp?'Will be removed':!ap&&bp?'Added':JSON.stringify(a)===JSON.stringify(b)?'Unchanged':'Replaced';return `<tr><td class="mono">${esc(k)}</td><td>${esc(shortVersion(a,ap))}</td><td>${esc(shortVersion(b,bp))}</td><td>${tag(status,status==='Will be removed'?'red':status==='Unchanged'?'grey':'gold')}</td></tr>`;}).join('')||'<tr><td colspan="4">No tool data in this file.</td></tr>'}</tbody></table></div>${ownAbsent?'<div class="callout" style="margin-top:15px">This file has no level map yet. Opening it adds an empty map and keeps the data from other tools.</div>':''}${absent.length?`<div class="callout warn" style="margin-top:15px"><strong>Some tool data is not in this file</strong><p>${esc(absent.join(', '))}. Opening this removes that data. Save a backup first if you need it.</p></div>`:''}<p style="margin-top:14px">${old?'Opening this replaces your whole current project. Click Save a backup first if you want to keep it.':'This will become your current project.'} Data from other tools is kept as is.</p>`,[{label:'Cancel',fn:()=>{pending=null;closeDialog();} },...(old?[{label:'Save a backup',fn:()=>downloadProject(false)}]:[]),{label:old?'Replace my project':'Open project',cls:'primary',fn:applyPending}]);}
function applyPending(){if(!pending)return false;const p=pending;const candidate=clone(p.snapshot);if(!Object.prototype.hasOwnProperty.call(candidate.tools,'level_quest'))candidate.tools.level_quest={moduleVersion:1,updatedAt:new Date().toISOString(),payload:QF.blankPayload()};const checked=QF.validateSnapshot(candidate);if(!checked.ok){toast(checked.error,true);return false;}W=checked.value;revision++;history=[];draft=null;selection=null;draftDirty=false;manualDirty=p.kind!=='import';analysisResult=null;analysisRevision=-1;walkState=null;walkTrace=[];walkHistory=[];walkError='';guideKey=p.exampleKey;flowSearch=payload().view.listFilter;typeFilter='';catalogSearch='';page=p.kind==='blank'?'brief':'flow';if(page==='brief')initDraft('profile');pending=null;closeDialog();autosaveNow();zoom=.7;render();requestAnimationFrame(()=>{if(page==='flow'&&flowMode==='graph')fitGraph();});window.scrollTo({top:0});toast(p.kind==='import'?'Project opened. Data from other tools was kept.':p.kind==='blank'?'New project ready. Start by writing the player goal.':'Ready. You can change anything in it.');return true;}
function safeFilename(name){return (name||'Avalon_Project').normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'_').replace(/^\.+/,'').slice(0,90)||'Avalon_Project';}

>Rewards / changes: ${esc(effectsText(n))}<br>Repeat costs and rewards: ${n.repeatable?'every visit':'first visit only'} · Optional: ${n.optional?'yes':'no'}<br>Action estimate: ${fmt(n.durationMinutes)} min · Tension: ${fmt(n.tension)} / 5${n.type==='failure'?'<br>Recovery: '+esc(n.recovery.mode):''}${n.recovery.note?'<br>Recovery notes: '+esc(n.recovery.note):''}</p></div>`).join('')}<h2>Connections</h2>${p.edges.map(ed=>`<div class="print-block"><h3>${esc(ed.label)}</h3><p>${esc(nameBy(ed.from))} → ${esc(nameBy(ed.to))}</p><p>${esc(ed.description)}</p><p class="print-rule">ID: ${esc(ed.id)}<br>Requirements: ${esc(conditionText(ed.prerequisites))}<br>Costs: ${esc(costsText(ed))}<br>Changes: ${esc(effectsText(ed))}<br>Repeatable: ${ed.repeatable?'yes':'no'} · Exclusive group: ${esc(ed.choiceGroup||'none')}<br>Travel estimate: ${fmt(ed.durationMinutes)} min</p></div>`).join('')}<h2>Check results</h2>${a?`<p>Status: ${esc(a.status)} · ${fmt(a.exploredStates)} game states checked · Max ${fmt(a.limit)}</p>${a.findings.map(f=>`<div class="print-block"><h3>${esc(f.severity.toUpperCase()+': '+f.title)}</h3><p>${esc(f.evidence)}</p><p>Try this: ${esc(f.suggestion)}</p></div>`).join('')}`:'<p>No check results yet. Use Find problems on this version of your design.</p>'}<h2>Notes</h2><p>${esc(p.notes||'No additional notes.')}</p><p class="report-note">Rules are checked before costs are paid. Costs come first, then path rewards, then node rewards. Values that are not set stay not set. A path on this map does not prove players can really walk, jump, use the controls, understand it, or have fun. Test that in your game with the playtest checklist.</p><h2>Sources</h2>${QFContent.sources.map(s=>`<div class="print-block"><p><strong>${esc(s.title)}</strong> · Reviewed ${esc(s.reviewed)}</p><p class="report-note">${esc(s.url)}</p></div>`).join('')}<hr><p class="report-note">Made by Avalon Partner with Captain Amado. Free to use and share. Code and examples use the AmadOpenSource License 1.0. Keep your project file as your backup. This printout is for sharing with your team.</p>`;}

function addNode(type){guard(()=>{let id;const p=payload(),n=QF.makeNode(type,'New '+TYPES[type].toLowerCase(),80+(p.nodes.length%3)*270,60+Math.floor(p.nodes.length/3)*180);id=n.id;if(mutate(s=>{const p=s.tools.level_quest.payload;p.nodes.push(n);if(!p.startNodeId&&type==='start')p.startNodeId=n.id;})){initDraft('node',id);page='flow';render();toast('Node added. Give it a name, then click Save changes.');}});}
function addNodeDialog(){guard(()=>openDialog('Pick a node type',`<p>A node is a place, a task, or an ending. A Gate is like a locked door. A Checkpoint is a save spot. A Failure is where the player loses. You can change the type later.</p><div class="type-add" style="margin-top:18px">${Object.entries(TYPES).map(([k,v])=>`<button data-add-type="${k}">${v}</button>`).join('')}</div>`,[{label:'Cancel',fn:closeDialog} ]));}
function addEdge(from){guard(()=>{const p=payload();if(!p.nodes.length){toast('Add at least one node first.');return;}const source=p.nodes.find(n=>n.id===from)||p.nodes.find(n=>n.id===selection?.id)||p.nodes[0],dest=p.nodes.find(n=>n.id!==source.id)||source;const edge=QF.makeEdge(source.id,dest.id);edge.label='Continue';if(mutate(s=>s.tools.level_quest.payload.edges.push(edge))){initDraft('edge',edge.id);page='flow';render();toast('Arrow added. Pick where it goes and set its rules.');}});}
function newRule(list){if(!draft)return;const allowed=list==='costs'?['item','resource']:list==='effects'?['flag','item','resource']:['flag','item','resource','completed'];let kind,ref;for(const k of allowed){const entries=k==='completed'?payload().nodes.filter(n=>n.type==='objective'):payload().catalogs[({flag:'flags',item:'items',resource:'resources'})[k]];if(entries.length){kind=k;ref=entries[0].id;break;}}if(!ref){toast('First add a flag, item, or resource in Items & flags, or add an Objective node.',true);return;}const row={id:QF.uid(),kind,ref};if(list==='costs')row.amount=1;else row.value=kind==='flag'||kind==='completed'?true:1;getPath(draft.data,list).push(row);draftDirty=true;const previousOpen=Array.from($$('#inspector details')).map(d=>d.open);render();$('#inspector')?.querySelectorAll('details').forEach((d,i)=>{if(previousOpen[i])d.open=true;});}
function duplicate(kind,id){guard(()=>{const obj=kind==='node'?nodeBy(id):kind==='edge'?edgeBy(id):payload().catalogs[kind.split(':')[1]].find(x=>x.id===id);if(!obj)return;const copy=clone(obj);copy.id=QF.uid();if(kind==='node'){copy.name=(copy.name+' copy').slice(0,200);copy.x=Math.min(10000,copy.x+40);copy.y=Math.min(10000,copy.y+60);}else if(kind==='edge')copy.label=(copy.label+' copy').slice(0,200);else copy.name=(copy.name+' copy').slice(0,200);if(kind==='node'||kind==='edge'){for(const list of [copy.prerequisites.conditions,copy.costs,copy.effects])list.forEach(r=>r.id=QF.uid());}if(mutate(s=>{const p=s.tools.level_quest.payload;if(kind==='node')p.nodes.push(copy);else if(kind==='edge')p.edges.push(copy);else p.catalogs[kind.split(':')[1]].push(copy);})){initDraft(kind,copy.id);render();toast(kind==='node'?'Node copied. Give the copy its own arrows.':'Copy made.');}});}
function deleteRecord(kind,id){guard(()=>{const obj=kind==='node'?nodeBy(id):kind==='edge'?edgeBy(id):payload().catalogs[kind.split(':')[1]].find(x=>x.id===id);if(!obj)return;const connected=kind==='node'?payload().edges.filter(e=>e.from===id||e.to===id).length:0;confirmAction('Delete '+(kind==='edge'?'arrow':kind.startsWith('catalog:')?'this entry':'node')+'?',`${obj.name||obj.label} will be deleted.${connected?' Its '+connected+' arrows will be deleted too.':''} Rules that use it will show as missing in Find problems. You can undo this.`,()=>{if(mutate(s=>{const p=s.tools.level_quest.payload;if(kind==='node'){p.nodes=p.nodes.filter(n=>n.id!==id);p.edges=p.edges.filter(e=>e.from!==id&&e.to!==id);if(p.startNodeId===id)p.startNodeId=null;}else if(kind==='edge')p.edges=p.edges.filter(e=>e.id!==id);else{const k=kind.split(':')[1];p.catalogs[k]=p.catalogs[k].filter(c=>c.id!==id);}})){selection=null;render();toast('Deleted. Click Undo edit to bring it back.');}},'Delete');});}
function addCatalog(kind){guard(()=>{const c={id:QF.uid(),name:kind==='flags'?'New flag':kind==='items'?'New item':'New resource',initial:null};if(kind==='resources')c.unit='';if(mutate(s=>s.tools.level_quest.payload.catalogs[kind].push(c))){initDraft('catalog:'+kind,c.id);page='state';render();$('#inspector input')?.focus();}});}
function undoEdit(){guard(()=>{if(!history.length){toast('Nothing to undo yet.');return;}W=history.pop();W.tools.level_quest.updatedAt=new Date().toISOString();draft=null;draftDirty=false;selection=null;markChanged();render();toast('Last change undone.');});}
function fitGraph(){const v=$('#graphViewport');if(!v)return;const d=graphDimensions();zoom=Math.max(.25,Math.min(1,(v.clientWidth-24)/d.width));drawGraph();const label=$('.zoom-value');if(label)label.textContent=Math.round(zoom*100)+'%';v.scrollTo({top:0,left:0});}
function moveNode(id,dx,dy){if(draftDirty){toast('Save or cancel your form changes before you move a node.');return;}if(mutate(s=>{const n=s.tools.level_quest.payload.nodes.find(n=>n.id===id);if(n){n.x=Math.max(0,Math.min(10000,n.x+dx));n.y=Math.max(0,Math.min(10000,n.y+dy));}})){initDraft('node',id);const v=$('#graphViewport'),scroll=v?{top:v.scrollTop,left:v.scrollLeft}:null;render();if(scroll){$('#graphViewport').scrollTop=scroll.top;$('#graphViewport').scrollLeft=scroll.left;}$$('.graph-node').find(el=>el.dataset.id===id)?.focus({preventScroll:true});}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;event.preventDefault();if(el.disabled)return;if(suppressClick&&el.classList.contains('graph-node')){suppressClick=false;return;}const a=el.dataset.action,id=el.dataset.id,kind=el.dataset.kind;
  if(a==='home'){guard(()=>{page='start';draft=null;draftDirty=false;render();window.scrollTo({top:0});});return;}
  if(a==='new'){proposeSnapshot(QF.newSnapshot('Untitled project'),'blank');return;}
  if(a==='example'){const ex=QFContent.examples.find(x=>x.key===el.dataset.key);if(ex)proposeSnapshot(ex.create(),'example',ex.key);return;}
  if(a==='continue'){gotoPage(payload().nodes.length?'flow':'brief');return;}
  if(a==='import'){$('#importFile').click();return;}
  if(a.startsWith('export-')){doExport(a);return;}
  if(a==='nav'){gotoPage(el.dataset.page);return;}
  if(a==='select'){selectObject(kind,id);return;}
  if(a==='flow-mode'){flowMode=el.dataset.mode;render();return;}
  if(a==='add-node'){addNodeDialog();return;}
  if(a==='add-type'){addNode(el.dataset.type);return;}
  if(a==='add-edge'){addEdge(el.dataset.from);return;}
  if(a==='add-catalog'){addCatalog(kind);return;}
  if(a==='duplicate'){duplicate(kind,id);return;}
  if(a==='delete'){deleteRecord(kind,id);return;}
  if(a==='revert-draft'){if(draft){initDraft(draft.kind,draft.id);render();}return;}
  if(a==='set-start'){guard(()=>{if(mutate(s=>{s.tools.level_quest.payload.startNodeId=id;})){initDraft('node',id);render();}});return;}
  if(a==='undo'){undoEdit();return;}
  if(a==='add-rule'){newRule(el.dataset.list);return;}
  if(a==='remove-rule'){if(draft){getPath(draft.data,el.dataset.list).splice(Number(el.dataset.index),1);draftDirty=true;render();}return;}
  if(a==='fit'){fitGraph();return;}
  if(a==='zoom-in'||a==='zoom-out'){zoom=Math.max(.25,Math.min(1.5,zoom+(a==='zoom-in'?.1:-.1)));drawGraph();$('.zoom-value').textContent=Math.round(zoom*100)+'%';return;}
  if(a==='restart-walk'){startWalk();render();return;}
  if(a==='walk-step'){takeStep(id);return;}
  if(a==='undo-step'){if(walkHistory.length){walkState=walkHistory.pop();walkTrace=clone(walkState.path);render();}return;}
  if(a==='run-checks'){runAnalysis();return;}
  if(a==='finding-filter'){findingFilter=el.dataset.filter;render();return;}
  if(a==='replay-ending'){const path=analysisResult?.witnesses?.endings?.[id];if(path&&startWalk()){for(const edgeId of path.edgeIds){const next=QF.step(payload(),walkState,edgeId);if(!next.ok){toast('Replay stopped: '+next.reasons.join(' '),true);break;}walkHistory.push(clone(walkState));if(walkHistory.length>100)walkHistory.shift();walkState=next.state;}walkTrace=clone(walkState.path);page='walk';render();window.scrollTo({top:0});}return;}
  if(a==='print'){printReport();return;}
  if(a==='duplicate-project'){guard(()=>{const copy=clone(W);copy.project.id=QF.uid();copy.project.name=(copy.project.name+' copy').slice(0,300);copy.tools.level_quest.updatedAt=new Date().toISOString();proposeSnapshot(copy,'duplicate');});return;}
});
$('#dialog').addEventListener('click',event=>{const type=event.target.closest('[data-add-type]');if(type){const t=type.dataset.addType;closeDialog();addNode(t);return;}const b=event.target.closest('[data-dialog]');if(!b)return;if(b.dataset.dialog==='close'){pending=null;closeDialog();}else dialogHandlers[b.dataset.dialog]?.();});
$('#dialog').addEventListener('cancel',()=>{pending=null;dialogHandlers={};});
document.addEventListener('submit',event=>{if(event.target.id==='draftForm'){event.preventDefault();saveDraft();}});
function readDraftInput(el){if(!draft)return;const path=el.dataset.path;let v;if(el.type==='checkbox')v=el.checked;else if(el.dataset.valueType==='number')v=el.value===''?null:el.valueAsNumber;else if(el.dataset.valueType==='boolean')v=el.value==='true';else if(path==='tension')v=el.value===''?null:Number(el.value);else if(path==='initial'&&draft.kind==='catalog:flags')v=el.value===''?null:el.value==='true';else v=el.value;if(typeof v==='number'&&!Number.isFinite(v))return;setPath(draft.data,path,v);draftDirty=true;if($('#draftStatus'))$('#draftStatus').textContent='Not saved yet';}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.path)readDraftInput(el);if(el.dataset.arrayPath&&draft){const vals=el.value.split(el.dataset.separator==='newline'?'\n':',').map(x=>x.trim()).filter(Boolean);setPath(draft.data,el.dataset.arrayPath,vals);draftDirty=true;if($('#draftStatus'))$('#draftStatus').textContent='Not saved yet';}if(el.id==='flowSearch'){flowSearch=el.value;refreshFlowList();}if(el.id==='catalogSearch'){catalogSearch=el.value;$('#catalogResults').innerHTML=catalogCards();}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.path){readDraftInput(el);if(el.dataset.path.endsWith('.kind')&&draft){const path=el.dataset.path.split('.');path.pop();const row=getPath(draft.data,path.join('.')),entries=row.kind==='completed'?payload().nodes.filter(n=>n.type==='objective'):payload().catalogs[({flag:'flags',item:'items',resource:'resources'})[row.kind]];row.ref=entries[0]?.id||'missing-'+row.kind;row.value=row.kind==='flag'||row.kind==='completed'?true:1;if(path[0]==='costs'){delete row.value;row.amount=row.amount||1;}if(!entries.length)toast('No '+row.kind+' exists yet. Add one in Items & flags, or add an Objective node.',true);render();}else if(el.dataset.path==='type')render();}if(el.id==='typeFilter'){typeFilter=el.value;refreshFlowList();}if(el.id==='searchLimit'){const limit=Number(el.value);if(mutate(s=>s.tools.level_quest.payload.analysis.maxStates=limit))render();}});
$('#importFile').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;if(file.size>QF.LIMITS.bytes){proposeSnapshot('x'.repeat(QF.LIMITS.bytes+1));return;}try{proposeSnapshot(await file.text(),'import');}catch(error){toast('Could not read that file. '+error.message,true);}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();doExport('export-project');return;}const n=event.target.closest('.graph-node');if(n&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const amount=event.shiftKey?100:20;moveNode(n.dataset.id,event.key==='ArrowLeft'?-amount:event.key==='ArrowRight'?amount:0,event.key==='ArrowUp'?-amount:event.key==='ArrowDown'?amount:0);}else if(event.target.classList?.contains('edge-click')&&['Enter',' '].includes(event.key)){event.preventDefault();selectObject('edge',event.target.dataset.id);}});
document.addEventListener('pointerdown',event=>{const el=event.target.closest('.graph-node');if(!el||event.button!==0)return;if(draftDirty)return;const n=nodeBy(el.dataset.id);drag={id:n.id,startX:event.clientX,startY:event.clientY,x:n.x,y:n.y,newX:n.x,newY:n.y,moved:false,el,pointerId:event.pointerId};el.setPointerCapture(event.pointerId);});
document.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.pointerId)return;const dx=(event.clientX-drag.startX)/zoom,dy=(event.clientY-drag.startY)/zoom;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<8)return;drag.moved=true;drag.newX=Math.round(Math.max(0,Math.min(10000,drag.x+dx)));drag.newY=Math.round(Math.max(0,Math.min(10000,drag.y+dy)));drag.el.style.left=drag.newX+'px';drag.el.style.top=drag.newY+'px';});
document.addEventListener('pointerup',event=>{if(!drag||event.pointerId!==drag.pointerId)return;const d=drag;drag=null;if(d.moved){suppressClick=true;if(mutate(s=>{const n=s.tools.level_quest.payload.nodes.find(n=>n.id===d.id);n.x=d.newX;n.y=d.newY;})){initDraft('node',d.id);const v=$('#graphViewport'),x=v.scrollLeft,y=v.scrollTop;render();$('#graphViewport').scrollLeft=x;$('#graphViewport').scrollTop=y;}else drawGraph();setTimeout(()=>suppressClick=false,50);}});
document.addEventListener('pointercancel',()=>{if(drag){drag=null;drawGraph();}});
window.addEventListener('beforeunload',event=>{if(draftDirty||manualDirty){event.preventDefault();event.returnValue='';}});
window.addEventListener('beforeprint',()=>{if(W)buildPrintReport();});
const headerObserver=new ResizeObserver(()=>{document.documentElement.style.setProperty('--header-height',$('#appHeader').getBoundingClientRect().height+'px');});headerObserver.observe($('#appHeader'));
window.QFApp=Object.freeze({getSnapshot:()=>W?clone(W):null,getState:()=>({page,draftDirty,manualDirty,storageFailed,revision,pending:!!pending,analysis:analysisResult?clone(analysisResult):null,walk:walkState?clone(walkState):null}),importText:raw=>proposeSnapshot(raw,'import'),applyPending:()=>applyPending(),cancelPending:()=>{pending=null;closeDialog();},autosaveNow:()=>autosaveNow(),exportSnapshot:()=>W?JSON.stringify(W,null,2):null,render:()=>render()});
restoreBrowser();render();
})();
</script>
</body>
