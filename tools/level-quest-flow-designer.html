    });
    const delivery = node('objective', 'Deliver a supply crate', 730, 420, {
      description: 'A repeatable side quest: spend one crate and earn one coin on every completion.',
      durationMinutes: 0.7, tension: 2, repeatable: true, optional: true,
      costs: [cost('resource', crates.id, 1)], effects: [effect('resource', coins.id, 1)]
    });
    const council = node('gate', 'Enter the council', 390, 650, {
      description: 'Both preparation flags must be true. Pay two coins on the first entry; revisits do not charge again.',
      durationMinutes: 0.3, tension: 3,
      prerequisites: requirements([condition('flag', signal.id, true), condition('flag', trust.id, true)], 'AND'),
      costs: [cost('resource', coins.id, 2)]
    });
    const alliance = node('choice', 'Choose your alliance', 390, 840, {
      description: 'Hear both offers. Choosing one pledge locks the other route for this walkthrough.',
      durationMinutes: 0.8, tension: 4
    });
    const watchPledge = node('objective', 'Pledge to the harbor watch', 60, 1030, {
      description: 'Promise to defend the town. This choice sets the watch pledge flag.',
      durationMinutes: 0.4, tension: 4, effects: [effect('flag', watch.id, true)]
    });
    const captainPledge = node('objective', 'Pledge to the free captains', 730, 1030, {
      description: 'Promise to protect the fleet’s independence. This choice sets the captains pledge flag.',
      durationMinutes: 0.4, tension: 4, effects: [effect('flag', captains.id, true)]
    });
    const end = node('ending', 'Seal the harbor pact', 390, 1240, {
      description: 'Conclude with either alliance. The OR requirement accepts one true pledge flag.',
      durationMinutes: 0.5, tension: 1,
      prerequisites: requirements([condition('flag', watch.id, true), condition('flag', captains.id, true)], 'OR')
    });
    p.nodes.push(start, square, repair, scout, delivery, council, alliance, watchPledge, captainPledge, end);
    p.startNodeId = start.id;
    p.edges.push(
      edge(start, square, 'Meet the town', {durationMinutes: 0.3}),
      edge(square, repair, 'Visit the signal tower', {durationMinutes: 0.4}),
      edge(repair, square, 'Return from the tower', {durationMinutes: 0.4}),
      edge(square, scout, 'Find the scout', {durationMinutes: 0.4}),
      edge(scout, square, 'Return with the chart', {durationMinutes: 0.4}),
      edge(square, delivery, 'Carry one supply crate', {durationMinutes: 0.2}),
      edge(delivery, square, 'Return for another task', {durationMinutes: 0.2}),
      edge(square, square, 'Restock: one coin for one crate', {
        description: 'Intentional repeatable trade. Cost and reward conserve the five-unit pool until coins are spent at the council.',
        durationMinutes: 0.2, costs: [cost('resource', coins.id, 1)], effects: [effect('resource', crates.id, 1)]
      }),
      edge(square, council, 'Request a council audience', {durationMinutes: 0.2}),
      edge(council, alliance, 'Hear both offers', {durationMinutes: 0.1}),
      edge(alliance, watchPledge, 'Choose the harbor watch', {durationMinutes: 0.1, choiceGroup: 'harbor-alliance'}),
      edge(alliance, captainPledge, 'Choose the free captains', {durationMinutes: 0.1, choiceGroup: 'harbor-alliance'}),
      edge(watchPledge, alliance, 'Review the chosen alliance', {durationMinutes: 0.1}),
      edge(captainPledge, alliance, 'Review the chosen alliance', {durationMinutes: 0.1}),
      edge(alliance, end, 'Conclude the pact', {durationMinutes: 0.1})
    );
    return snapshot;
  }

  const examples = [
    {
      key: 'key_adventure', title: 'The Tideglass Archive', subtitle: 'Key and door adventure',
      description: 'Learn the difference between having a key and using it up. It has a rope shortcut and a way back.',
      guide: [
        'Go to Test play and walk to the courtyard. The archive door is blocked because you have 0 brass keys.',
        'Search the fallen statue, go back, and open the archive door. You still have the key.',
        'Break the coffer seal. The key gets used up, and you get the ledger.',
        'Unbar the door from inside, go back to the courtyard, and leave with the ledger.',
        'Want to see a bug? Delete the rope shortcut. Then make the key reachable only from inside the locked door. Now use Find problems.'
      ],
      create: keyAdventure
    },
    {
      key: 'obby', title: 'Cloudstep Courier', subtitle: 'Roblox checkpoint obby',
      description: 'Plan a jump course with a bonus pickup and two kinds of checkpoint respawn.',
      guide: [
        'In Test play, touch the rooftop checkpoint and pick the early fall. You go back and keep what you had.',
        'Clear the short jumps and touch the tower checkpoint.',
        'Take the silver ledge, cross the beams, then pick the late fall.',
        'Look at your items and completed objectives. The tower checkpoint put things back to how they were there.',
        'Reach the beacon. Then playtest the real jumps, camera, respawn spots, and controls in Roblox Studio.'
      ],
      create: obby
    },
    {
      key: 'branching_quest', title: 'The Lantern Harbor Pact', subtitle: 'Branching quest with a task you can repeat',
      description: 'Mix AND and OR rules, costs you can pay again and again, and a choice where you can pick only one side.',
      guide: [
        'In Test play, repair the signal, go back to the square, and look at the council path. AND needs both flags, so one is not enough.',
        'Help the scout. Try delivering two supply crates, going back to the square each time. You start with two coins, so you can skip this extra task.',
        'Enter the council. It costs two coins the first time.',
        'Pick one side and go back to the choice node. The other side is now locked.',
        'Seal the pact. Its OR rule accepts either side. You can trade a coin for a crate to keep delivering while you have coins.'
      ],
      create: branchingQuest
    }
  ];

  const guidance = [
    {title: 'Write an action a player can recognize', body: 'Prefer “Place the three crystals in the altar” to “Complete the area.” Record the required quantity, the visible feedback, and what changes afterward.'},
    {title: 'Possession and spending are separate', body: 'A requirement asks whether a quantity is available. A cost removes that quantity. A gate that only checks a key leaves it in inventory; add a key cost when use should consume it.'},
    {title: 'Make repeat rules explicit', body: 'Repeatable nodes apply their costs and rewards again. Nonrepeatable nodes do so on the first visit only. Repeatable connections can be taken again; a one-use connection is spent after traversal. Use both controls deliberately.'},
    {title: 'Record what failure preserves', body: 'A checkpoint captures a declared state. Keep-state recovery returns there without rolling back earned progress. Snapshot recovery restores the saved flags, quantities, objective progress, and route choices. Test both against your intended game rules.'},
    {title: 'Treat pacing as an estimate', body: 'Action and travel durations come from the creator. A route sum excludes everything not modeled, including hesitation, retries, loading, and real movement difficulty. Tension is an intended 1 to 5 rating, not player telemetry.'},
    {title: 'Use the latest project file', body: 'Export the full project JSON, then import that latest file into another compatible tool. Other tool modules are preserved as inert data. Files do not synchronize automatically; importing replaces the workspace after review.'}
  ];
  globalThis.QFContent = {sources, examples, guidance};
})();

<script>/*

 * SPDX-License-Identifier: LicenseRef-AmadOpenSource-1.0
 * Original implementation. Referenced documentation is not bundled third-party code.
 */
(function (root) {
  'use strict';

  const TYPES = {
    start: 'Starting point', location: 'Location', objective: 'Objective',
    choice: 'Dialogue / choice', gate: 'Gate', checkpoint: 'Checkpoint',
    reward: 'Reward', failure: 'Failure', ending: 'Ending'
  };
  const asText = value => value === null || value === undefined ? '' : String(value);
  const hasNumber = value => typeof value === 'number' && Number.isFinite(value);
  const isDuration = value => hasNumber(value) && value >= 0;
  // Remove floating-point summation noise without turning tiny declared times into zero.
  // Raw quantity/duration fields in CSV and JSON are never passed through this helper.
  const round = value => Number(value.toPrecision(15));
  const printable = value => value === null || value === undefined ? 'Unknown' : typeof value === 'boolean' ? (value ? 'True' : 'False') : String(value);
  const cleanLine = value => asText(value).replace(/\r\n?|\n/g, ' ').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '');
  // All imported prose remains plain Markdown text. In particular, HTML tags,
  // links, headings and table delimiters in names never become active markup.
  function md(value) {
    return cleanLine(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\\/g, '\\\\').replace(/([`*_{}\[\]()#+.!|~-])/g, '\\$1');
  }
  function paragraph(value) {
    if (!asText(value).trim()) return 'Not recorded.';
    return asText(value).split(/\r\n?|\n/).map(line => md(line)).join('  \n');
  }
  function csvCell(value) {
    let result = asText(value);
    // Spreadsheet formula injection defense changes CSV presentation only.
    // The project and graph JSON always retain the original string unchanged.
    if (typeof value === 'string' && (
      /^[\u0000-\u0020\u007f-\u009f]*[=+\-@]/.test(result) ||
      /^[\u0000-\u0020\u007f-\u009f]*[\t\r\n]/.test(result)
    )) result = "'" + result;
    return '"' + result.replace(/"/g, '""') + '"';
  }
  const csv = rows => rows.map(row => row.map(csvCell).join(',')).join('\r\n') + '\r\n';
  function table(headers, rows) {
    return [
      '| ' + headers.map(md).join(' | ') + ' |',
      '| ' + headers.map(() => '---').join(' | ') + ' |',
      ...rows.map(row => '| ' + row.map(md).join(' | ') + ' |')
    ].join('\n');
  }
  function getPayload(snapshot) {
    const payload = snapshot && snapshot.tools && snapshot.tools.level_quest && snapshot.tools.level_quest.payload;
    if (!payload || !Array.isArray(payload.nodes) || !Array.isArray(payload.edges) || !payload.catalogs) {
      throw new Error('A supported level_quest module is required to export this design.');
    }
    return payload;
  }
  function label(payload, kind, id) {
    const list = kind === 'completed' ? payload.nodes : payload.catalogs[kind === 'flag' ? 'flags' : kind === 'item' ? 'items' : 'resources'];
    const entry = (list || []).find(record => record.id === id);
    return entry ? (entry.name || '(Unnamed)') + (kind === 'resource' && entry.unit ? ' (' + entry.unit + ')' : '') : 'Missing reference ' + id;
  }
  function conditionText(payload, condition) {
    const name = label(payload, condition.kind, condition.ref);
    if (condition.kind === 'flag') return 'Flag ' + name + ' is ' + printable(condition.value).toLowerCase();
    if (condition.kind === 'completed') return 'Objective ' + name + (condition.value ? ' is completed' : ' is not completed');
    if (condition.kind === 'item') return 'Possess at least ' + printable(condition.value) + ' ' + name + ' (not consumed)';
    return 'Have at least ' + printable(condition.value) + ' ' + name + ' (not spent)';
  }
  function requirements(payload, prerequisites) {
    const conditions = prerequisites && prerequisites.conditions || [];
    if (!conditions.length) return 'None';
    return (prerequisites.mode === 'OR' ? 'OR: any one' : 'AND: all') + ' of [' + conditions.map(c => conditionText(payload, c)).join('; ') + ']';
  }
  function costs(payload, list) {
    return list && list.length ? list.map(cost => 'Consume ' + printable(cost.amount) + ' ' + label(payload, cost.kind, cost.ref)).join('; ') : 'None';
  }
  function effects(payload, list) {
    return list && list.length ? list.map(effect => {
      const name = label(payload, effect.kind, effect.ref);
      if (effect.kind === 'flag') return 'Set ' + name + ' to ' + printable(effect.value).toLowerCase();
      return (effect.value >= 0 ? 'Add ' : 'Remove ') + printable(Math.abs(effect.value)) + ' ' + name;
    }).join('; ') : 'None';
  }
  function recovery(node) {
    if (node.type === 'checkpoint') return 'Save full current state as the latest checkpoint';
    if (node.type !== 'failure') return 'None';
    const mode = node.recovery && node.recovery.mode;
    if (mode === 'checkpoint_keep') return 'Return to latest checkpoint; keep current progress, inventory, resources and choices';
    if (mode === 'checkpoint_restore') return 'Return to latest checkpoint; restore its saved progress, inventory, resources and choices';
    return 'Declared failure endpoint; no recovery';
  }
  function estimate(value) { return isDuration(value) ? value : ''; }
  function nodeApplication(node) { return node.repeatable ? 'Costs and effects on every visit' : 'Costs and effects on first visit only; prerequisites on every visit'; }
  function edgeApplication(edge) { return edge.repeatable ? 'Repeatable; costs and effects on every traversal' : 'One-shot until restart or checkpoint rollback'; }

  function objectiveCSV(snapshot) {
    const p = getPayload(snapshot);
    const headers = ['Node ID', 'Name', 'Type', 'Player action / description', 'Prerequisites', 'Consumed costs', 'Rewards / effects', 'Effect application', 'Optional content', 'Estimated action minutes', 'Intended tension (1-5)', 'Checkpoint / failure recovery', 'Recovery notes', 'Selected start', 'Outgoing connection IDs'];
    const rows = p.nodes.map(n => [
      n.id, n.name, TYPES[n.type] || n.type, n.description,
      requirements(p, n.prerequisites), costs(p, n.costs), effects(p, n.effects), nodeApplication(n),
      n.optional ? 'Yes' : 'No', estimate(n.durationMinutes), n.tension === null || n.tension === undefined ? '' : n.tension,
      recovery(n), n.recovery && n.recovery.note || '', p.startNodeId === n.id ? 'Yes' : 'No',
      p.edges.filter(e => e.from === n.id).map(e => e.id).join('; ')
    ]);
    return csv([headers, ...rows]);
  }
  function connectionsCSV(snapshot) {
    const p = getPayload(snapshot);
    const nodeName = id => { const node = p.nodes.find(n => n.id === id); return node ? node.name : 'Missing node ' + id; };
    return csv([
      ['Connection ID', 'From node ID', 'From name', 'To node ID', 'To name', 'Choice / route label', 'Description', 'Prerequisites', 'Consumed costs', 'Rewards / effects', 'Repeatability', 'Mutually exclusive group', 'Estimated travel minutes'],
      ...p.edges.map(e => [e.id, e.from, nodeName(e.from), e.to, nodeName(e.to), e.label, e.description,
        requirements(p, e.prerequisites), costs(p, e.costs), effects(p, e.effects), edgeApplication(e), e.choiceGroup, estimate(e.durationMinutes)])
    ]);
  }

  function sourceSection() {
    const sources = root.QFContent && Array.isArray(root.QFContent.sources) ? root.QFContent.sources : [];
    if (!sources.length) return 'Source details are not attached to this export. Consult the Sources section of the designer. The rules described here are the designer\'s declared simulation model.';
    return sources.map(s => {
      let url = '';
      try { const parsed = new URL(s.url); if (['https:', 'http:'].includes(parsed.protocol)) url = parsed.href; } catch (_) { /* Omit malformed or active links. */ }
      return '### ' + md(s.title) + '\n\n' + (url ? '<' + url.replace(/</g, '%3C').replace(/>/g, '%3E') + '>\n\n' : 'Source URL unavailable.\n\n') +
        'Reviewed: ' + md(s.reviewed || 'Not recorded') + '.\n\n' + paragraph(s.summary || '') + (s.scope ? '\n\nScope: ' + paragraph(s.scope) : '');
    }).join('\n\n');
  }
  function catalogSection(payload) {
    const groups = [['flags', 'Flags', 'Boolean'], ['items', 'Inventory', 'items'], ['resources', 'Resources', 'units']];
    return groups.map(([key, title, units]) => {
      const entries = payload.catalogs[key] || [];
      return '### ' + title + '\n\n' + (entries.length ? table(['ID', 'Name', 'Initial value', 'Units'], entries.map(e => [e.id, e.name, printable(e.initial), key === 'resources' ? e.unit || 'units' : units])) : 'None declared.');
    }).join('\n\n');
  }
  function findingSection(analysis, payload) {
    if (!analysis) return 'No analysis run was supplied with this export. Run the declared-logic checks in the app before implementing the design.';
    const affected = (ids, kind) => (ids || []).map(id => {
      const row = (kind === 'nodes' ? payload.nodes : payload.edges).find(e => e.id === id);
      return (row ? row.name || row.label || id : 'Missing object') + ' [' + id + ']';
    }).join('; ') || 'None listed';
    const findings = analysis.findings || [];
    const status = analysis.status === 'inconclusive' ? 'INCONCLUSIVE: the search stopped before all reachable states were evaluated. Unvisited content has not been proved unreachable.' :
      analysis.status === 'invalid' ? 'INVALID: repair the reported structural problems before relying on the search.' :
      'COMPLETE within the declared model and displayed state limits. This is not a physical or enjoyment playtest.';
    const stat = 'Explored states: ' + printable(analysis.exploredStates) + '. State limit: ' + printable(analysis.limit) + '.';
    if (!findings.length) return status + '\n\n' + stat + '\n\nNo findings were returned for this run. This does not establish that engine implementation, geometry, collisions, difficulty or enjoyment are correct.';
    return status + '\n\n' + stat + '\n\n' + findings.map((f, index) => [
      '### ' + (index + 1) + '. ' + md(f.title),
      'Classification: ' + md(f.severity || 'info') + '. Rule: ' + md(f.code || f.id || 'Not supplied') + '.',
      'Affected nodes: ' + md(affected(f.nodeIds, 'nodes')) + '.',
      'Affected connections: ' + md(affected(f.edgeIds, 'edges')) + '.',
      'Evidence: ' + paragraph(Array.isArray(f.evidence) ? f.evidence.join('; ') : f.evidence),
      'Suggested change or playtest: ' + paragraph(f.suggestion)
    ].join('\n\n')).join('\n\n');
  }
  function brief(snapshot, analysis = null) {
    const p = getPayload(snapshot), project = snapshot.project;
    const nodeName = id => { const n = p.nodes.find(n => n.id === id); return n ? n.name : 'Not set / missing'; };
    const info = [
      ['Project identity', project.id], ['Game version', project.gameVersion || 'Not recorded'],
      ['Platform', project.platform || 'Not recorded'], ['Engine', project.engine || 'Not recorded'],
      ['Genre', project.genre || 'Not recorded'], ['Audience', project.targetAudience || 'Not recorded'],
      ['Devices', (project.targetDevices || []).join(', ') || 'Not recorded'], ['Stage', project.stage || 'Not recorded'],
      ['Design pillars', (project.designPillars || []).join('; ') || 'Not recorded'],
      ['Intended session length (minutes)', printable(project.sessionLengthMinutes)],
      ['Selected start', nodeName(p.startNodeId) + (p.startNodeId ? ' [' + p.startNodeId + ']' : '')],
      ['Module version', snapshot.tools.level_quest.moduleVersion], ['Module updated', snapshot.tools.level_quest.updatedAt]
    ];
    const nodeBlocks = p.nodes.length ? p.nodes.map((n, i) => {
      const details = [
        ['Stable ID', n.id], ['Type', TYPES[n.type] || n.type], ['Optional content', n.optional ? 'Yes' : 'No'],
        ['Prerequisites', requirements(p, n.prerequisites)], ['Consumed costs', costs(p, n.costs)],
        ['Rewards / effects', effects(p, n.effects)], ['Application', nodeApplication(n)],
        ['Estimated action duration (minutes)', printable(n.durationMinutes)], ['Intended tension (1-5)', printable(n.tension)],
        ['Recovery', recovery(n)], ['Recovery notes', n.recovery && n.recovery.note || 'None'],
        ['Canvas coordinates (layout only)', 'x=' + n.x + ', y=' + n.y]
      ];
      const outbound = p.edges.filter(e => e.from === n.id);
      return '### ' + (i + 1) + '. ' + md(n.name || '(Unnamed node)') + '\n\n' + paragraph(n.description) + '\n\n' + table(['Property', 'Value'], details) +
        '\n\nOutgoing choices: ' + (outbound.length ? outbound.map(e => md((e.label || '(Unnamed route)') + ' -> ' + nodeName(e.to) + ' [' + e.id + ']')).join('; ') : 'None declared') + '.';
    }).join('\n\n') : 'No nodes have been added.';
    const edgeBlocks = p.edges.length ? p.edges.map((e, i) => '### ' + (i + 1) + '. ' + md(e.label || '(Unnamed route)') + '\n\n' + paragraph(e.description) + '\n\n' + table(['Property', 'Value'], [
      ['Stable ID', e.id], ['From', nodeName(e.from) + ' [' + e.from + ']'], ['To', nodeName(e.to) + ' [' + e.to + ']'],
      ['Prerequisites', requirements(p, e.prerequisites)], ['Consumed costs', costs(p, e.costs)], ['Rewards / effects', effects(p, e.effects)],
      ['Repeatability', edgeApplication(e)], ['Mutually exclusive group', e.choiceGroup || 'None'], ['Estimated travel duration (minutes)', printable(e.durationMinutes)]
    ])).join('\n\n') : 'No connections have been added.';
    return [
      '# ' + md(project.name || 'Untitled project') + ': level and quest implementation brief',
      'Avalon Partner | Captain Amado\n\nGenerated: ' + new Date().toISOString() + '. Module: level_quest v1.',
      '## Read this design',
      'This brief describes a declared design. Requirements and state changes are explicit rules; durations and tension are creator estimates. The graph cannot establish physical traversal, collisions, control feel or enjoyment. Implement and playtest those in the target engine. There is no direct Roblox or other engine import in this tool.',
      '## Shared project profile', table(['Field', 'Value'], info),
      '## Player goal', paragraph(p.goal), '## Success criteria', paragraph(p.successCriteria), '## Design notes', paragraph(p.notes),
      '## State and rule semantics',
      '- Prerequisites are evaluated on the state before this move spends costs or grants effects. AND requires every condition; OR requires at least one. Empty prerequisites impose no condition.\n- Possessing an item or resource does not consume it. A separate positive cost consumes it. Costs on the connection and a fresh destination node are combined before spending, preventing double-spending the same quantity.\n- Connection effects are applied before destination-node effects. Flag effects set a boolean; inventory and resource effects are signed changes. Unknown initial values are not treated as zero or false and cannot satisfy a dependent requirement. An explicit flag-setting effect can establish a known boolean.\n- Nonrepeatable node costs and effects apply on its first visit only. Revisiting does not farm its reward. Its prerequisites still apply on every visit. Repeatable nodes apply costs and effects on every visit.\n- Repeatable connections may be used again. A nonrepeatable connection is consumed after a traversal.\n- A nonempty choice group commits to its selected connection and blocks every other connection in that group. A repeatable selected connection can still recur.\n- Entering an objective records it as completed. Entering a checkpoint saves state. A failure either ends that run or returns to the checkpoint with the stated keep/restore behavior. Restoration can undo progress, spending and choice commitments made after that checkpoint.\n- An ending is a successful terminal state in this planner. Declare adverse terminal outcomes with the failure node type.\n- Canvas coordinates are a diagram layout, not level geometry. Timing records expected travel/action duration, not measured playtime.',
      '## Initial flags, inventory and resources', catalogSection(p),
      '## Node implementation records', nodeBlocks,
      '## Connection implementation records', edgeBlocks,
      '## Declared-logic analysis', findingSection(analysis, p),
      '## Handoff and project files',
      'Move your latest full avalon.creator-project JSON file between creator tools. Each tool edits only its own namespace and explicit shared-profile edits. File transfer is manual; nothing is automatically synchronized or delivered to another tool. A same-name project can have a different identity. This readable brief and CSV tables are reference exports, not supported project-import formats. The separate avalon.level-quest-graph JSON is portable graph data, not a Roblox or engine importer.',
      'Browser autosave is a convenience. Downloaded HTML and browser storage are not backups of each other. Export a project JSON backup before moving the HTML, switching browsers, clearing storage or replacing the current project.',
      '## Reviewed sources', sourceSection(),
      '## License',
      'Original application code and original templates: Copyright (c) 2026 Joshua Amado. Free and source available under the AmadOpenSource License 1.0. Use it for anything, including paid work; what you make with it is yours. The tool itself may not be sold or turned into a paid product. Creator-entered project content retains its creator\'s rights. Linked documentation remains subject to its publisher\'s terms; no third-party source code is bundled in this export.'
    ].join('\n\n') + '\n';
  }

  function checklist(snapshot, analysis = null) {
    const p = getPayload(snapshot);
    const lines = [
      '# ' + md(snapshot.project.name || 'Untitled project') + ': playtest checklist',
      'Avalon Partner | Captain Amado\n\nProject: ' + md(snapshot.project.id) + '\n\nGame version: ' + md(snapshot.project.gameVersion || 'Not recorded') + '\n\nGenerated: ' + new Date().toISOString(),
      'Tester: ____________________  Date: ____________________  Build: ____________________\n\nEngine / device / input method: ____________________\n\nTest scenario and starting state: ____________________',
      '## Preparation',
      '- [ ] Export the latest project JSON and record the tested game version.\n- [ ] Explain the player goal in plain language without relying on prior knowledge.\n- [ ] Confirm the intended start and each initial flag, inventory quantity and resource balance. Resolve unknown values needed by the scenario.\n- [ ] Compare the implemented rules with the design; note differences before running the test.\n- [ ] Run the planner checks and record whether the search completed or was inconclusive.\n- [ ] Keep observed results separate from estimates and assumptions.',
      '## Main routes and completion',
      '- [ ] Walk a successful route from the declared start to an ending without debug commands.\n- [ ] Try leaving each required action incomplete; record the explanation shown to the player.\n- [ ] Test optional routes and return paths before and after the main objective is completed.'
    ];
    const ends = p.nodes.filter(n => n.type === 'ending');
    if (ends.length) lines.push(ends.map(n => '- [ ] Reach ending ' + md(n.name) + ' [' + md(n.id) + '] with its declared state. Record the exact route and final quantities.').join('\n'));
    const conditional = [...p.nodes.map(n => ({...n, objectLabel: 'node ' + n.name})), ...p.edges.map(e => ({...e, objectLabel: 'connection ' + (e.label || e.id)}))].filter(o => o.prerequisites && o.prerequisites.conditions && o.prerequisites.conditions.length);
    if (conditional.length) {
      lines.push('## Requirements and blocked progress');
      lines.push(conditional.map(o => '- [ ] Test ' + md(o.objectLabel) + ' [' + md(o.id) + ']: ' + md(requirements(p, o.prerequisites)) + '. Test a satisfying state and a failing state; for AND test only one requirement, for OR test each alternative separately.').join('\n'));
    }
    const consumption = [...p.nodes, ...p.edges].filter(o => o.costs && o.costs.length);
    if (consumption.length) {
      lines.push('## Inventory and resource spending');
      lines.push('- [ ] Distinguish possession checks from consumed costs. Verify that a possession-only key remains in inventory.\n- [ ] Try a quantity just below the cost, exactly the cost and above the cost. Check combined route and destination costs.\n- [ ] Try spending the last required resource on optional content; confirm that a successful path still exists or that the intended consequence is clear.');
      lines.push(consumption.map(o => '- [ ] At ' + md(o.name || o.label || o.id) + ' [' + md(o.id) + '], verify ' + md(costs(p, o.costs)) + ' and the correct post-action balance.').join('\n'));
    }
    const repeats = p.nodes.filter(n => n.repeatable);
    const repeatEdges = p.edges.filter(e => e.repeatable);
    if (repeats.length || repeatEdges.length) {
      lines.push('## Repetition and loops');
      lines.push('- [ ] Take each intentional loop at least twice. Check that it remains usable and that every charge/reward applies only as declared.\n- [ ] Revisit nonrepeatable objectives and rewards; verify that their effects do not farm again.\n- [ ] Check whether repetition can produce unbounded resources. Decide an explicit design cap, cooldown or sink if needed; the planner does not infer one.\n- [ ] Exhaust one-shot routes or finite supplies and test an exit from the resulting state.');
      if (repeats.length) lines.push(repeats.map(n => '- [ ] Repeat ' + md(n.name) + ' [' + md(n.id) + '] twice and record inventory/resources after each run.').join('\n'));
    }
    const groups = [...new Set(p.edges.map(e => e.choiceGroup).filter(Boolean))];
    if (groups.length) {
      lines.push('## Mutually exclusive branches');
      lines.push(groups.map(group => '- [ ] Group ' + md(group) + ': choose each alternative in a fresh walkthrough. Verify that the other group choices become unavailable, and test checkpoint rollback if choice commitments should reset.').join('\n'));
    }
    const cp = p.nodes.filter(n => n.type === 'checkpoint' || n.type === 'failure');
    if (cp.length) {
      lines.push('## Checkpoints and failure recovery');
      lines.push('- [ ] Fail before the first checkpoint and confirm the intended behavior.\n- [ ] Fail after earning an item, spending resources and committing to a choice. Compare each restored or retained value with the declared recovery rule.\n- [ ] Confirm the physical respawn position, safe landing area, camera/input recovery and retry instructions in the engine.');
      lines.push(cp.map(n => '- [ ] Test ' + md(n.name) + ' [' + md(n.id) + ']: ' + md(recovery(n)) + '.').join('\n'));
    }
    lines.push('## Physical implementation and player experience');
    lines.push('- [ ] Check actual distances, jumps, doors, collision volumes and reachable surfaces in the engine. A graph edge does not prove traversability.\n- [ ] Try mouse/keyboard, touch and any other intended input method. Check readable prompts, focus, target size and controls.\n- [ ] Watch a new player find the next objective without coaching; record confusing landmarks and instructions.\n- [ ] Observe the intended tension at difficult sections and the relief offered by safe areas. Tension values are design intent, not player measurements.\n- [ ] Time the tested route, including travel, actions, retries and choices. Record measured time alongside the original estimate instead of silently replacing it.\n- [ ] Inspect real saved progress, reconnect/rejoin behavior and multiplayer interactions if the game implements them. These are not simulated by the offline planner.');
    if (analysis && analysis.findings && analysis.findings.length) {
      lines.push('## Findings to verify');
      lines.push(analysis.findings.map(f => '- [ ] ' + md(f.title) + ': ' + md(f.suggestion || 'Review the evidence and reproduce the relevant state.') + ' Rule: ' + md(f.code || f.id || 'Not recorded') + '.').join('\n'));
    }
    lines.push('## Observation log');
    lines.push(table(['Scenario / route', 'Expected result', 'Observed result', 'Measured minutes', 'Device / build', 'Change / retest'], [['', '', '', '', '', ''], ['', '', '', '', '', ''], ['', '', '', '', '', '']]));
    lines.push('## Decision after the playtest');
    lines.push('- [ ] Keep as designed.\n- [ ] Revise the design and rerun declared-logic checks.\n- [ ] Revise engine implementation and repeat the same scenario.\n- [ ] Gather more observations before deciding.\n\nEvidence and next action: ________________________________________');
    lines.push('This checklist provides test prompts, not proof that a level is enjoyable or production-ready.');
    return lines.join('\n\n') + '\n';
  }

  function pacing(payload, trace) {
    const nodeById = new Map((payload.nodes || []).map(n => [n.id, n]));
    const edgeById = new Map((payload.edges || []).map(e => [e.id, e]));
    let knownMinutes = 0, unknownSegments = 0, totalSegments = 0;
    const points = (Array.isArray(trace) ? trace : []).map(entry => {
      const node = nodeById.get(entry.nodeId), hasEdge = entry.edgeId !== null && entry.edgeId !== undefined && entry.edgeId !== '';
      const edge = hasEdge ? edgeById.get(entry.edgeId) : null;
      const nodeMinutes = node && isDuration(node.durationMinutes) ? node.durationMinutes : null;
      const edgeMinutes = edge && isDuration(edge.durationMinutes) ? edge.durationMinutes : null;
      totalSegments += hasEdge ? 2 : 1;
      if (nodeMinutes === null) unknownSegments++; else knownMinutes += nodeMinutes;
      if (hasEdge) { if (edgeMinutes === null) unknownSegments++; else knownMinutes += edgeMinutes; }
      const complete = nodeMinutes !== null && (!hasEdge || edgeMinutes !== null);
      return {
        nodeId: entry.nodeId,
        nodeName: node ? node.name || '(Unnamed node)' : 'Missing node ' + entry.nodeId,
        estimatedMinutes: complete ? round(nodeMinutes + (hasEdge ? edgeMinutes : 0)) : null,
        knownCumulativeMinutes: round(knownMinutes),
        tension: node && hasNumber(node.tension) ? node.tension : null,
        edgeMinutes,
        nodeMinutes
      };
    });
    return {knownMinutes: round(knownMinutes), unknownSegments, totalSegments, points, estimateComplete: unknownSegments === 0 && points.length > 0};
  }

Avalon Partner | Captain Amado

Module key: \`level_quest\`. Root schema: \`avalon.creator-project\` version 1. Module version: 1.

## Transfer a project

Export the full project JSON and move your **latest project file** between tools. This is explicit file transfer. The HTML does not synchronize, send data to another app, interpret foreign modules or import a level directly into an engine.

A project identity is a UUID generated once and retained when saved. Matching names do not establish matching identity. An explicit Duplicate project action creates a new identity. Node, connection, catalog, condition, cost and effect IDs remain stable until an object is explicitly duplicated or replaced. Duplicating a node creates new IDs for the node and its nested rule records.

The shared envelope is:

\`\`\`json
{
  "format": "avalon.creator-project",
  "schemaVersion": 1,
  "project": {
    "id": "00000000-0000-4000-8000-000000000001",
    "name": "",
    "platform": "",
    "engine": "",
    "genre": "",
    "targetAudience": "",
    "targetDevices": [],

    "gameVersion": "",

    }

\`\`\`

The UUID and timestamp above are illustrative. The app generates a real UUID and writes an actual ISO 8601 timestamp when the module is changed. An exported unchanged foreign module retains its own timestamp and data.

## Shared profile

| Field | Type and meaning |
| --- | --- |
| id | UUID string; not an ordinary editable profile field |
| name, platform, engine, genre, targetAudience, stage, gameVersion | Strings; blank means not recorded |
| targetDevices, designPillars | Arrays of strings |
| sessionLengthMinutes | Nonnegative number in minutes, or null for unknown |

This tool changes only its own namespace and explicit edits to these shared fields. Full project export preserves unfamiliar modules and fields as inert JSON. Their presence is not a claim that their meaning has been validated. Unsupported root schemas and unsupported versions of this module are refused without replacing the workspace. There is no automatic timestamp winner and no automatic divergent-snapshot merge.

## Payload records

### Main fields

| Field | Meaning |
| --- | --- |
| goal | The player's intended outcome |
| successCriteria | How the designer will recognize completion |
| notes | Additional design context |
| startNodeId | ID of selected starting node, or null |
| catalogs | Initial flags, inventory items and resources |
| nodes | Diagram and state-changing actions |
| edges | Directed routes and choices |
| view.listFilter | Optional saved list-filter text |
| analysis.maxStates | Maximum states to explore before reporting an inconclusive search |

### Catalogs

Flags: \`{id, name, initial}\`, with initial true, false or null.

Inventory items: \`{id, name, initial}\`, with a nonnegative initial quantity or null.

Resources: \`{id, name, unit, initial}\`, with a human-readable unit, nonnegative initial quantity or null.

Null means unknown. It is not zero or false. An unknown value cannot satisfy a rule that depends on it. An explicit flag-setting effect can establish a known boolean; numeric deltas cannot resolve an unknown starting quantity. All names are presentation labels; rules resolve the stable ID in \`ref\`.

### Nodes

\`\`\`json
{
  "id": "a-stable-object-id",
  "type": "objective",
  "name": "Find the bronze key",
  "description": "Search the courtyard for the key.",
  "x": 320,
  "y": 160,
  "optional": false,
  "repeatable": false,
  "durationMinutes": null,
  "tension": null,
  "prerequisites": { "mode": "AND", "conditions": [] },
  "costs": [],
  "effects": [],
  "recovery": { "mode": "none", "note": "" }
}
\`\`\`

Node types are \`start\`, \`location\`, \`objective\`, \`choice\`, \`gate\`, \`checkpoint\`, \`reward\`, \`failure\` and \`ending\`. The label may use engine-specific language while the type retains the same behavior.

Coordinates \`x\` and \`y\` are diagram positions, not physical world coordinates. The selected \`startNodeId\` identifies the walkthrough entry. Duration is the creator's estimated action time in minutes; null means not estimated. Tension is a creator-selected number from 1 to 5, or null; it is not an observed emotion or a validated benchmark.

\`optional\` documents intent; it does not bypass prerequisites. \`repeatable\` controls whether the node's costs and effects apply again on later visits. Nonrepeatable nodes can be traversed again but do not reapply their costs/effects. Prerequisites apply on every visit.

Entering an objective adds its ID to completed objectives. Entering an ending completes the run successfully. Entering a failure with no recovery is an intentional failure endpoint. A graph with a deliberate failure still requires checking for accidental blocked states elsewhere.

### Directed connections

\`\`\`json
{
  "id": "a-stable-connection-id",
  "from": "source-node-id",
  "to": "target-node-id",
  "label": "Open the door",
  "description": "Take the route into the tower.",
  "durationMinutes": null,
  "prerequisites": { "mode": "AND", "conditions": [] },
  "costs": [],
  "effects": [],
  "choiceGroup": "",
  "repeatable": true
}
\`\`\`

Connections are directed; a return trip requires a separate connection. Duration is estimated travel time in minutes, separate from the target's action time. An empty label or description is allowed.

A repeatable connection remains usable when its requirements are met. A nonrepeatable connection is consumed after one traversal. Connections with the same nonempty \`choiceGroup\` are mutually exclusive: selecting one commits the run to that connection and disables the others in its group. A repeatable selected connection may still be reused. Group names are exact, case-sensitive strings, not object IDs.

### Prerequisites

\`{mode: "AND" | "OR", conditions: [{id, kind, ref, value}]}\`

| kind | ref points to | value and test |
| --- | --- | --- |
| flag | Flag ID | Boolean; current flag equals value |
| item | Inventory ID | Number; current quantity is at least value |
| resource | Resource ID | Number; current balance is at least value |
| completed | Objective node ID | Boolean; completed status equals value |

AND requires every declared condition; OR requires at least one. An empty condition list imposes no requirement for either mode. This version supports one flat AND or OR group per node or connection. To represent more complex boolean expressions, use successive gates or alternate routes.

An item or resource requirement checks possession only. It does not spend the quantity. A cost is a separate record.

### Costs and effects

Cost: \`{id, kind: "item" | "resource", ref, amount}\`. The positive amount is consumed.

Effect: \`{id, kind: "flag" | "item" | "resource", ref, value}\`. A flag value is boolean. Inventory/resource values are signed deltas: positive adds, negative removes.

For a traversal:

1. Check connection and destination prerequisites against the state before the move.
2. Combine connection costs with destination costs that apply on this visit. Check affordability for the combined total.
3. Deduct costs atomically. Unknown balances cannot pay costs. A blocked move leaves the prior walkthrough state intact.
4. Apply connection effects, then destination effects that apply on this visit. A move cannot leave a negative inventory/resource quantity.
5. Record node visit, objective completion, connection use and exclusive choice. Apply checkpoint or failure behavior where declared.

A reward earned on this move cannot satisfy a prerequisite checked earlier on the same move. Add a separate step if the design needs that ordering.

### Checkpoint recovery

\`recovery.mode\` is one of:

| Mode | Behavior at a failure |
| --- | --- |
| none | Declared failure endpoint; no recovery |
| checkpoint_keep | Move to the saved checkpoint, keeping current progress, flags, inventory, resources and choice commitments |
| checkpoint_restore | Restore the saved checkpoint state, including its progress, quantities and choices |

Recovery modes are evaluated only on failure nodes. A retained recovery mode on a location, objective or other non-failure node is inert. Checkpoint nodes save state regardless of their retained recovery.mode value. Entering a checkpoint saves the current state. A later checkpoint replaces the previous checkpoint. Recovery notes document physical spawn position, retry expectations or other engine implementation details; notes do not execute behavior.

Walkthrough state is separate from the saved design. Restarting a walkthrough returns to declared initial state. Walkthrough logs are observations of the planner's state model, not remotely collected telemetry and not measured engine playtime.

## Analysis and pacing

The planner explores declared state transitions, including requirements, spending, rewards, repetition and exclusive choices. Structural reachability alone does not prove a route is usable. Findings identify affected objects, evidence and a suggested change or playtest.

A bounded analysis reports explored states and its limit. If the search is cut short, the result is **inconclusive**. Content not reached before that limit is not proved unreachable. Intentional repeatable loops can create an unbounded quantity of states; the tool must disclose this limit instead of inventing a successful or failed score.

The pacing view follows the walkthrough trace. Each visited action and traversed connection contributes its declared duration, including repeated visits. The known subtotal is the sum of recorded estimates. Each missing node or route duration is counted as an unknown segment; a complete total is available only when every traced segment has an estimate. A declared duration of zero is distinct from unknown. The chart shows intended tension at nodes, not an empirical player measurement.

The graph cannot validate 3D geometry, traversable jumps, collisions, engine scripts, networking, saved online progress or enjoyment. Test these in the actual game and record observed results separately.

## Exports

| Export | Content | Supported as full project import? |
| --- | --- | --- |
| Project JSON | Full shared envelope and every tool module | Yes, after validation and replacement preview |
| Graph JSON | \`avalon.level-quest-graph\` v1, small project identity and cloned level_quest module | No; reference data for a developer |
| Objective CSV | All nodes with IDs, conditions, costs/effects, timing and recovery | No |
| Connection CSV | All directed routes with rules, groups and travel estimates | No |
| Implementation brief | Readable Markdown records and optional current analysis | No |
| Playtest checklist | Markdown tasks and blank observation log | No |

Graph JSON envelope: \`{format: "avalon.level-quest-graph", schemaVersion: 1, project: {id, name, gameVersion, platform, engine}, module: {...original level_quest module...}}\`.

CSV fields use comma delimiters, CRLF record separators and escaped double quotes. Cells are quoted. Strings that could trigger spreadsheet formulas are prefixed with an apostrophe; this applies to leading control/whitespace followed by =, +, - or @, and leading tab/newline controls. Blank duration cells mean unknown, not zero. Original values remain unchanged in project and graph JSON. Markdown renders imported names and notes as escaped text, and only reviewed HTTP/HTTPS source links are navigable.

## Import and save behavior

Before replacing a workspace, the app validates the shared envelope, supported own-module version/payload and generic JSON safety/size limits. It previews identity, game version and module changes, including modules that would disappear, and offers a backup. Canceled or invalid imports leave the current workspace intact. Foreign modules are preserved as inert JSON and their tool-specific semantics are not validated. No CSV or specialized record import is implied.

Browser autosave may be unavailable or blocked. The app reports save success or failure and always offers manual project JSON export/import. File-based localStorage behavior varies by browser. Browser storage, downloaded HTML and a downloaded JSON backup are different things. Moving the file, changing browsers or clearing storage can make autosaved work unavailable.
